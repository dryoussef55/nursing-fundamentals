LECTURES.push({
  id: "health",
  en: "Health and Illness",
  ar: "الصحة والمرض",
  cards: [
    { q: "Define health.", a: "A complete state of physical, mental and social well-being, not just the absence of disease. Health integrates all aspects of the person: physical, intellectual, emotional, sociocultural, spiritual and environmental.", qar: "عرّف الصحة.", aar: "حالة كاملة من العافية الجسدية والنفسية والاجتماعية، وليست مجرد غياب المرض. وتتكامل فيها كل جوانب الشخص: الجسدية والفكرية والعاطفية والاجتماعية والثقافية والروحية والبيئية.", ref: "slide 5" },
    { q: "Define illness.", a: "An individual experience of altered health. It is hard to define because people perceive illness differently.", qar: "عرّف المرض (الشعور بالمرض).", aar: "تجربة فردية لصحة متغيرة، ويصعب تعريفه لأن الناس يدركون المرض بطرق مختلفة.", ref: "slide 5" },
    { q: "Define disease.", a: "A medical term referring to a pathological change in body or mind structure or function.", qar: "عرّف الداء.", aar: "مصطلح طبي يشير إلى تغير مرضي في بنية الجسم أو العقل أو وظيفتهما.", ref: "slide 5" },
    { q: "List the causes of disease.", a: "Inherited genetic defects; developmental defects from exposure to factors such as viruses or chemicals during pregnancy; biologic agents or toxins; physical agents such as temperature, chemicals and radiation; physiologic and emotional reactions to stress; excessive or insufficient production of body secretions (hormones, enzymes).", qar: "اذكر أسباب الداء.", aar: "عيوب جينية موروثة؛ وعيوب نموية بسبب التعرض لعوامل كالفيروسات أو المواد الكيميائية أثناء الحمل؛ وعوامل بيولوجية أو سموم؛ وعوامل فيزيائية كالحرارة والمواد الكيميائية والإشعاع؛ واستجابات فسيولوجية وانفعالية للضغط النفسي؛ وزيادة أو نقص إفرازات الجسم (الهرمونات والإنزيمات).", ref: "slide 6" },
    { q: "How are illnesses classified? Can a person have more than one type at once?", a: "Acute or chronic. A person may have both at the same time; for example, an adult with diabetes (chronic) may also have appendicitis (acute).", qar: "كيف تُصنَّف الأمراض؟ وهل يمكن أن يجمع الشخص أكثر من نوع؟", aar: "حادة أو مزمنة. وقد يجمع الشخص بينهما؛ فمريض السكري (مزمن) قد يصاب أيضًا بالتهاب الزائدة الدودية (حاد).", ref: "slide 7" },
    { q: "Describe an acute illness.", a: "Rapid onset of symptoms and lasts a relatively short time. Some are life threatening but many do not require medical attention; if care is required, treatment is specific (antibiotics for pneumonia, appendectomy for appendicitis).", qar: "صف المرض الحاد.", aar: "ظهور سريع للأعراض ومدة قصيرة نسبيًا. بعضها مهدد للحياة لكن كثيرًا منها لا يحتاج رعاية طبية؛ وإذا احتاج علاجًا فهو محدد (مضادات حيوية للالتهاب الرئوي، استئصال الزائدة لالتهابها).", ref: "slide 8" },
    { q: "What factors affect illness behavior?", a: "Age, gender, economic status, culture, educational level, and mental status.", qar: "ما العوامل المؤثرة في سلوك المرض؟", aar: "العمر، والنوع، والحالة الاقتصادية، والثقافة، والمستوى التعليمي، والحالة النفسية.", ref: "slide 9" },
    { q: "List the four stages of illness behavior.", a: "Stage 1: experiencing symptoms. Stage 2: assuming the sick role (patient action). Stage 3: assuming a dependent role. Stage 4: achieving recovery and rehabilitation.", qar: "اذكر مراحل سلوك المرض الأربع.", aar: "المرحلة 1: الشعور بالأعراض. المرحلة 2: تقمّص دور المريض (تصرف المريض). المرحلة 3: قبول دور التابع (قبول المرض والعلاج). المرحلة 4: تحقيق التعافي وإعادة التأهيل.", ref: "slide 10" },
    { q: "Describe Stage 1: experiencing symptoms.", a: "The first indication of illness is recognizing one or more symptoms. Pain is the most significant symptom; others include rash, fever, bleeding or cough. If symptoms are short-lived or relieved by self-care, the person takes no further action; if they continue, the person enters the next stage.", qar: "صف المرحلة الأولى: الشعور بالأعراض.", aar: "أول مؤشر على المرض هو ملاحظة عرَض واحد أو أكثر. الألم هو أهم الأعراض، ومنها أيضًا الطفح والحمى والنزيف والسعال. إذا زالت الأعراض سريعًا أو بالعناية الذاتية لا يفعل الشخص شيئًا؛ وإذا استمرت ينتقل للمرحلة التالية.", ref: "slide 11" },
    { q: "Describe Stage 2: assuming the sick role.", a: "The person defines himself or herself as sick, gives up normal activities, focuses on symptoms and bodily functions, and seeks out a health care provider for diagnosis and treatment. When help is sought, the person becomes a patient and enters the next stage.", qar: "صف المرحلة الثانية: تقمّص دور المريض.", aar: "يعرّف الشخص نفسه بأنه مريض، ويتخلى عن أنشطته المعتادة، ويركز على أعراضه ووظائف جسمه، ويلتمس مقدم رعاية صحية للتشخيص والعلاج. وعند طلب المساعدة يصبح الشخص مريضًا وينتقل للمرحلة التالية.", ref: "slide 12" },
    { q: "Describe Stage 3: assuming a dependent role.", a: "The patient decides to accept the diagnosis and follow the prescribed treatment plan; conforms to the opinions of others (e.g., agreeing to stay in bed when the doctor says so); needs emotional support through acceptance, approval and protection; and adheres to treatment.", qar: "صف المرحلة الثالثة: قبول دور التابع.", aar: "يقرر المريض قبول التشخيص واتباع خطة العلاج الموصوفة؛ ويمتثل لآراء الآخرين (مثل الموافقة على الراحة في السرير عندما يطلب الطبيب)؛ ويحتاج دعمًا عاطفيًا بالتقبل والاستحسان والحماية؛ ويلتزم بالعلاج.", ref: "slide 13" },
    { q: "What is the nursing role during Stage 3 (dependent role)?", a: "Provide patient knowledge about the treatment plan to improve compliance, and provide knowledge about the disease, diagnosis and medical management.", qar: "ما دور التمريض في المرحلة الثالثة (دور التابع)؟", aar: "تزويد المريض بمعرفة عن خطة العلاج لتحسين التزامه، ومعرفة عن المرض والتشخيص والإدارة الطبية.", ref: "slide 13" },
    { q: "What factors affect the patient's reaction during Stage 3?", a: "Seriousness of illness; the patient's degree of fear about the disease; loss of roles; the support of others; previous experiences with illness care.", qar: "ما العوامل المؤثرة في استجابة المريض خلال المرحلة الثالثة؟", aar: "خطورة المرض؛ ودرجة خوف المريض منه؛ وفقدان الأدوار؛ ودعم الآخرين؛ والخبرات السابقة مع المرض والرعاية.", ref: "slide 14" },
    { q: "Describe Stage 4: achieving recovery and rehabilitation.", a: "Recovery and rehabilitation may begin in the hospital and conclude at home or at a rehabilitation center; most patients complete this stage at home. The patient gives up the dependent role and returns to normal activities and responsibilities.", qar: "صف المرحلة الرابعة: تحقيق التعافي وإعادة التأهيل.", aar: "قد يبدأ التعافي وإعادة التأهيل في المستشفى ويكتمل في المنزل أو في مركز تأهيل؛ ومعظم المرضى يكملون هذه المرحلة في المنزل. ويتخلى المريض عن دور التابع ويعود إلى أنشطته ومسؤولياته الطبيعية.", ref: "slide 15" },
    { q: "List the characteristics of chronic illness.", a: "It is a permanent change; it causes, or is caused by, irreversible alterations in normal anatomy and physiology; it requires a long period of care or support; it usually has a slow onset; and it usually has periods of remission. Examples: heart problems, diabetes mellitus, lung disease, arthritis.", qar: "اذكر خصائص المرض المزمن.", aar: "تغير دائم؛ ويسبب أو ينتج عن تغيرات لا رجعة فيها في التشريح والفسيولوجيا الطبيعية؛ ويحتاج فترة طويلة من الرعاية أو الدعم؛ ويبدأ عادة ببطء؛ وعادة ما تكون له فترات هدوء (سكون). أمثلة: أمراض القلب، والسكري، وأمراض الرئة، والتهاب المفاصل.", ref: "slides 17-18" },
    { q: "What is a period of remission?", a: "A period when the disease is present but the person does not experience symptoms.", qar: "ما فترة الهدوء (السكون) في المرض المزمن؟", aar: "فترة يكون فيها المرض موجودًا لكن الشخص لا يشعر بأعراض.", ref: "slide 18" },
    { q: "What is the nursing management for patients with chronic illness?", a: "Teach the client to live as normally as possible; maintain a positive self-concept and sense of hope; help the client modify activities of daily living, relationships and self-care; maintain the person's feeling of being in control of his or her own life and the prescribed treatment.", qar: "ما الإدارة التمريضية لمرضى الأمراض المزمنة؟", aar: "تعليم المريض أن يعيش بشكل طبيعي قدر الإمكان؛ والحفاظ على صورة ذاتية إيجابية وإحساس بالأمل؛ ومساعدته على تعديل أنشطة الحياة اليومية والعلاقات والعناية الذاتية؛ والحفاظ على شعوره بالسيطرة على حياته وعلاجه الموصوف.", ref: "slide 19" },
    { q: "Why does chronic illness create stress for the patient and family?", a: "Because chronic illness requires frequent hospitalization, causes economic problems, and decreases social interactions among family members.", qar: "لماذا يسبب المرض المزمن ضغطًا على المريض وأسرته؟", aar: "لأنه يتطلب دخول المستشفى بشكل متكرر، ويسبب مشكلات اقتصادية، ويقلل التفاعلات الاجتماعية بين أفراد الأسرة.", ref: "slide 20" },
    { q: "How do family members respond to illness?", a: "Responses are individualized: some members want to be with the patient all the time, others may avoid visiting; parents of a sick child often react with blame, overprotection and severe anxiety.", qar: "كيف يستجيب أفراد الأسرة للمرض؟", aar: "الاستجابات فردية: بعضهم يريد البقاء مع المريض طوال الوقت، وآخرون قد يتجنبون الزيارة؛ وغالبًا ما يتفاعل والدا الطفل المريض باللوم والحماية الزائدة والقلق الشديد.", ref: "slide 21" },
    { q: "Why were models of health and illness developed? List the five models.", a: "Because it is difficult to provide universal definitions of health and illness. The models are: agent-host-environment model, health-illness continuum, high-level wellness model, health belief model, and health promotion model.", qar: "لماذا طُوّرت نماذج الصحة والمرض؟ اذكر النماذج الخمسة.", aar: "لصعوبة وضع تعريفات موحدة للصحة والمرض. النماذج هي: نموذج العامل-المضيف-البيئة، ومتصل الصحة-المرض، ونموذج العافية عالية المستوى، ونموذج المعتقدات الصحية، ونموذج تعزيز الصحة.", ref: "slide 23" },
    { q: "Describe the agent-host-environment model.", a: "Developed by Leavell and Clark (1965) for community health; useful for examining causes of diseases. The agent, host and environment interact to create risk factors, and understanding these is important for health promotion.", qar: "صف نموذج العامل-المضيف-البيئة.", aar: "طوّره ليفيل وكلارك (1965) لصحة المجتمع؛ ويفيد في دراسة أسباب الأمراض. يتفاعل العامل والمضيف والبيئة مكوّنين عوامل الخطر، وفهمها مهم لتعزيز الصحة.", ref: "slide 24" },
    { q: "In the agent-host-environment model, define agent, host and environment.", a: "Agent: an environmental factor or stressor that must be present or absent for an illness to occur. Host: a living organism capable of being infected or affected by an agent. Environment: all factors external to the host that make illness more or less likely (physical, social, biologic, cultural).", qar: "في نموذج العامل-المضيف-البيئة، عرّف العامل والمضيف والبيئة.", aar: "العامل: عامل بيئي أو مُجهِد يجب أن يوجد أو يغيب ليحدث المرض. المضيف: كائن حي قابل للإصابة أو التأثر بالعامل. البيئة: كل العوامل الخارجية عن المضيف التي تزيد أو تقلل احتمال المرض (فيزيائية واجتماعية وبيولوجية وثقافية).", ref: "slides 24-25" },
    { q: "Give the lecture's example of environment increasing risk in the agent-host-environment model.", a: "A person who has poor nutritional habits and gets little sleep is at increased risk for infection during an outbreak of influenza.", qar: "اذكر مثال المحاضرة على زيادة الخطر بسبب البيئة في نموذج العامل-المضيف-البيئة.", aar: "الشخص الذي لديه عادات غذائية سيئة وينام قليلًا يكون أكثر عرضة للعدوى أثناء تفشي الأنفلونزا.", ref: "slide 25" },
    { q: "Describe the health-illness continuum model.", a: "A way to measure a person's level of health. Health is a constantly changing (dynamic) state with high-level wellness and death on opposite ends of a graduated scale; people move along the continuum as they adapt to changes in the internal and external environments to maintain well-being.", qar: "صف نموذج متصل الصحة-المرض.", aar: "طريقة لقياس مستوى صحة الشخص. الصحة حالة متغيرة باستمرار (ديناميكية)، تقع العافية عالية المستوى والموت على طرفيها المتقابلين؛ ويتحرك الناس على امتدادها كلما تكيفوا مع تغيرات البيئة الداخلية والخارجية للحفاظ على العافية.", ref: "slide 28" },
    { q: "Describe the high-level wellness model.", a: "Halbert Dunn (1961): functioning to one's maximum potential while maintaining balance and a purposeful direction in the environment.", qar: "صف نموذج العافية عالية المستوى.", aar: "هالبرت دان (1961): أن يعمل الشخص بأقصى إمكاناته مع الحفاظ على التوازن والاتجاه الهادف في البيئة.", ref: "slide 31" },
    { q: "How did Dunn differentiate wellness from good health?", a: "Good health is a passive state in which the person is not ill; wellness is a more active state, oriented toward maximizing the potential of the individual regardless of his or her state of health.", qar: "كيف ميّز دان بين العافية والصحة الجيدة؟", aar: "الصحة الجيدة حالة سلبية لا يكون فيها الشخص مريضًا؛ أما العافية فحالة أكثر نشاطًا تهدف إلى تعظيم إمكانات الفرد مهما كانت حالته الصحية.", ref: "slide 31" },
    { q: "Describe the health belief model (Rosenstock, 1974).", a: "Explains how people's perceptions influence health behavior through perceived susceptibility (belief about the likelihood of contracting a disease) and perceived seriousness (belief about the severity and impact of the disease on the person's lifestyle).", qar: "صف نموذج المعتقدات الصحية (روزنستوك، 1974).", aar: "يفسر كيف تؤثر تصورات الناس في سلوكهم الصحي من خلال القابلية المدركة (الاعتقاد باحتمال الإصابة بمرض) والخطورة المدركة (الاعتقاد بشدة المرض وتأثيره في نمط حياة الشخص).", ref: "slide 32" },
    { q: "Give the smoker example for perceived susceptibility and perceived seriousness.", a: "Susceptibility: one smoker may believe he is in danger of lung cancer and stop smoking, while another believes smoking poses no serious threat and continues. Seriousness: if the smoker believes lung cancer can lead to disability or death and affect his ability to work and care for the family, he is more likely to stop.", qar: "اذكر مثال المدخن على القابلية المدركة والخطورة المدركة.", aar: "القابلية: مدخن قد يعتقد أنه معرض لخطر سرطان الرئة فيقلع، وآخر يعتقد أن التدخين لا يشكل تهديدًا خطيرًا فيستمر. الخطورة: إذا اعتقد المدخن أن سرطان الرئة قد يسبب إعاقة أو وفاة تؤثر في قدرته على العمل ورعاية أسرته، فالأرجح أن يقلع.", ref: "slide 32" },
    { q: "Describe the health promotion model (Pender, 1996).", a: "Illustrates how people interact with their environment while pursuing health. It incorporates individual characteristics and experiences plus behavior-specific knowledge and beliefs to motivate health-promoting behaviors.", qar: "صف نموذج تعزيز الصحة (بيندر، 1996).", aar: "يوضح كيف يتفاعل الناس مع بيئتهم أثناء سعيهم للصحة؛ ويدمج الخصائص والخبرات الفردية مع المعرفة والمعتقدات الخاصة بالسلوك لتحفيز السلوكيات المعززة للصحة.", ref: "slide 33" },
    { q: "In Pender's model, how do individual characteristics affect health behavior?", a: "High self-esteem and adequate income promote positive health behaviors (healthy diet, exercise); low self-esteem and low socioeconomic status often lead to poor nutrition and substance use.", qar: "في نموذج بيندر، كيف تؤثر الخصائص الفردية في السلوك الصحي؟", aar: "تقدير الذات المرتفع والدخل الكافي يعززان سلوكيات صحية إيجابية (غذاء صحي، رياضة)؛ أما تقدير الذات المنخفض والمستوى الاجتماعي الاقتصادي المنخفض فيؤديان غالبًا إلى سوء التغذية وتعاطي المواد.", ref: "slide 33" },
    { q: "Compare the nursing role in the high-level wellness, health belief, and health promotion models.", a: "High-level wellness: care for the total person and assist them to reach maximum potential. Health belief: assess the patient's health beliefs and set realistic educational goals. Health promotion: design health-promoting interventions for individuals, families and communities based on their characteristics and beliefs.", qar: "قارن دور التمريض في نماذج العافية عالية المستوى والمعتقدات الصحية وتعزيز الصحة.", aar: "العافية عالية المستوى: رعاية الشخص ككل ومساعدته للوصول إلى أقصى إمكاناته. المعتقدات الصحية: تقييم معتقدات المريض الصحية ووضع أهداف تعليمية واقعية. تعزيز الصحة: تصميم تدخلات معززة للصحة للأفراد والأسر والمجتمعات بناءً على خصائصهم ومعتقداتهم.", ref: "slides 34-35" },
    { q: "List the risk factors affecting health and illness, with an example of each.", a: "Age (school-aged children at high risk for communicable diseases; post-menopause women more likely to develop cardiovascular disease); genetic factors (family history of cancer or diabetes); physiologic factors (obesity increases heart disease possibility; pregnancy places risk on mother and fetus); health habits (smoking increases lung cancer probability; poor nutrition); lifestyle (stress events like divorce or work pressure may precipitate accidents or illness); environment (hazardous materials, poor sanitation).", qar: "اذكر عوامل الخطر المؤثرة في الصحة والمرض مع مثال لكل منها.", aar: "العمر (أطفال المدارس أكثر عرضة للأمراض المعدية؛ والنساء بعد سن اليأس أكثر عرضة لأمراض القلب والأوعية)؛ والعوامل الجينية (تاريخ عائلي للسرطان أو السكري)؛ والعوامل الفسيولوجية (السمنة تزيد احتمال أمراض القلب؛ والحمل يشكل خطرًا على الأم والجنين)؛ والعادات الصحية (التدخين يزيد احتمال سرطان الرئة؛ وسوء التغذية)؛ ونمط الحياة (الأحداث المسببة للضغط كالطلاق قد تسرّع الحوادث أو المرض)؛ والبيئة (المواد الخطرة وسوء الصرف الصحي).", ref: "slide 36" },
    { q: "In Maslow's hierarchy, which basic needs match the physical dimension? Give examples.", a: "Physiologic needs: breathing, circulation, intake of food and fluids, elimination.", qar: "في هرم ماسلو، أي الاحتياجات الأساسية تناسب البُعد الجسدي؟ اذكر أمثلة.", aar: "الاحتياجات الفسيولوجية: التنفس، والدورة الدموية، وتناول الطعام والسوائل، والإخراج.", ref: "slide 37" },
    { q: "In Maslow's hierarchy, which basic needs match the environmental dimension? Give examples.", a: "Safety and security needs: housing, community/neighborhood, climate.", qar: "في هرم ماسلو، أي الاحتياجات تناسب البُعد البيئي؟ اذكر أمثلة.", aar: "احتياجات الأمن والسلامة: السكن، والمجتمع/الحي، والمناخ.", ref: "slide 37" },
    { q: "In Maslow's hierarchy, which basic needs match the sociocultural dimension? Give examples.", a: "Love and belonging needs: relationships with others, communications with others, feeling loved by others.", qar: "في هرم ماسلو، أي الاحتياجات تناسب البُعد الاجتماعي الثقافي؟ اذكر أمثلة.", aar: "احتياجات الحب والانتماء: العلاقات مع الآخرين، والتواصل معهم، والشعور بحبهم.", ref: "slide 37" },
    { q: "In Maslow's hierarchy, which basic needs match the emotional dimension? Give examples.", a: "Self-esteem needs: fear, sadness, accepting self.", qar: "في هرم ماسلو، أي الاحتياجات تناسب البُعد العاطفي؟ اذكر أمثلة.", aar: "احتياجات تقدير الذات: الخوف، والحزن، وتقبّل الذات.", ref: "slide 37" },
    { q: "In Maslow's hierarchy, which basic needs match the intellectual and spiritual dimensions? Give examples.", a: "Self-actualization needs: thinking, learning, decision-making, helping others.", qar: "في هرم ماسلو، أي الاحتياجات تناسب البُعدين الفكري والروحي؟ اذكر أمثلة.", aar: "احتياجات تحقيق الذات: التفكير، والتعلم، واتخاذ القرار، ومساعدة الآخرين.", ref: "slide 37" },
    { q: "Define primary prevention with examples.", a: "Promotes health and prevents the onset of disease. Examples: immunizations, family planning, teaching breast self-examination, accident prevention education.", qar: "عرّف الوقاية الأولية مع أمثلة.", aar: "تعزز الصحة وتمنع بدء المرض. أمثلة: التطعيمات، وتنظيم الأسرة، وتعليم الفحص الذاتي للثدي، وتعليم الوقاية من الحوادث.", ref: "slide 39" },
    { q: "Define secondary prevention with examples.", a: "Focuses on early detection, prompt intervention and health maintenance. Examples: wound care, giving medications, growth and development assessment, encouraging medical and dental screenings.", qar: "عرّف الوقاية الثانوية مع أمثلة.", aar: "تركز على الكشف المبكر والتدخل الفوري والمحافظة على الصحة. أمثلة: العناية بالجروح، وإعطاء الأدوية، وتقييم النمو والتطور، والتشجيع على الفحوصات الطبية وكشف الأسنان.", ref: "slide 39" },
    { q: "Define tertiary prevention with examples.", a: "Occurs after diagnosis and treatment to reduce disability and help patients achieve maximum functioning. Examples: teaching diabetics to prevent complications, physical therapy after stroke, referral to support groups.", qar: "عرّف الوقاية الثلاثية مع أمثلة.", aar: "تحدث بعد التشخيص والعلاج لتقليل الإعاقة ومساعدة المرضى على بلوغ أقصى أداء. أمثلة: تعليم مرضى السكري الوقاية من المضاعفات، والعلاج الطبيعي بعد السكتة الدماغية، والإحالة إلى مجموعات الدعم.", ref: "slide 39" },
    { q: "List nursing activities at the primary prevention level.", a: "Diet, exercise, smoking cessation, alcohol consumption, drugs, farm safety, seat belts and child safety seats, immunizations, water treatment.", qar: "اذكر أنشطة تمريضية في مستوى الوقاية الأولية.", aar: "الغذاء، والرياضة، والإقلاع عن التدخين، واستهلاك الكحول، والأدوية، والسلامة في المزارع، وأحزمة الأمان ومقاعد الأطفال، والتطعيمات، ومعالجة المياه.", ref: "slide 42" },
    { q: "List nursing activities at the secondary prevention level.", a: "Screenings (blood pressure, cholesterol, glaucoma, HIV, skin cancer), Pap smear, mammograms, testicular examinations, family counseling.", qar: "اذكر أنشطة تمريضية في مستوى الوقاية الثانوية.", aar: "الفحوصات (ضغط الدم، الكوليسترول، الجلوكوما، الإيدز، سرطان الجلد)، ومسحة عنق الرحم، والماموجرام، وفحص الخصيتين، والإرشاد الأسري.", ref: "slide 43" },
    { q: "List nursing activities at the tertiary prevention level.", a: "Medications, medical therapy, surgical treatment, rehabilitation, physical therapy, occupational therapy, job training.", qar: "اذكر أنشطة تمريضية في مستوى الوقاية الثلاثية.", aar: "الأدوية، والعلاج الطبي، والعلاج الجراحي، وإعادة التأهيل، والعلاج الطبيعي، والعلاج المهني، والتدريب على العمل.", ref: "slide 43" }
  ]

LECTURES.push({
  id: "asepsis",
  en: "Asepsis and Infection Control",
  ar: "التعقيم ومكافحة العدوى",
  cards: [
    { q: "What are pathogens?", a: "Microorganisms that are capable of harming people. When pathogens enter and multiply within the body, they produce an infection.", qar: "ما الممراض (pathogens)؟", aar: "كائنات دقيقة قادرة على إيذاء الناس. وعندما تدخل الجسم وتتكاثر فيه فإنها تُحدث العدوى.", ref: "slide 3" },
    { q: "Define sepsis.", a: "A term that means poisoning of tissues, used to describe serious infection.", qar: "عرّف الإنتان (sepsis).", aar: "مصطلح يعني تسمم الأنسجة، ويُستخدم لوصف العدوى الخطيرة.", ref: "slide 3" },
    { q: "List the agents causing infection.", a: "Bacteria (e.g., Staphylococcus), viruses, fungi, parasites, and prions.", qar: "اذكر العوامل المسببة للعدوى.", aar: "البكتيريا (مثل المكورات العنقودية)، والفيروسات، والفطريات، والطفيليات، والبريونات.", ref: "slide 3" },
    { q: "Define asepsis.", a: "The absence of disease-producing organisms.", qar: "عرّف التعقيم (asepsis).", aar: "غياب الكائنات المنتجة للمرض.", ref: "slide 4" },
    { q: "Define infection.", a: "An invasion of the body by a pathogenic microorganism.", qar: "عرّف العدوى.", aar: "غزو الجسم بواسطة كائن دقيق ممرض.", ref: "slide 4" },
    { q: "Define cleaning.", a: "Cleaning inhibits the growth of microorganisms.", qar: "عرّف التنظيف (cleaning).", aar: "التنظيف يثبط نمو الكائنات الدقيقة.", ref: "slide 5" },
    { q: "Define disinfection and disinfectant.", a: "Disinfection eliminates pathogenic organisms on an inanimate object, with the exception of spores. A disinfectant is a chemical substance used for disinfecting only an inanimate object, e.g. phenol, chlorine.", qar: "عرّف التطهير والمطهر.", aar: "التطهير يقضي على الكائنات الممرضة على الأشياء غير الحية باستثناء الأبواغ. والمطهر مادة كيميائية تُستخدم لتطهير الأشياء غير الحية فقط، مثل الفينول والكلور.", ref: "slide 5" },
    { q: "Define antiseptic solution with an example.", a: "A substance used on a person's skin to inhibit the growth of microorganisms, but not necessarily destroy them, such as alcohol.", qar: "عرّف المحلول المطهر (antiseptic) مع مثال.", aar: "مادة تُستخدم على جلد الشخص لتثبيط نمو الكائنات الدقيقة دون أن تدمرها بالضرورة، مثل الكحول.", ref: "slide 6" },
    { q: "Define contamination.", a: "The process by which something is unclean or unsterile.", qar: "عرّف التلوث.", aar: "العملية التي يصبح بها الشيء غير نظيف أو غير معقم.", ref: "slide 6" },
    { q: "Define sterilizing and list the four commonly used methods.", a: "The process that destroys all microorganisms, including spores and viruses. Four methods: 1) moist heat (autoclave under pressure, 121-123°C for 29 min), 2) gas (ethylene oxide), 3) boiling water (no higher than 100°C for 15 min), 4) radiation (such as ultraviolet light).", qar: "عرّف التعقيم (sterilizing) واذكر طرقه الأربع الشائعة.", aar: "عملية تدمر جميع الكائنات الدقيقة بما فيها الأبواغ والفيروسات. الطرق الأربع: 1) الحرارة الرطبة (الأوتوكلاف تحت الضغط 121-123 درجة لمدة 29 دقيقة)، 2) الغاز (أكسيد الإيثيلين)، 3) الماء المغلي (لا تزيد حرارته عن 100 درجة لمدة 15 دقيقة)، 4) الإشعاع (مثل الأشعة فوق البنفسجية).", ref: "slide 7" },
    { q: "Define nosocomial infection.", a: "Infections associated with the delivery of health care services in a health care facility; they either develop during a client's stay in the facility or are manifested after discharge.", qar: "عرّف العدوى المستشفوية (nosocomial).", aar: "عدوى مرتبطة بتقديم خدمات الرعاية الصحية داخل منشأة صحية؛ وقد تظهر أثناء إقامة المريض في المنشأة أو تتجلى بعد خروجه.", ref: "slide 8" },
    { q: "What are carriers?", a: "People or animals that show no symptoms of illness but have pathogens on their bodies and can transfer them to others.", qar: "ما حاملو المرض (carriers)؟", aar: "أشخاص أو حيوانات لا تظهر عليهم أعراض المرض لكنهم يحملون الممراض على أجسامهم ويمكنهم نقلها للآخرين.", ref: "slide 8" },
    { q: "Differentiate local from systemic infection.", a: "Local infection is limited to the specific part of the body where the microorganisms remain; a systemic infection occurs when microorganisms spread and damage different parts of the body.", qar: "ميّز بين العدوى الموضعية والعدوى الجهازية.", aar: "العدوى الموضعية محصورة في الجزء المحدد من الجسم حيث تبقى الكائنات الدقيقة؛ أما العدوى الجهازية فتنتشر فيها الكائنات وتضر بأجزاء مختلفة من الجسم.", ref: "slide 9" },
    { q: "Differentiate acute from chronic infection.", a: "An acute infection generally appears suddenly or lasts a short time; a chronic infection may occur slowly, over a long period, and may last months or years.", qar: "ميّز بين العدوى الحادة والعدوى المزمنة.", aar: "العدوى الحادة تظهر فجأة أو تدوم وقتًا قصيرًا؛ أما العدوى المزمنة فقد تحدث ببطء على مدى فترة طويلة وقد تستمر شهورًا أو سنوات.", ref: "slide 9" },
    { q: "List the six links in the chain of infection.", a: "1) Infectious agent, 2) reservoir, 3) portal of exit, 4) mode of transmission, 5) portal of entry, 6) susceptible host.", qar: "اذكر الحلقات الست في سلسلة العدوى.", aar: "1) العامل المعدي، 2) المستودع، 3) بوابة الخروج، 4) طريقة الانتقال، 5) بوابة الدخول، 6) المضيف المعرض للإصابة.", ref: "slides 10-17" },
    { q: "What is the infectious agent link?", a: "The pathogens capable of causing communicable diseases; most commonly bacteria, viruses, fungi or parasites.", qar: "ما حلقة العامل المعدي؟", aar: "الممراض القادرة على التسبب في الأمراض المعدية؛ وغالبًا تكون بكتيريا أو فيروسات أو فطريات أو طفيليات.", ref: "slide 11" },
    { q: "What is the reservoir in the chain of infection?", a: "The reservoir (source) is a host which allows the pathogen to live, and possibly grow and multiply. Humans and animals can be reservoirs for microorganisms.", qar: "ما المستودع في سلسلة العدوى؟", aar: "المستودع (المصدر) هو مضيف يسمح للممرض بالعيش وربما النمو والتكاثر. ويمكن أن يكون البشر والحيوانات مستودعات للكائنات الدقيقة.", ref: "slide 12" },
    { q: "What is the portal of exit? Give the respiratory example.", a: "The route by which infectious microorganisms escape or leave the reservoir. From the respiratory tract, microorganisms leave the infected person's body in droplets exhaled as a spray when coughing, sneezing, talking or just breathing.", qar: "ما بوابة الخروج؟ اذكر مثال الجهاز التنفسي.", aar: "الطريق الذي تخرج به الكائنات المعدية من المستودع. ومن الجهاز التنفسي تغادر الكائنات جسم الشخص المصاب في رذاذ يُزفر عند السعال أو العطس أو الكلام أو مجرد التنفس.", ref: "slide 13" },
    { q: "How do you break the portal-of-exit link?", a: "Wear a mask; do not talk directly into the patient's face; stay home if you are sick; cover your coughs and sneezes; perform good hand hygiene.", qar: "كيف تكسر حلقة بوابة الخروج؟", aar: "ارتدِ الكمامة؛ ولا تتحدث مباشرة في وجه المريض؛ وابقَ في المنزل إذا كنت مريضًا؛ وغطِّ سعالك وعطسك؛ وحافظ على نظافة اليدين جيدًا.", ref: "slide 14" },
    { q: "What is the mode of transmission?", a: "Since microorganisms cannot travel on their own, they require a vehicle to carry them to other persons and places.", qar: "ما طريقة الانتقال (mode of transmission)؟", aar: "بما أن الكائنات الدقيقة لا تستطيع الانتقال بمفردها، فهي تحتاج إلى وسيلة نقل تحملها إلى أشخاص وأماكن أخرى.", ref: "slide 15" },
    { q: "List the four portals of entry for pathogens.", a: "Inhalation (respiratory tract); ingestion (GI tract); break in skin (needle stick, cut); introduction by medical procedures (catheters).", qar: "اذكر بوابات الدخول الأربع للممراض.", aar: "الاستنشاق (الجهاز التنفسي)؛ والابتلاع (الجهاز الهضمي)؛ وكسر في الجلد (وخز إبرة، جرح)؛ والإدخال عبر الإجراءات الطبية (القسطرة).", ref: "slide 16" },
    { q: "What is a susceptible host?", a: "The person who is next exposed to the pathogen. The microorganism may spread to another person but not develop into an infection if that person's immune system can fight it off; the person may, however, become a carrier without symptoms.", qar: "ما المضيف المعرض للإصابة؟", aar: "الشخص التالي المعرض للممرض. قد تنتقل الكائنات الدقيقة إلى شخص آخر دون أن تتحول إلى عدوى إذا استطاع جهازه المناعي مقاومتها؛ لكنه قد يصبح حاملًا للمرض دون أعراض.", ref: "slide 17" },
    { q: "Who are the susceptible hosts? (list six)", a: "Very young children; very old people; people on inadequate diets; chronically ill people; people already ill; people with open wounds.", qar: "من هم المضيفون المعرضون للإصابة؟ (اذكر ستة)", aar: "الأطفال الصغار جدًا؛ وكبار السن جدًا؛ ومن يتبعون نظامًا غذائيًا غير كافٍ؛ ومرضى الأمراض المزمنة؛ والمرضى أصلًا؛ وذوو الجروح المفتوحة.", ref: "slide 18" },
    { q: "List control measures for susceptible hosts.", a: "Separate high-risk individuals from persons with potential infections; provide nutritional supplements; maintain proper sanitation of air and environment; diagnose and treat underlying disease; vaccinate against disease.", qar: "اذكر إجراءات حماية المضيفين المعرضين للإصابة.", aar: "فصل الأفراد عاليي الخطورة عن الأشخاص المحتمل إصابتهم؛ وتقديم مكملات غذائية؛ والحفاظ على صحة الهواء والبيئة؛ وتشخيص وعلاج المرض الكامن؛ والتطعيم ضد الأمراض.", ref: "slide 19" },
    { q: "Describe the incubation period.", a: "The silent stage: the time between infection and the appearance of signs and symptoms of the disease.", qar: "صف فترة الحضانة.", aar: "المرحلة الصامتة: الفترة بين حدوث العدوى وظهور علامات المرض وأعراضه.", ref: "slide 21" },
    { q: "Describe the prodromal stage.", a: "The pathogens begin to invade tissues; the interval from onset of nonspecific signs and symptoms to more specific symptoms. Microorganisms grow and multiply, and the client is most capable of spreading disease to others (the most infectious period).", qar: "صف مرحلة البداية (prodromal).", aar: "تبدأ الممراض في غزو الأنسجة؛ وهي الفترة من بدء أعراض غير محددة إلى أعراض أكثر تحديدًا. تتكاثر فيها الكائنات الدقيقة، ويكون المريض فيها الأكثر قدرة على نقل المرض للآخرين (أشد فترات العدوى).", ref: "slide 21" },
    { q: "Describe the full stage of illness (invasion stage).", a: "The individual experiences the typical signs and symptoms of the disease as they reach their greatest intensity.", qar: "صف مرحلة المرض الكامل (مرحلة الغزو).", aar: "يعاني الفرد العلامات والأعراض النمطية للمرض عندما تبلغ أقصى شدتها.", ref: "slide 22" },
    { q: "Describe the decline phase and the convalescent stage.", a: "Decline phase: host defenses overcome the pathogens; secondary infections may occur. Convalescent stage: recovery from infection; acute symptoms disappear and the person returns to a healthy state, which may take several days to months.", qar: "صف مرحلة الانحسار ومرحلة التعافي.", aar: "مرحلة الانحسار: تتغلب دفاعات المضيف على الممراض وقد تحدث عدوى ثانوية. مرحلة التعافي: الشفاء من العدوى؛ تختفي الأعراض الحادة ويعود الشخص لحالته الصحية، وقد يستغرق ذلك أيامًا إلى شهور.", ref: "slides 22-23" },
    { q: "How do the skin and the mouth defend against infection?", a: "Skin: the largest organ of the body; a waterproof mechanical barrier that microorganisms cannot get through unless it is broken. Mouth: intact multilayered mucosa provides a mechanical barrier, and saliva contains microbial inhibitors.", qar: "كيف يدافع الجلد والفم ضد العدوى؟", aar: "الجلد: أكبر عضو في الجسم؛ حاجز ميكانيكي مقاوم للماء لا تخترقه الكائنات الدقيقة إلا إذا انكسر. الفم: الغشاء المخاطي السليم متعدد الطبقات يشكل حاجزًا ميكانيكيًا، واللعاب يحتوي على مثبطات للميكروبات.", ref: "slides 24-25" },
    { q: "How do the respiratory tract and the vagina defend against infection?", a: "Respiratory tract: cilia lining the upper airway, coated by mucus, trap inhaled microbes and sweep them outward to be expectorated. Vagina: at puberty, normal flora cause vaginal secretions to achieve a low pH which inhibits the growth of many microorganisms.", qar: "كيف يدافع الجهاز التنفسي والمهبل ضد العدوى؟", aar: "الجهاز التنفسي: الأهداب المبطنة للمجرى الهوائي العلوي والمغطاة بالمخاط تحبس الميكروبات المستنشقة وتكنسها للخارج لتُلفظ. المهبل: عند البلوغ تسبب الفلورا الطبيعية إفرازات مهبلية منخفضة الأس الهيدروجيني تثبط نمو كثير من الكائنات الدقيقة.", ref: "slide 26" },
    { q: "How do the urinary tract and the gastrointestinal tract defend against infection?", a: "Urinary tract: the flushing action of urine flow washes away microorganisms on the lining of the bladder and urethra. GI tract: gastric secretions chemically destroy microorganisms.", qar: "كيف يدافع الجهاز البولي والجهاز الهضمي ضد العدوى؟", aar: "الجهاز البولي: تدفق البول يغسل الكائنات الدقيقة عن بطانة المثانة والإحليل. الجهاز الهضمي: الإفرازات المعدية تدمر الكائنات الدقيقة كيميائيًا.", ref: "slide 27" },
    { q: "How do the immune system and the blood defend against infection? What factors affect immunological defense?", a: "The immune system is composed of separate cells and molecules that give resistance to disease. The blood defends by increasing white blood cells (neutrophils and monocytes), which engulf and destroy invading microorganisms. Factors affecting immunological defense: increasing age, stress, poor nutrition, inherited conditions, environmental factors.", qar: "كيف يدافع الجهاز المناعي والدم ضد العدوى؟ وما العوامل المؤثرة في الدفاع المناعي؟", aar: "الجهاز المناعي يتكون من خلايا وجزيئات منفصلة تمنح المقاومة للمرض. ويدافع الدم بزيادة عدد خلايا الدم البيضاء (العدلات والوحيدات) التي تبتلع الكائنات الغازية وتدمرها. العوامل المؤثرة: تقدم العمر، والضغط النفسي، وسوء التغذية، والحالات الوراثية، والعوامل البيئية.", ref: "slides 28-29" },
    { q: "Define medical asepsis.", a: "Clean technique used to minimize microorganisms and prevent their spread, such as handwashing and disinfection; suitable for routine patient care.", qar: "عرّف التعقيم الطبي.", aar: "تقنية نظيفة تُستخدم لتقليل الكائنات الدقيقة ومنع انتشارها، مثل غسل اليدين والتطهير؛ ويناسب الرعاية الروتينية للمرضى.", ref: "slide 30" },
    { q: "Define surgical asepsis.", a: "Sterile technique used to eradicate all microorganisms from a specific area or object; suitable for invasive procedures, requires complete sterilization and sterile supplies to ensure no pathogens can enter the body.", qar: "عرّف التعقيم الجراحي.", aar: "تقنية معقمة تُستخدم للقضاء على جميع الكائنات الدقيقة في منطقة أو أداة محددة؛ ويناسب الإجراءات الغازية ويتطلب تعقيمًا كاملًا وأدوات معقمة لضمان عدم دخول أي ممراض إلى الجسم.", ref: "slide 30" },
    { q: "List the basic principles of medical asepsis in patient care.", a: "Practice hand hygiene; keep soiled items and equipment from touching clothing; do not place bed linen or any items on the floor; cover mouth and nose during cough and sneeze; avoid raising dust (use a dampened cloth); clean the least soiled (outer) areas first, then the more soiled (inner) ones.", qar: "اذكر المبادئ الأساسية للتعقيم الطبي في رعاية المرضى.", aar: "الحفاظ على نظافة اليدين؛ ومنع ملامسة الأدوات المتسخة للملابس؛ وعدم وضع مفارش السرير أو أي أدوات على الأرض؛ وتغطية الفم والأنف عند السعال والعطس؛ وتجنب إثارة الغبار (استخدم قطعة قماش مبللة)؛ وتنظيف المناطق الأقل اتساخًا (الخارجية) أولًا ثم الأكثر اتساخًا (الداخلية).", ref: "slide 33" },
    { q: "List further principles of medical asepsis (disposal, equipment, grooming).", a: "Dispose of soiled or used items directly into appropriate containers; sterilize equipment suspected of containing pathogens; use personal grooming practices that help prevent spreading microorganisms, e.g. shampooing the hair.", qar: "اذكر مبادئ إضافية للتعقيم الطبي (التخلص من الأدوات والمعدات والنظافة الشخصية).", aar: "التخلص من الأدوات المتسخة أو المستعملة مباشرة في الحاويات المناسبة؛ وتعقيم المعدات المشتبه باحتوائها على ممراض؛ واتباع ممارسات النظافة الشخصية التي تمنع انتشار الكائنات الدقيقة كغسل الشعر بالشامبو.", ref: "slide 34" },
    { q: "What are the purposes of medical asepsis?", a: "To prevent cross infection in the hospital environment; to control infection; to ensure the patient's comfort, safety and psychological well-being.", qar: "ما أهداف التعقيم الطبي؟", aar: "منع العدوى المتبادلة في بيئة المستشفى؛ والسيطرة على العدوى؛ وضمان راحة المريض وسلامته وعافيته النفسية.", ref: "slide 35" },
    { q: "List the standard precautions of medical asepsis.", a: "Hand washing, gloving, gowning, masks and respirators, protective eyewear or goggles or face shields, caps and shoe coverings.", qar: "اذكر الاحتياطات القياسية للتعقيم الطبي.", aar: "غسل اليدين، وارتداء القفازات، وارتداء المريلة الواقية، والكمامات وأجهزة التنفس، والنظارات الواقية أو واقيات الوجه، وأغطية الرأس والأحذية.", ref: "slide 36" },
    { q: "Why is hand washing important?", a: "It is a simple but effective procedure to break down the chain of infection; it is important for the nurse to wash hands to avoid transmission of microorganisms.", qar: "لماذا يُعد غسل اليدين مهمًا؟", aar: "لأنه إجراء بسيط لكنه فعال في كسر سلسلة العدوى؛ ومن المهم أن يغسل الممرض يديه لتجنب انتقال الكائنات الدقيقة.", ref: "slide 37" },
    { q: "What are the rules for gloving and gowning?", a: "Gloves protect personnel from acquiring infective organisms on their hands. A gown protects skin and clothing during procedures and patient care activities; many hospitals use paper disposable gowns; change gowns when they become moist; always remove gowns into a disposal container before exiting the patient's room.", qar: "ما قواعد ارتداء القفازات والمريلة الواقية؟", aar: "القفازات تحمي الطاقم من اكتساب الكائنات المعدية على أيديهم. والمريلة تحمي الجلد والملابس أثناء الإجراءات ورعاية المرضى؛ وكثير من المستشفيات تستخدم مآزر ورقية تُستعمل مرة واحدة؛ وتُغيّر عندما تبتل؛ وتُنزع دائمًا في حاوية التخلص قبل الخروج من غرفة المريض.", ref: "slides 38-39" },
    { q: "What are the rules for masks and respirators?", a: "Masks prevent transmission of infectious agents through air. Disposable respirators (N95) are indicated whenever a caregiver is working with a patient suspected of infectious airborne diseases such as tuberculosis.", qar: "ما قواعد الكمامات وأجهزة التنفس؟", aar: "الكمامات تمنع انتقال العوامل المعدية عبر الهواء. وتُستخدم أجهزة التنفس التي تُستعمل مرة واحدة (N95) عند التعامل مع مريض يشتبه بإصابته بمرض معدٍ ينتقل بالهواء مثل السل.", ref: "slide 40" },
    { q: "When are protective eyewear, goggles or face shields used?", a: "Goggles protect the eyes; face shields protect the eyes, mouth, nose and facial area. Used as personal protection when splashing (e.g., during wound irrigation) or when contamination from respiratory secretions or blood is possible.", qar: "متى تُستخدم النظارات الواقية وواقيات الوجه؟", aar: "النظارات الواقية تحمي العينين؛ وواقي الوجه يحمي العينين والفم والأنف ومنطقة الوجه. تُستخدم للحماية الشخصية عند احتمال تطاير السوائل (كغسل الجروح) أو احتمال التلوث من إفرازات الجهاز التنفسي أو الدم.", ref: "slide 41" },
    { q: "When are caps and shoe coverings used?", a: "To cover the hair and shoes; used in high-risk areas (e.g., labor and delivery, emergency room) to protect body parts from exposure to contaminated body secretions.", qar: "متى تُستخدم أغطية الرأس والأحذية؟", aar: "لتغطية الشعر والأحذية؛ وتُستخدم في المناطق عالية الخطورة (مثل غرف الولادة والطوارئ) لحماية أجزاء الجسم من التعرض لإفرازات الجسم الملوثة.", ref: "slide 42" },
    { q: "What is the purpose of surgical asepsis and when is it used?", a: "To prevent the introduction of microorganisms from the environment to the patient. Used in: surgical procedures; all procedures that invade the bloodstream; dressing and wound care; procedures involving insertion of catheters or devices into sterile body cavities.", qar: "ما هدف التعقيم الجراحي ومتى يُستخدم؟", aar: "منع دخول الكائنات الدقيقة من البيئة إلى المريض. يُستخدم في: العمليات الجراحية؛ وكل الإجراءات التي تخترق مجرى الدم؛ وعمل الضمادات والعناية بالجروح؛ وإجراءات إدخال القسطرة أو الأجهزة في تجاويف الجسم المعقمة.", ref: "slide 44" },
    { q: "List the first four principles of surgical asepsis.", a: "1) Moisture causes contamination (handle liquids carefully to prevent splashing). 2) Never consider that an object is sterile (check the label, the integrity of packaging, and the expiration date). 3) Always face the sterile field. 4) Sterile equipment may touch only sterile equipment or surfaces.", qar: "اذكر المبادئ الأربعة الأولى للتعقيم الجراحي.", aar: "1) الرطوبة تسبب التلوث (تعامل مع السوائل بحذر لمنع التطاير). 2) لا تعتبر أي أداة معقمة أبدًا (تحقق من الملصق وسلامة العبوة وتاريخ انتهاء الصلاحية). 3) واجه الحقل المعقم دائمًا. 4) الأدوات المعقمة لا تلمس إلا أدوات أو أسطحًا معقمة.", ref: "slide 46" },
    { q: "List the remaining principles of surgical asepsis.", a: "5) Sterile equipment or areas must be kept above the waist and on the sterile field. 6) Avoid unnecessary traffic around the sterile area (close doors; do not sneeze, cough or talk excessively over the field; do not reach across sterile fields). 7) Open, unused sterile articles are no longer sterile after the procedure.", qar: "اذكر بقية مبادئ التعقيم الجراحي.", aar: "5) تُحفظ الأدوات أو المناطق المعقمة فوق مستوى الخصر وعلى الحقل المعقم. 6) تجنب الحركة غير الضرورية حول المنطقة المعقمة (أغلق الأبواب؛ لا تعطس أو تسعل أو تتحدث كثيرًا فوق الحقل؛ لا تمد يدك فوق الحقول المعقمة). 7) الأدوات المعقمة المفتوحة غير المستخدمة لا تعود معقمة بعد الإجراء.", ref: "slide 47" },
    { q: "Define PPE and list its purposes.", a: "Per OSHA: specialized clothing or equipment worn by an employee for protection against infection. Purposes: improve safety of health care personnel; prevent exposure to infectious diseases; protect health care workers and clients from transmission of infective materials.", qar: "عرّف معدات الوقاية الشخصية (PPE) واذكر أهدافها.", aar: "حسب أوشا: ملابس أو معدات متخصصة يرتديها الموظف للحماية من العدوى. أهدافها: تحسين سلامة العاملين الصحيين؛ ومنع التعرض للأمراض المعدية؛ وحماية العاملين والمرضى من انتقال المواد المعدية.", ref: "slide 49" },
    { q: "List the indications for using PPE.", a: "Showering or bathing a patient; suctioning oral or tracheal secretions; transporting a patient in a wheelchair; during venipunctures; irrigating a wound; taking vital signs.", qar: "اذكر الحالات التي تستدعي استخدام معدات الوقاية الشخصية.", aar: "تحميم المريض أو غسله؛ وشفط إفرازات الفم أو القصبة الهوائية؛ ونقل مريض على كرسي متحرك؛ وأثناء وخز الوريد؛ وغسل الجروح؛ وقياس العلامات الحيوية.", ref: "slide 50" },
    { q: "List the rules for safe use of PPE.", a: "Keep gloved hands away from the face; avoid touching other PPE; change gloves when torn or heavily contaminated; limit surfaces and items touched to prevent accidental contamination.", qar: "اذكر قواعد الاستخدام الآمن لمعدات الوقاية الشخصية.", aar: "أبقِ اليدين المغطاتين بالقفازات بعيدًا عن الوجه؛ وتجنب لمس باقي معدات الوقاية؛ وغيّر القفازات عند تمزقها أو تلوثها الشديد؛ وقلل الأسطح والأدوات التي تلمسها لمنع التلوث العرضي.", ref: "slide 51" },
    { q: "Give the sequence for donning and for removing PPE.", a: "Donning: cap or surgical hat, then mask, then goggles or face shield, then gown/apron, then gloves. Removing: gloves, then gown, then face shield or goggles, then mask or respirator, then cap or surgical hat.", qar: "اذكر ترتيب ارتداء معدات الوقاية الشخصية وترتيب نزعها.", aar: "الارتداء: غطاء الرأس، ثم الكمامة، ثم النظارات الواقية أو واقي الوجه، ثم المريلة، ثم القفازات. النزع: القفازات، ثم المريلة، ثم واقي الوجه أو النظارات، ثم الكمامة أو جهاز التنفس، ثم غطاء الرأس.", ref: "slides 52-54" }
  ]

LECTURES.push({
  id: "safety",
  en: "Safety",
  ar: "السلامة",
  cards: [
    { q: "Define safety.", a: "The state of being free from harm or danger; security is a basic human need (Maslow). An injury is a particular form or instance of harm (hazard).", qar: "عرّف السلامة.", aar: "حالة التحرر من الأذى أو الخطر؛ والأمان حاجة إنسانية أساسية (ماسلو). والإصابة هي صورة أو حالة معينة من الأذى (الخطر).", ref: "slide 4" },
    { q: "Why is the term 'accident' no longer used in public health and nursing?", a: "Because most injuries are preventable, and when studied they show recurrent patterns with identifiable causes that can be anticipated and prevented, e.g. falls among older adults, car crashes, hospital-related injuries.", qar: "لماذا لم يعد مصطلح 'الحادث' مستخدمًا في الصحة العامة والتمريض؟", aar: "لأن معظم الإصابات يمكن الوقاية منها، وعند دراستها تظهر أنماطًا متكررة بأسباب يمكن تحديدها وتوقعها والوقاية منها، مثل سقوط كبار السن وحوادث السيارات وإصابات المستشفيات.", ref: "slides 4-5" },
    { q: "What does the introduction to safety emphasize?", a: "The need for a safe environment is always present; safety implies freedom from injury with focus on preventing falls, electrical injuries, fires, burns and poisoning. Both protection and education are primary nursing responsibilities, and safety is the first priority in providing client care and is associated with health promotion and illness prevention.", qar: "على ماذا يؤكد مدخل السلامة؟", aar: "الحاجة إلى بيئة آمنة قائمة دائمًا؛ والسلامة تعني التحرر من الإصابة مع التركيز على منع السقوط والإصابات الكهربائية والحرائق والحروق والتسمم. والحماية والتثقيف مسؤوليتان تمريضيتان أساسيتان، والسلامة هي الأولوية الأولى في تقديم رعاية المريض، وترتبط بتعزيز الصحة والوقاية من المرض.", ref: "slide 3" },
    { q: "List the factors affecting safety.", a: "Age (infants, children, older adults); lifestyle / occupation; sensory / perceptual changes; mobility; emotional state.", qar: "اذكر العوامل المؤثرة في السلامة.", aar: "العمر (الرضع والأطفال وكبار السن)؛ ونمط الحياة/المهنة؛ والتغيرات الحسية/الإدراكية؛ والحركة؛ والحالة الانفعالية.", ref: "slide 6" },
    { q: "Describe the individual level of injury control, with examples.", a: "Education on hazards and prevention: educating patients about fall risks and when to call for assistance; teaching diabetic patients proper insulin administration; training nurses on hand hygiene and infection prevention; teaching postoperative patients deep breathing and early ambulation; instructing patients on correct inhaler use.", qar: "صف مستوى الفرد في ضبط الإصابات مع أمثلة.", aar: "التثقيف عن المخاطر والوقاية: تثقيف المرضى عن مخاطر السقوط ومتى يطلبون المساعدة؛ وتعليم مرضى السكري إعطاء الأنسولين بشكل صحيح؛ وتدريب الممرضين على نظافة اليدين والوقاية من العدوى؛ وتعليم مرضى ما بعد الجراحة التنفس العميق والمشي المبكر؛ وإرشاد المرضى لاستخدام البخاخات بشكل صحيح.", ref: "slide 7" },
    { q: "Describe the design level of injury control, with examples.", a: "Engineering/environmental controls: adjustable electric beds to reduce falls; non-slip flooring in patient rooms and bathrooms; smart infusion pumps to minimize medication errors; adequate lighting in hospital corridors; patient identification wristbands.", qar: "صف مستوى التصميم في ضبط الإصابات مع أمثلة.", aar: "ضوابط هندسية/بيئية: أسرة كهربائية قابلة للتعديل لتقليل السقوط؛ وأرضيات غير زلقة في غرف المرضى والحمامات؛ ومضخات تسريب ذكية لتقليل أخطاء الأدوية؛ وإضاءة كافية في ممرات المستشفى؛ وأساور تعريف هوية المرضى.", ref: "slide 8" },
    { q: "Describe the regulatory level of injury control, with examples.", a: "Laws and regulations to ensure safe products and environments: mandatory fall-risk assessment for all hospitalized patients; regulations on nurse-to-patient ratios; requiring written and signed medication orders; national infection-control policies; double-check policies for high-alert medications (insulin, heparin); fire safety and emergency-exit regulations.", qar: "صف المستوى التنظيمي (التشريعي) في ضبط الإصابات مع أمثلة.", aar: "قوانين وتشريعات لضمان منتجات وبيئات آمنة: تقييم إلزامي لخطر السقوط لكل المرضى المقيمين؛ وتنظيم نسب الممرضين إلى المرضى؛ واشتراط أوامر دوائية مكتوبة وموقعة؛ وسياسات وطنية لمكافحة العدوى؛ وسياسات المراجعة المزدوجة للأدوية عالية الخطورة (الأنسولين والهيبارين)؛ وتشريعات السلامة من الحرائق ومخارج الطوارئ.", ref: "slide 9" },
    { q: "List the three types of accidents in the health care setting, with examples.", a: "Client behavior accidents (patient falls while walking alone); therapeutic procedure accidents (medication error); equipment accidents (oxygen machine malfunction).", qar: "اذكر أنواع الحوادث الثلاثة في أماكن الرعاية الصحية مع أمثلة.", aar: "حوادث سلوك المريض (سقوط المريض أثناء المشي وحده)؛ وحوادث الإجراءات العلاجية (خطأ دوائي)؛ وحوادث المعدات (عطل في جهاز الأكسجين).", ref: "slides 10-11" },
    { q: "List the first group of precautions to promote safety.", a: "Orient the patient to the environment; place the bedside table and needed items within reach; identify the client (checking the ID band ensures the correct person receives care); assist patients who have had surgery, are receiving narcotics, or are sedated.", qar: "اذكر المجموعة الأولى من احتياطات تعزيز السلامة.", aar: "تعريف المريض بالبيئة المحيطة؛ ووضع طاولة السرير والأدوات المطلوبة في متناول اليد؛ والتحقق من هوية المريض (فحص سوار الهوية يضمن وصول الرعاية للشخص الصحيح)؛ ومساعدة مرضى ما بعد الجراحة أو من يتلقون المخدرات أو المهدئات.", ref: "slide 13" },
    { q: "List the second group of precautions to promote safety.", a: "Wipe and mop up spills to prevent injury; provide adequate lighting; keep emergency light and call bells in reach and answer them in a timely manner; use bed alarms for the restless, confused patient; wear non-slip shoes.", qar: "اذكر المجموعة الثانية من احتياطات تعزيز السلامة.", aar: "مسح السوائل المنسكبة فورًا لمنع الإصابة؛ وتوفير إضاءة كافية؛ وإبقاء إضاءة الطوارئ وأجراس النداء في المتناول والرد عليها في الوقت المناسب؛ واستخدام إنذارات السرير للمريض القلق أو المشوش؛ وارتداء أحذية غير زلقة.", ref: "slide 14" },
    { q: "List the nurse's responsibilities regarding safety.", a: "Overall safety of the patient; a safe hospital environment; recognition and identification of potential hazards and threats; freedom from injury for patients, visitors and staff; providing and maintaining a safe environment within the workplace.", qar: "اذكر مسؤوليات الممرض فيما يخص السلامة.", aar: "السلامة العامة للمريض؛ وبيئة مستشفى آمنة؛ والتعرف على المخاطر والتهديدات المحتملة وتحديدها؛ والتحرر من الإصابة للمرضى والزوار والطاقم؛ وتوفير بيئة آمنة داخل مكان العمل والحفاظ عليها.", ref: "slide 15" },
    { q: "What should the nurse do for a left-handed patient?", a: "12-30% of the population is left-handed, but hospital rooms are typically set up for right-handed patients. Interventions: place all bathing articles at the patient's left; arrange meal trays so silverware and drinks are on the left; ambulate the patient by walking on the left side; adjust the room to accommodate them.", qar: "ماذا يفعل الممرض للمريض الأعسر؟", aar: "12-30% من الناس عُسر، لكن غرف المستشفيات مجهزة عادة للمرضى الأيمنين. التدخلات: وضع كل أدوات الاستحمام على يسار المريض؛ وترتيب صينية الطعام بحيث تكون الأدوات والمشروبات على اليسار؛ والمشي مع المريض من جانبه الأيسر؛ وتعديل الغرفة لتناسبه.", ref: "slide 16" },
    { q: "Summarize the key facts about falls.", a: "A common problem; all patients are at risk; the majority of patients fall during a transfer of some type; the very young, older adults, the ill and the injured are all at risk; use of anesthesia, sedatives and/or narcotics increases the risk.", qar: "لخص الحقائق الأساسية عن السقوط.", aar: "مشكلة شائعة؛ وكل المرضى معرضون للسقوط؛ ومعظم السقوط يحدث أثناء نوع من الانتقال؛ والصغار جدًا وكبار السن والمرضى والمصابون كلهم معرضون؛ واستخدام التخدير والمهدئات و/أو المخدرات يزيد الخطر.", ref: "slide 17" },
    { q: "What are Safety Reminder Devices (SRDs) and what are they used for?", a: "Any device that immobilizes the patient or a part of the patient (e.g., soft restraint / Posey). Used for patient safety, to maintain treatment, prevent wandering, and reduce falls.", qar: "ما أجهزة تذكير السلامة (SRDs) ولأي غرض تُستخدم؟", aar: "أي جهاز يثبّت المريض أو جزءًا منه (مثل المثبت الناعم / Posey). تُستخدم لسلامة المريض، واستمرارية العلاج، ومنع التجوال، وتقليل السقوط.", ref: "slide 18" },
    { q: "What are the rules for using SRDs?", a: "A doctor's order must be obtained; SRDs should be removed at least every 2 hours and the skin assessed; document position, circulation, physical and mental status, and the ongoing need.", qar: "ما قواعد استخدام أجهزة تذكير السلامة؟", aar: "يجب الحصول على أمر الطبيب؛ وتُنزع كل ساعتين على الأقل مع تقييم الجلد؛ وتوثيق الوضعية والدورة الدموية والحالة الجسدية والنفسية والحاجة المستمرة لها.", ref: "slide 18" },
    { q: "Describe the correct use of a gait belt.", a: "Apply the gait belt securely around the patient's waist; walk to the side of the patient, on the patient's weaker side; use the hand rail and support systems as needed; remove the gait belt after ambulation and document the procedure.", qar: "صف الاستخدام الصحيح لحزام المشي (gait belt).", aar: "ثبّت الحزام بإحكام حول خصر المريض؛ وامشِ بجانب المريض من جانبه الأضعف؛ واستخدم الدرابزين وأنظمة الدعم حسب الحاجة؛ وانزع الحزام بعد المشي ووثّق الإجراء.", ref: "slide 20" },
    { q: "What are the safety considerations for infants and children?", a: "They require protection within their environments; accidents involving children are largely preventable; growth and development skills must be taken into consideration during the care of the young patient.", qar: "ما اعتبارات السلامة للرضع والأطفال؟", aar: "يحتاجون إلى الحماية داخل بيئتهم؛ والحوادث التي تصيب الأطفال يمكن الوقاية منها إلى حد كبير؛ ويجب مراعاة مهارات النمو والتطور أثناء رعاية المريض الصغير.", ref: "slides 24, 26" },
    { q: "What are the safety considerations for older adults?", a: "They take many medications, increasing fall risks; use of safety devices is encouraged; accidental poisoning and overdoses are common; changes occur in vision, perception, hearing, muscle strength, joint function, and the cardiovascular and peripheral vascular systems.", qar: "ما اعتبارات السلامة لكبار السن؟", aar: "يتناولون أدوية كثيرة مما يزيد مخاطر السقوط؛ ويُشجَّع استخدام أجهزة السلامة؛ والتسمم العرضي والجرعات الزائدة شائعة؛ وتحدث تغيرات في الرؤية والإدراك والسمع وقوة العضلات ووظيفة المفاصل والجهاز القلبي الوعائي والأوعية الطرفية.", ref: "slides 24, 27" },
    { q: "What should the nurse teach patients about infection control at home or in hospice settings?", a: "The nature of infection and techniques to plan or control its spread: hand washing, food preparation, IV lines, waste containers, and body fluid spills.", qar: "ماذا يعلّم الممرض المرضى عن مكافحة العدوى في المنزل أو دور الرعاية؟", aar: "طبيعة العدوى والتقنيات المستخدمة في التخطيط لانتشارها أو السيطرة عليه: غسل اليدين، وإعداد الطعام، والخطوط الوريدية، وحاويات النفايات، وانسكاب سوائل الجسم.", ref: "slide 28" },
    { q: "List the hospital environment hazards.", a: "Biological, chemical, physical, radiation, and contaminated needles.", qar: "اذكر مخاطر بيئة المستشفى.", aar: "المخاطر البيولوجية، والكيميائية، والفيزيائية، والإشعاعية، والإبر الملوثة.", ref: "slide 29" },
    { q: "Why are needle sticks a major concern and what policy addresses them?", a: "Needle sticks are still the prime source of blood-borne pathogens; addressed by 'Do not Recap' policies.", qar: "لماذا تُعد وخزات الإبر مصدر قلق رئيسيًا وما السياسة المتعلقة بها؟", aar: "لأنها ما زالت المصدر الأول لممراضات الدم المنقولة؛ وتعالجها سياسات 'لا تُعد تغطية الإبرة'.", ref: "slide 29" },
    { q: "State the rules for electrical safety.", a: "Use properly grounded plugs; do not use equipment in poor condition.", qar: "اذكر قواعد السلامة الكهربائية.", aar: "استخدم قوابس مؤرضة بشكل صحيح؛ ولا تستخدم معدات في حالة سيئة.", ref: "slide 29" },
    { q: "State the rules for radiation safety.", a: "Minimize time, maximize distance, wear monitors, and use shields.", qar: "اذكر قواعد السلامة من الإشعاع.", aar: "قلل مدة التعرض، وزد المسافة، والبس أجهزة المراقبة، واستخدم الدروع الواقية.", ref: "slide 29" },
    { q: "What is the key rule of proper body mechanics when lifting?", a: "Keep a wide base of support when lifting.", qar: "ما القاعدة الأساسية لميكانيكا الجسم السليمة عند الرفع؟", aar: "حافظ على قاعدة ارتكاز عريضة عند الرفع.", ref: "slide 29" },
    { q: "Summarize fire safety in healthcare settings.", a: "Fires are most often related to smoking in bed or faulty equipment; established fire safety programs are mandatory; know hospital policies, escape routes and fire equipment locations; keep exits marked and hallways clear; check electrical cords.", qar: "لخص السلامة من الحرائق في أماكن الرعاية الصحية.", aar: "غالبًا ترتبط الحرائق بالتدخين في السرير أو المعدات المعطلة؛ وبرامج السلامة من الحرائق إلزامية؛ واعرف سياسات المستشفى ومسارات الهروب وأماكن معدات الإطفاء؛ وأبقِ المخارج مُعلَّمة والممرات خالية؛ وافحص الأسلاك الكهربائية.", ref: "slide 30" },
    { q: "What does RACE stand for in fire safety?", a: "R: Rescue - remove patients in danger. A: Alarm. C: Confine the fire. E: Extinguish or Evacuate.", qar: "ماذا تعني كلمة RACE في السلامة من الحرائق؟", aar: "R الإنقاذ: أخرج المرضى من الخطر. A الإنذار. C احتواء الحريق. E الإطفاء أو الإخلاء.", ref: "slide 30" },
    { q: "Define disaster planning.", a: "The process of preparing healthcare facilities and staff to respond effectively to sudden, unexpected and serious emergencies; it enables rescuers to respond to unexpected, uncontrollable and shocking emergencies that directly disrupt healthcare facilities.", qar: "عرّف التخطيط للكوارث.", aar: "عملية إعداد منشآت الرعاية الصحية وطاقمها للاستجابة الفعالة للطوارئ المفاجئة وغير المتوقعة والخطيرة؛ وهو يمكّن المستجيبين من التعامل مع طوارئ غير متوقعة وخارجة عن السيطرة وصادمة تعطل عمل منشآت الرعاية الصحية مباشرة.", ref: "slide 32" },
    { q: "Summarize the key facts about accidental poisoning.", a: "Childhood poisoning is one of the major causes of death in children under 5 years; specific antidotes and treatments are available for all types of poisons; potential sources are cleaning solutions and disinfectants, drugs, and substances in unmarked containers.", qar: "لخص الحقائق الأساسية عن التسمم العرضي.", aar: "تسمم الأطفال من أهم أسباب الوفاة في الأطفال دون الخامسة؛ وتوجد ترياقات وعلاجات محددة لكل أنواع السموم؛ والمصادر المحتملة هي محاليل التنظيف والمطهرات، والأدوية، والمواد في عبوات غير مُعلَّمة.", ref: "slide 33" },
    { q: "List the interventions when a poisoning occurs.", a: "Assess for changes in mental status; notify the poison control center; do not induce vomiting unless directed; wash hands; document; follow-up; reduce risk of accidental overdose.", qar: "اذكر التدخلات عند حدوث تسمم.", aar: "قيّم أي تغير في الحالة العقلية؛ وأبلغ مركز مكافحة السموم؛ ولا تحفّز القيء إلا بتوجيه؛ واغسل اليدين؛ ووثّق؛ وتابع؛ وقلل خطر الجرعة الزائدة العرضية.", ref: "slide 34" },
    { q: "How are poisoning, choking and suffocation prevented?", a: "Poisoning: store medicines and cleaning liquids safely out of reach of children and confused patients. Choking: cut food into small, easy-to-swallow pieces and keep small objects like coins or toys away from kids. Suffocation: keep plastic bags away from children and do not use heavy pillows or thick blankets in a baby's bed.", qar: "كيف تُمنع حالات التسمم والاختناق والخنق؟", aar: "التسمم: خزّن الأدوية وسوائل التنظيف بعيدًا عن متناول الأطفال والمرضى المشوشين. الاختناق: قطّع الطعام قطعًا صغيرة سهلة البلع وأبعد الأشياء الصغيرة كالعملات والألعاب عن الأطفال. الخنق: أبعد الأكياس البلاستيكية عن الأطفال ولا تستخدم وسائد ثقيلة أو بطانيات سميكة في سرير الرضيع.", ref: "slide 35" },
    { q: "How are drowning prevented and noise pollution reduced?", a: "Drowning: never leave a child alone in the bathtub, and closely monitor patients who might fall or faint in the bathroom. Noise: keep voices low and manage machine alarms so the hospital stays quiet and patients can rest and heal.", qar: "كيف يُمنع الغرق ويُقلل التلوث الضوضائي؟", aar: "الغرق: لا تترك الطفل وحده في حوض الاستحمام أبدًا، وراقب عن قرب المرضى الذين قد يسقطون أو يُغمى عليهم في الحمام. الضوضاء: اخفض الأصوات واضبط إنذارات الأجهزة ليبقى المستشفى هادئًا ويستطيع المرضى الراحة والتعافي.", ref: "slide 36" },
    { q: "Practice Q1: Why must an electrical device have a three-pronged plug?", a: "Because it controls stray electrical currents. (Practice question; answer not given on the slides.)", qar: "سؤال تدريبي 1: لماذا يجب أن يكون للجهاز الكهربائي قابس ثلاثي الأطراف؟", aar: "لأنه يتحكم في التيارات الكهربائية الشاردة. (سؤال تدريبي؛ الإجابة غير مذكورة في الشرائح.)", ref: "slide 39" },
    { q: "Practice Q2: For a patient with Parkinson's disease who has difficulty swallowing, what major potential problem should the nurse assess for?", a: "Aspiration. (Practice question; answer not given on the slides.)", qar: "سؤال تدريبي 2: لمريض باركنسون يعاني صعوبة البلع، ما المشكلة الكبرى المحتملة التي يجب أن يقيّمها الممرض؟", aar: "الشفط (دخول الطعام أو السوائل إلى مجرى الهواء). (سؤال تدريبي؛ الإجابة غير مذكورة في الشرائح.)", ref: "slide 39" },
    { q: "Practice Q3: What should the nurse do to prevent a confused client from falling?", a: "Maintain close supervision. (Practice question; answer not given on the slides.)", qar: "سؤال تدريبي 3: ماذا يفعل الممرض لمنع سقوط مريض مشوش؟", aar: "يحافظ على مراقبة لصيقة. (سؤال تدريبي؛ الإجابة غير مذكورة في الشرائح.)", ref: "slide 40" },
    { q: "Practice Q4: What is the first thing children should be taught to do if their clothes catch on fire?", a: "Roll on the ground. (Practice question; answer not given on the slides.)", qar: "سؤال تدريبي 4: ما أول شيء يجب تعليمه للأطفال إذا اشتعلت النار في ملابسهم؟", aar: "التدحرج على الأرض. (سؤال تدريبي؛ الإجابة غير مذكورة في الشرائح.)", ref: "slide 40" },
    { q: "Practice Q5: What should the nurse do first when applying a prescribed vest restraint?", a: "Perform an inspection of the client's skin where the restraint is to be placed. (Practice question; answer not given on the slides.)", qar: "سؤال تدريبي 5: ما أول ما يفعله الممرض عند تطبيق مثبت السترة الموصوف؟", aar: "يفحص جلد المريض في مكان وضع المثبت. (سؤال تدريبي؛ الإجابة غير مذكورة في الشرائح.)", ref: "slide 41" },
    { q: "Practice Q6: Which factor most often contributes to falls in a hospital setting?", a: "Advanced age of clients. (Practice question; answer not given on the slides.)", qar: "سؤال تدريبي 6: ما العامل الأكثر مساهمة في حوادث السقوط داخل المستشفى؟", aar: "تقدم عمر المرضى. (سؤال تدريبي؛ الإجابة غير مذكورة في الشرائح.)", ref: "slide 41" },
    { q: "Practice Q7: On admission, which information most indicates that a client is at risk for physical injury?", a: "Two recent falls that occurred at home. (Practice question; answer not given on the slides.)", qar: "سؤال تدريبي 7: عند الدخول للمستشفى، أي معلومة تشير أكثر إلى أن المريض معرض لخطر إصابة جسدية؟", aar: "سقوطه مرتين مؤخرًا في المنزل. (سؤال تدريبي؛ الإجابة غير مذكورة في الشرائح.)", ref: "slide 42" },
    { q: "Practice Q8: What should the nurse do to best prevent a client from falling?", a: "Assist the client with ambulation. (Practice question; answer not given on the slides.)", qar: "سؤال تدريبي 8: ما أفضل ما يفعله الممرض لمنع سقوط المريض؟", aar: "يساعد المريض على المشي. (سؤال تدريبي؛ الإجابة غير مذكورة في الشرائح.)", ref: "slide 42" },
    { q: "Practice Q9: Which intervention enhances an older adult's sensory perception and helps prevent injury when walking from the bed to the bathroom?", a: "Providing adequate lighting. (Practice question; answer not given on the slides.)", qar: "سؤال تدريبي 9: أي تدخل يحسّن الإدراك الحسي لكبير السن ويساعد على منع الإصابة أثناء المشي من السرير إلى الحمام؟", aar: "توفير إضاءة كافية. (سؤال تدريبي؛ الإجابة غير مذكورة في الشرائح.)", ref: "slide 43" },
    { q: "Practice Q10: What should the nurse do to maintain the safety of a 3-year-old child admitted to the pediatric unit?", a: "Put the child in a crib with high side rails. (Practice question; answer not given on the slides.)", qar: "سؤال تدريبي 10: ماذا يفعل الممرض للحفاظ على سلامة طفل عمره 3 سنوات في قسم الأطفال؟", aar: "يضع الطفل في سرير أطفال بجوانب عالية. (سؤال تدريبي؛ الإجابة غير مذكورة في الشرائح.)", ref: "slide 43" }
  ]
