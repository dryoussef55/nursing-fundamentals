<script>
var LECTURES = [];
LECTURES.push({
  id: "vital-signs",
  en: "Vital Signs",
  ar: "العلامات الحيوية",
  cards: [
    { q: "What are the vital signs and what do they show?", a: "Temperature (T), pulse (P), respirations (R) and blood pressure (BP); they show how the body's homeostasis mechanisms are working.", qar: "ما العلامات الحيوية وماذا توضح؟", aar: "درجة الحرارة والنبض والتنفس وضغط الدم؛ وتوضح كيف تعمل آليات الاتزان الداخلي في الجسم.", ref: "slides 1-3" },
    { q: "When are vital signs measured?", a: "On admission to any health care facility and according to facility policy; when there is any change in the client's condition; before and after surgery or an invasive diagnostic procedure, and before and after any activity that may increase risk; before giving medications that affect the cardiovascular or respiratory systems.", qar: "متى تُقاس العلامات الحيوية؟", aar: "عند الدخول لأي منشأة صحية وحسب سياسة المنشأة؛ وعند أي تغير في حالة المريض؛ وقبل وبعد الجراحة أو الإجراءات التشخيصية الباضعة وقبل وبعد أي نشاط قد يزيد الخطر؛ وقبل إعطاء الأدوية المؤثرة في الجهاز القلبي الوعائي أو التنفسي.", ref: "slides 1-3" },
    { q: "Give the normal adult ranges for the four vital signs.", a: "Core temperature: 36.5 to 37.5°C (97.6 to 99.6°F). Pulse: 60 to 100 beats/min. Respirations: 12 to 20 breaths/min. Blood pressure: about 120/80 mm Hg (in these slides, below 100/60 is hypotension).", qar: "اذكر المعدلات الطبيعية للبالغين للعلامات الحيوية الأربع.", aar: "درجة الحرارة الداخلية: من 36.5 إلى 37.5 مئوية (97.6 إلى 99.6 فهرنهايت). النبض: من 60 إلى 100 نبضة/دقيقة. التنفس: من 12 إلى 20 نفسًا/دقيقة. ضغط الدم: حوالي 120/80 ملم زئبق (وفي هذه الشرائح أقل من 100/60 يُعد انخفاضًا).", ref: "slides 1-3" },
    { q: "What is the normal SpO2 range? (note the source)", a: "95 to 100% on room air for healthy adults - this is general guidance (FDA pulse-oximeter information), not from our slides; clinical targets vary by patient, so follow your faculty's limits.", qar: "ما المعدل الطبيعي لتشبع الأكسجين SpO2؟ (لاحظ المصدر)", aar: "من 95 إلى 100% على هواء الغرفة للبالغين الأصحاء - وهذا إرشاد عام (من معلومات هيئة الغذاء والدواء عن مقياس التأكسج) وليس من شرائحنا؛ والأهداف تختلف حسب المريض فاتبع حدود كليتك.", ref: "general note" },
    { q: "When does core body temperature stay normal, and what acts as the body's thermostat?", a: "Core temperature stays normal when heat production equals heat loss; the hypothalamus acts as the body's thermostat.", qar: "متى تبقى درجة حرارة الجسم الداخلية طبيعية، وما منظّمها الحراري؟", aar: "تبقى طبيعية عندما يتساوى إنتاج الحرارة مع فقدها؛ ويعمل الوطاء (hypothalamus) كمنظّم حراري للجسم.", ref: "slides 4-8" },
    { q: "List the four processes by which heat is lost.", a: "Radiation, conduction, convection, and evaporation (sweating).", qar: "اذكر العمليات الأربع لفقد الحرارة.", aar: "الإشعاع، والتوصيل، والحمل الحراري، والتبخر (التعرق).", ref: "slides 4-8" },
    { q: "How does age affect body temperature?", a: "Temperature regulation is unstable in newborns and temperature is lower in older adults; if core temperature drops to 25°C (77°F), death may occur.", qar: "كيف يؤثر العمر في درجة حرارة الجسم؟", aar: "التنظيم الحراري غير مستقر في حديثي الولادة، وتنخفض الحرارة في كبار السن؛ وإذا انخفضت الحرارة الداخلية إلى 25 درجة مئوية (77 فهرنهايت) فقد تحدث الوفاة.", ref: "slide 9" },
    { q: "How does time of day affect body temperature?", a: "Temperature is usually lowest around 3 AM and highest from 5 to 7 PM; it can vary by as much as 2°C (3.6°F) from early morning to late afternoon, with maximum elevation around 6 PM.", qar: "كيف يؤثر وقت اليوم في درجة حرارة الجسم؟", aar: "تكون عادة في أدنى مستوى حوالي الثالثة فجرًا وأعلى مستوى من 5 إلى 7 مساءً؛ وقد تتفاوت بمقدار درجتين مئويتين (3.6 فهرنهايت) من الصباح الباكر إلى آخر النهار، وأقصى ارتفاع حوالي السادسة مساءً.", ref: "slide 10" },
    { q: "How does exercise affect body temperature?", a: "Exercise increases heat production as the body breaks down carbohydrates and fats for energy; strenuous exercise such as running a marathon can temporarily raise temperature to as high as 40°C (104°F).", qar: "كيف يؤثر التمرين في درجة حرارة الجسم؟", aar: "يزيد التمرين إنتاج الحرارة لأن الجسم يكسر الكربوهيدرات والدهون للطاقة؛ والتمرين الشاق كسباق الماراثون قد يرفع الحرارة مؤقتًا حتى 40 درجة مئوية (104 فهرنهايت).", ref: "slide 11" },
    { q: "How does stress affect body temperature?", a: "Emotional or physical stress stimulates the sympathetic nervous system; circulating epinephrine and norepinephrine increase, the metabolic rate increases, and heat production increases. Stressed or anxious clients may have an elevated temperature without underlying pathology.", qar: "كيف يؤثر الضغط النفسي في درجة حرارة الجسم؟", aar: "ينبّه الضغط النفسي أو الجسدي الجهاز العصبي الودي؛ فترتفع مستويات الإبينفرين والنورإبينفرين ويزداد معدل الأيض وبالتالي إنتاج الحرارة. وقد ترتفع حرارة المريض المتوتر أو القلق دون مرض كامن.", ref: "slide 12" },
    { q: "How do hormones affect body temperature?", a: "Women usually have greater variations than men; progesterone, secreted at ovulation, increases body temperature 0.3 to 0.6°C (0.5 to 1°F) above baseline, which is the basis for the rhythm method of birth control. After menopause, norms are the same for men and women. Thyroxine, epinephrine and norepinephrine also elevate temperature by increasing heat production.", qar: "كيف تؤثر الهرمونات في درجة حرارة الجسم؟", aar: "تتفاوت حرارة النساء عادة أكثر من الرجال؛ والبروجستيرون المفرز عند الإباضة يرفع الحرارة 0.3 إلى 0.6 درجة مئوية (0.5 إلى 1 فهرنهايت) فوق خط الأساس، وهذا أساس طريقة العدّ لمنع الحمل. وبعد سن اليأس تتساوى المعدلات بين الجنسين. والثيروكسين والإبينفرين والنورإبينفرين ترفع الحرارة أيضًا بزيادة إنتاجها.", ref: "slide 13" },
    { q: "Which external factors can cause false oral temperature readings, and what is the rule for ice water?", a: "Smoking, oxygen given by mask or cannula, and drinking hot or cold liquids can alter oral readings; the most marked variation follows ice water - wait 15 minutes after a client has ingested ice water before taking an oral temperature.", qar: "ما العوامل الخارجية التي قد تسبب قراءات فموية خاطئة، وما قاعدة الماء المثلج؟", aar: "التدخين، والأكسجين عبر القناع أو القنية، وشرب السوائل الساخنة أو الباردة قد يغير القراءة الفموية؛ وأكبر تغيّر يحدث بعد الماء المثلج - فانتظر 15 دقيقة بعد تناوله قبل قياس الحرارة فمويًا.", ref: "slide 14" },
    { q: "Describe the oral route for temperature measurement.", a: "The most common site; advantages are easy access and client comfort. Wait 15 to 30 minutes after hot or cold liquids. Oral assessment, especially with a glass thermometer, may not be prudent or safe for infants, young children, unconscious or irrational clients, or clients with seizure disorders.", qar: "صف طريق القياس الفموي لدرجة الحرارة.", aar: "الموضع الأكثر شيوعًا؛ ومزاياه سهولة الوصول وراحة المريض. انتظر 15 إلى 30 دقيقة بعد السوائل الساخنة أو الباردة. والقياس الفموي، خاصة بالترمومتر الزجاجي، قد لا يكون آمنًا للرضّع وصغار الأطفال وفاقدي الوعي أو غير الراشدين ومرضى التشنجات.", ref: "slide 15" },
    { q: "Describe the rectal route and its contraindications.", a: "Believed to be the most reliable route because few factors influence the reading artificially; avoid placing the thermometer into fecal material (falsely elevates the reading). Contraindicated in clients with diarrhea, after rectal surgery, with rectal diseases, and in neutropenic cancer clients. In selected clients (e.g., quadriplegics) it may cause vagal stimulation, resulting in bradycardia and syncope; many clients tolerate it poorly due to discomfort and embarrassment.", qar: "صف طريق القياس الشرجي وموانعه.", aar: "يُعتقد أنه الأكثر موثوقية لأن عوامل قليلة تؤثر في قراءته؛ وتجنب وضع الترمومتر في البراز (يرفع القراءة زورًا). ممنوع مع الإسهال وبعد جراحات المستقيم ومع أمراضه ولدى مرضى السرطان منخفضي العدلات. وقد يسبب تنبيه العصب المبهم لدى بعض المرضى (كمرضى الشلل الرباعي) مما يؤدي إلى بطء القلب والإغماء؛ وكثيرون لا يتحملونه بسبب الانزعاج والإحراج.", ref: "slide 16" },
    { q: "What is the safety alert about rectal thermometers in infants?", a: "Rectal thermometers are contraindicated in infants because they may cause trauma to the rectal mucosa.", qar: "ما تنبيه السلامة بخصوص الترمومترات الشرجية في الرضّع؟", aar: "الترمومترات الشرجية ممنوعة في الرضّع لأنها قد تسبب إصابة للغشاء المخاطي للمستقيم.", ref: "slide 17" },
    { q: "Describe the ear (tympanic) route.", a: "The tympanic membrane receives its blood supply from the same vasculature that supplies the hypothalamus, so tympanic readings reflect core body temperature. Cerumen in the ear canal, crying or otitis media do not alter readings significantly.", qar: "صف طريق القياس الأذني (الطبلة).", aar: "يتغذى غشاء الطبلة بنفس الأوعية التي تغذي الوطاء، لذلك تعكس قراءاته درجة الحرارة الداخلية. وشمع الأذن والبكاء والتهاب الأذن الوسطى لا تغيّر القراءات بشكل مؤثر.", ref: "slide 18" },
    { q: "Describe the temporal artery (forehead) route.", a: "Fast and safe; research indicates it may be at least as accurate as tympanic thermometers, though less accurate than rectal. Easy to use and well tolerated by infants and young children; measurements are not affected by perspiration and are consistent on either side of the forehead.", qar: "صف طريق الشريان الصدغي (الجبهة).", aar: "سريع وآمن؛ وتشير الأبحاث إلى أنه قد يكون بدقة طريقة الأذن على الأقل لكنه أقل دقة من الطريقة الشرجية. سهل الاستخدام ومقبول جيدًا لدى الرضّع وصغار الأطفال؛ ولا تتأثر قياساته بالعرق وهي متسقة على أي من جانبي الجبهة.", ref: "slide 19" },
    { q: "Describe the axillary route.", a: "The least accurate and least reliable site; recent bathing (water temperature) and friction used to dry the skin can influence the reading. Recommended for infants and children, and the route of choice in clients who cannot have temperature measured by other routes.", qar: "صف طريق القياس الإبطي.", aar: "أقل المواضع دقة وموثوقية؛ فالاستحمام الحديث (حرارة الماء) والاحتكاك عند التجفيف قد يؤثران في القراءة. يُنصح به للرضّع والأطفال، وهو طريق الاختيار لمن لا يمكن قياس حرارتهم بالطرق الأخرى.", ref: "slide 20" },
    { q: "How do you convert Celsius to Fahrenheit?", a: "Multiply the Celsius reading by 9/5 and add 32.", qar: "كيف تحوّل من مئوية إلى فهرنهايت؟", aar: "اضرب القراءة المئوية في 9/5 ثم أضف 32.", ref: "slide 21" },
    { q: "Explain how the pulse wave is created.", a: "Contraction of the ventricles ejects blood into the arteries; the force of blood entering the aorta from the left ventricle stretches the elastic aortic wall; as the aorta expands then contracts, a pulse wave is created that travels along the blood vessels and can be felt where arteries lie close to the skin surface.", qar: "اشرح كيف تتكون موجة النبض.", aar: "انقباض البطينين يقذف الدم في الشرايين؛ وقوة الدم الداخل للأبهر من البطين الأيسر تمدد جدار الأبهر المرن؛ ومع تمدد الأبهر ثم انقباضه تتكون موجة نبض تسري على امتداد الأوعية ويمكن جسّها حيث تقترب الشرايين من سطح الجلد.", ref: "slide 22" },
    { q: "List the three characteristics of the pulse.", a: "Rate (frequency): the number of pulsations per minute. Rhythm: the regularity with which pulsation occurs. Quality: the strength of the palpated pulsation.", qar: "اذكر خصائص النبض الثلاث.", aar: "المعدل: عدد النبضات في الدقيقة. الإيقاع: انتظام حدوث النبض. القوة (الجودة): قوة النبضة المجسوسة.", ref: "slide 23" },
    { q: "How does age affect the pulse rate?", a: "The average infant pulse is 100 to 160 beats per minute, and the rhythm in infants and children often varies markedly with respiration (increasing during inspiration, decreasing with expiration). The normal adult range is 60 to 100 beats per minute.", qar: "كيف يؤثر العمر في معدل النبض؟", aar: "متوسط نبض الرضيع من 100 إلى 160 نبضة/دقيقة، وغالبًا ما يتغير إيقاع القلب عند الرضّع والأطفال بوضوح مع التنفس (يزداد مع الشهيق وينقص مع الزفير). والمعدل الطبيعي للبالغ من 60 إلى 100 نبضة/دقيقة.", ref: "slide 24" },
    { q: "How does the autonomic nervous system affect pulse rate?", a: "Parasympathetic stimulation decreases the pulse rate (normally keeping it below 100); sympathetic stimulation increases it, in response to pain, anxiety, exercise, fever, ingestion of caffeinated beverages and changes in intravascular volume.", qar: "كيف يؤثر الجهاز العصبي الذاتي في معدل النبض؟", aar: "تنبيه الجهاز نظير الودي يخفض معدل النبض (ويبقيه طبيعيًا تحت 100)؛ وتنبيه الجهاز الودي يرفعه استجابةً للألم والقلق والتمرين والحمى وتناول المشروبات المحتوية على الكافيين وتغيرات حجم الدم داخل الأوعية.", ref: "slide 25" },
    { q: "Which medications affect the pulse rate, and how?", a: "Digoxin decreases heart rate. Diuretics (decrease intravascular volume) may cause a reflex increase in pulse rate. Atropine inhibits parasympathetic impulses to the heart, causing an increased rate. Propranolol blocks sympathetic action, resulting in a decreased rate.", qar: "ما الأدوية المؤثرة في معدل النبض وكيف تعمل؟", aar: "الديجوكسين يخفض معدل القلب. ومدرات البول (تخفض حجم الدم داخل الأوعية) قد تسبب زيادة انعكاسية في النبض. والأتروبين يثبط تأثيرات نظير الودي على القلب فيزيد المعدل. والبروبرانولول يحجب عمل الجهاز الودي فيخفض المعدل.", ref: "slide 26" },
    { q: "Describe the upper-body pulse sites, including the carotid safety alert.", a: "Temporal: just in front of the upper part of the ear. Carotid: along the medial border of the sternomastoid muscle in the lower half of the neck - never palpate in the upper neck (carotid sinus stimulation causes a reflex drop in rate) and never palpate both carotids simultaneously (impairs cerebral blood flow); it best represents the quality of pulsation in the aorta. Apical: fifth intercostal space at about the midclavicular line. Brachial: groove between biceps and triceps in the inner upper arm, arm extended and supported. Radial: the most commonly assessed site, on the thumb side of the inner wrist.", qar: "صف مواضع جس النبض في الجزء العلوي من الجسم، مع تنبيه سلامة السباتي.", aar: "الصدغي: أمام الجزء العلوي من الأذن. السباتي: على الحد الإنسي للعضلة القصية الخشائية في النصف السفلي من الرقبة - لا تجسه أبدًا في أعلى الرقبة (تنبيه الجيب السباتي يسبب هبوطًا انعكاسيًا في المعدل) ولا تجس السباتيين معًا أبدًا (يضعف تدفق الدم للمخ)؛ وهو أفضل ممثل لقوة نبض الأبهر. القمّي: الفضاء بين الضلعي الخامس على خط منتصف الترقوة تقريبًا. العضدي: في الثلم بين العضديتين ذات الرأسين وذات الثلاث رؤوس داخل أعلى الذراع مع مدّها ودعمها. الكعبري: الموضع الأكثر استخدامًا، على جانب الإبهام من داخل الرسغ.", ref: "slides 28-32" },
    { q: "Describe the lower-body pulse sites.", a: "Femoral: anterior, medial aspect of the thigh just below the inguinal ligament, about halfway between the anterior superior iliac spine and the symphysis pubis; deep palpation may be required. Popliteal: behind the knee in the lateral popliteal fossa, best assessed with the knee flexed and the leg relaxed. Pedal (dorsalis pedis): on the dorsal aspect of the foot, lateral to the tendon running from the great toe toward the ankle; may be congenitally absent. Posterior tibial: behind the malleolus of the inner ankle, palpated by hooking the fingertips behind the bone.", qar: "صف مواضع جس النبض في الجزء السفلي من الجسم.", aar: "الفخذي: في مقدمة الفخذ وإنسيته أسفل الرباط الأربي مباشرة، في منتصف المسافة بين الشوكة الحرقفية العلوية الأمامية وارتفاق العانة تقريبًا؛ وقد يتطلب جسًّا عميقًا. المأبضي: خلف الركبة في الحفرة المأبضية الوحشية، ويُقيَّم أفضل مع ثني الركبة وإرخاء الساق. ظهر القدم: على ظهر القدم وحشيًا للوتر الممتد من الإبهام نحو الكاحل؛ وقد يكون غائبًا خلقيًا. الظنبوبي الخلفي: خلف كعب الكاحل الإنسي، ويُجس بخطف أطراف الأصابع خلف العظمة.", ref: "slides 33-36" },
    { q: "What equipment is used for pulse assessment?", a: "A stethoscope for the apical pulse - snugly fitting earpieces, thick-walled tubing about 12 inches (30 cm) long, equipped with a bell and a diaphragm. Peripheral pulses that cannot be detected by palpation may be assessed with an ultrasonic Doppler device.", qar: "ما المعدات المستخدمة في تقييم النبض؟", aar: "السماعة الطبية للنبض القمّي - بقطعات أذن محكمة وأنبوب سميك الجدار بطول 12 بوصة (30 سم) مزود بجرس وحجاب. والنبضات الطرفية التي لا يمكن جسّها قد تُقيَّم بجهاز الدوبلر فوق الصوتي.", ref: "slide 37" },
    { q: "Describe pulse palpation and auscultation, including S1 and S2.", a: "Palpate using the first and second or second and third fingers of one hand, with light pressure initially to locate the strongest pulsation. The apical pulse (auscultated with the stethoscope diaphragm over the apex) gives the most accurate rate and is preferred when peripheral pulses are difficult to assess or the rhythm is irregular. Each heartbeat has two sounds: S1 from closure of the mitral and tricuspid valves, S2 from closure of the pulmonic and aortic valves - a muffled 'lub-dub' together constituting one heartbeat; count for 1 full minute.", qar: "صف جس النبض والاستماع إليه، مع الصوتين S1 وS2.", aar: "اجسّ بالإصبعين الأول والثاني أو الثاني والثالث بضغط خفيف أولًا لتحديد أقوى نبضة. والنبض القمّي (بالاستماع بحجاب السماعة فوق قمة القلب) يعطي أدق معدل ويُفضَّل عند صعوبة النبضات الطرفية أو عدم انتظام الإيقاع. ولكل نبضة قلب صوتان: S1 من انغلاق الصمامين الميترالي والثلاثي الشُرَف، وS2 من انغلاق الصمامين الرئوي والأبهري - 'لب-دب' مكتومة تشكل معًا نبضة واحدة؛ وعُدّ لدقيقة كاملة.", ref: "slides 37-38" },
    { q: "Define tachycardia and bradycardia.", a: "Tachycardia: adult pulse rate above 100 beats per minute (may result from sympathetic activation). Bradycardia: adult pulse rate below 60; it may be the normal resting heart rate in a trained athlete, and enhanced parasympathetic activity (such as carotid sinus stimulation) may cause it.", qar: "عرّف تسرع القلب وبطء القلب.", aar: "تسرع القلب: معدل نبض البالغ فوق 100 نبضة/دقيقة (قد ينتج عن تنبيه الجهاز الودي). بطء القلب: أقل من 60 نبضة/دقيقة؛ وقد يكون طبيعيًا في الرياضيين المدربين، وقد يسببه زيادة نشاط نظير الودي (كتنبيه الجيب السباتي).", ref: "slide 39" },
    { q: "What should you know about pulse rhythm and sinus dysrhythmia?", a: "Cardiac contractions normally occur at evenly spaced intervals (regular rhythm). Infants and children often have increased rates during inspiration and decreased rates during expiration - sinus dysrhythmia. When you note an abnormal rhythm, use auscultation for an apical rate and determine if the irregularity is new; a new finding of pulse irregularity requires immediate investigation.", qar: "ماذا يجب أن تعرف عن إيقاع النبض وعدم انتظام الجيوب؟", aar: "تحدث انقباضات القلب طبيعيًا على فواصل متساوية (إيقاع منتظم). وغالبًا يزداد المعدل لدى الرضّع والأطفال مع الشهيق وينقص مع الزفير - وهذا عدم انتظام الجيوب التنفسي. وعند ملاحظة إيقاع غير طبيعي استخدم الاستماع للنبض القمّي وحدد ما إذا كان عدم الانتظام جديدًا؛ فعدم الانتظام حديث الظهور يتطلب فحصًا فوريًا.", ref: "slide 40" },
    { q: "Give the scale for rating pulse quality.", a: "0: no pulse detected. 1+: thready, weak pulse, easily obliterated with pressure, may come and go. 2+: pulse difficult to palpate, may be obliterated with pressure. 3+: normal pulse. 4+: bounding, hyperactive pulse, easily palpated and cannot be obliterated. Palpate peripheral pulses bilaterally to compare quality - equality gives information about local blood flow.", qar: "اذكر مقياس تقييم قوة النبض.", aar: "0: لا نبض. 1+: نبض خيطي ضعيف يُمحى بسهولة بالضغط وقد يتقطع. 2+: نبض صعب الجس قد يُمحى بالضغط. 3+: نبض طبيعي. 4+: نبض وثّاب مفرط النشاط سهل الجس ولا يُمحى. اجسّ النبضات الطرفية على الجانبين للمقارنة - فتساوي النبض يعطي معلومات عن تدفق الدم الموضعي.", ref: "slides 41-43" },
    { q: "What is a pulse deficit?", a: "A difference between the apical and peripheral pulses: some ventricular contractions do not perfuse the body adequately, so the peripheral count is lower. It reflects the heart's ability to perfuse the body.", qar: "ما عجز النبض (pulse deficit)؟", aar: "فرق بين النبض القمّي والنبض الطرفي: بعض انقباضات البطين لا يضخ الدم للجسم بكفاية فيكون العد الطرفي أقل. وهو يعكس قدرة القلب على تروية الجسم.", ref: "slide 44" },
    { q: "Define external and internal respiration and the mechanics of breathing.", a: "External respiration: taking oxygen into and eliminating carbon dioxide from the body. Internal respiration: the use of oxygen, production of carbon dioxide, and exchange of these gases between the cells and the blood. Inspiration is an active process (inspiratory muscles contract, airway pressure becomes negative, air flows in); expiration is basically passive (lung recoil, muscles relax, air flows out).", qar: "عرّف التنفس الخارجي والداخلي وميكانيكية التنفس.", aar: "التنفس الخارجي: إدخال الأكسجين وإخراج ثاني أكسيد الكربون من الجسم. التنفس الداخلي: استخدام الأكسجين وإنتاج ثاني أكسيد الكربون وتبادل الغازين بين الخلايا والدم. الشهيق عملية نشطة (تنقبض عضلات الشهيق فيصبح ضغط المجرى الهوائي سالبًا ويدخل الهواء)؛ والزفير عملية سلبية أساسًا (ارتداد الرئة واسترخاء العضلات فيخرج الهواء).", ref: "slides 45-46" },
    { q: "Give the normal respiratory rate and tidal volume.", a: "At rest, the normal adult respiratory rate is 12 to 20 breaths per minute. Normal tidal volume (air moving in and out with each breath) is 500 mL, or 6 to 8 L/min. Normal breathing is automatic and involuntary.", qar: "اذكر معدل التنفس الطبيعي وحجم المد والجزر.", aar: "في الراحة، معدل تنفس البالغ الطبيعي من 12 إلى 20 نفسًا/دقيقة. وحجم المد والجزر الطبيعي (الهواء الداخل والخارج مع كل نفس) 500 مل أو 6 إلى 8 لتر/دقيقة. والتنفس الطبيعي تلقائي لا إرادي.", ref: "slide 47" },
    { q: "List the factors affecting respirations with their effects.", a: "Age (larger lung capacity lowers the rate; in aging, less elasticity raises it again); narcotics decrease rate and depth; sympathomimetic drugs (albuterol) dilate bronchioles and improve air movement; stress increases rate and depth; exercise increases rate and depth to meet oxygen needs and eliminate extra carbon dioxide and heat; altitude (less oxygen in air increases rate and depth); gender (men's larger lung capacity may mean a lower rate); slumped body position impairs gas exchange and may increase rate and depth; fever increases the rate to release extra heat.", qar: "اذكر العوامل المؤثرة في التنفس وتأثيراتها.", aar: "العمر (زيادة سعة الرئة تخفض المعدل؛ ومع التقدم في العمر يقل مرونة الرئة فيرتفع المعدل مجددًا)؛ والمخدرات تخفض المعدل والعمق؛ وميمات الودي (الألبوتيرول) توسع القصيبات وتحسن حركة الهواء؛ والضغط النفسي يزيد المعدل والعمق؛ والتمرين يزيدهما لتلبية حاجة الأكسجين والتخلص من ثاني أكسيد الكربون والحرارة الزائدين؛ والارتفاع (قلة الأكسجين في الهواء تزيد المعدل والعمق)؛ والجنس (سعة رئة الرجل الأكبر قد تعني معدلًا أقل)؛ ووضعية الجسم المنحنية تعيق تبادل الغازات وقد تزيد المعدل والعمق؛ والحمى تزيد المعدل لتفريغ الحرارة الزائدة.", ref: "slides 48-54" },
    { q: "Define tachypnea, bradypnea and apnea, with the infant rate.", a: "Infants at rest: 30 to 60 breaths per minute. Tachypnea: abnormally fast rate, usually above 20 in the adult. Bradypnea: abnormally slow rate, usually less than 12 in the adult. Apnea: the absence of respirations, described by its duration (e.g., a 10-second period of apnea); continuous apnea is synonymous with respiratory arrest and is not compatible with life.", qar: "عرّف تسرع التنفس وبطء التنفس وانقطاع النفس، مع معدل الرضّع.", aar: "الرضّع في الراحة: من 30 إلى 60 نفسًا/دقيقة. تسرع التنفس: معدل سريع بشكل غير طبيعي، عادة فوق 20 لدى البالغ. بطء التنفس: أقل من 12 لدى البالغ. انقطاع النفس: غياب التنفس ويوصف بمدته (مثل انقطاع 10 ثوانٍ)؛ واستمراره مرادف لتوقف التنفس ولا يتوافق مع الحياة.", ref: "slide 55" },
    { q: "Define blood pressure.", a: "The force that blood exerts against the walls of the blood vessels; the pressure in the systemic arteries is most commonly measured, stated in millimeters of mercury (mm Hg).", qar: "عرّف ضغط الدم.", aar: "القوة التي يبذلها الدم على جدران الأوعية الدموية؛ ويُقاس غالبًا في الشرايين الجهازية بوحدة ملم زئبق.", ref: "slide 56" },
    { q: "Define systolic, diastolic and pulse pressure.", a: "Systolic: the pressure measured during ventricular contraction (cardiac systole). Diastolic: during ventricular relaxation (cardiac diastole), due to elastic recoil of the vessels. Pulse pressure: the mathematical difference between them - a systolic of 120 and a diastolic of 80 gives a pulse pressure of 40 mm Hg.", qar: "عرّف الضغط الانقباضي والانبساطي وضغط النبض.", aar: "الانقباضي: الضغط المقاس أثناء انقباض البطينين. الانبساطي: أثناء ارتخاء البطينين وينتج عن الارتداد المرن للأوعية. ضغط النبض: الفرق الحسابي بينهما - فانقباضي 120 وانبساطي 80 يعطي ضغط نبض 40 ملم زئبق.", ref: "slide 57" },
    { q: "List the factors affecting blood pressure.", a: "Age (increases gradually through childhood and with aging as vessels narrow and lose elasticity; systolic rises more than diastolic, so pulse pressure widens); autonomic nervous system (sympathetic activity - pain, anxiety, fear, smoking, exercise - increases it); circulating volume (blood or fluid loss lowers it, excess fluid as in heart or renal failure raises it); medications (diuretics, cardiac medications, narcotic analgesics, antihypertensives); normal fluctuations (ambient temperature, the respiratory cycle, and a circadian pattern).", qar: "اذكر العوامل المؤثرة في ضغط الدم.", aar: "العمر (يرتفع تدريجيًا مع الطفولة والشيخوخة مع تضيق الأوعية وفقد مرونتها؛ والانقباضي يرتفع أكثر من الانبساطي فيتسع ضغط النبض)؛ والجهاز العصبي الذاتي (نشاط الودي - ألم وقلق وخوف وتدخين وتمرين - يرفعه)؛ والحجم الدائر (فقد الدم أو السوائل يخفضه والزيادة كما في قصور القلب أو الكلى ترفعه)؛ والأدوية (المدرات وأدوية القلب والمسكنات المخدرة وخافضات الضغط)؛ والتقلبات الطبيعية (حرارة المحيط ودورة التنفس والنمط اليومي).", ref: "slides 58-63" },
    { q: "Describe blood pressure measurement in the arm, including which arms to avoid.", a: "Usually measured in the arm with a cuff around the upper limb and blood flow auscultated or palpated at the brachial artery (or the radial artery with a cuff on the forearm). Avoid any arm with a venous access device, especially an internal arteriovenous fistula or peripheral vascular access for hemodialysis; and avoid the same side as a mastectomy, since measuring there can further impede circulation and contribute to lymphedema.", qar: "صف قياس ضغط الدم في الذراع، وما الذراع التي يجب تجنبها.", aar: "يُقاس عادة في الذراع بلف الكفة حول أعلى الطرف وسماع أو جس تدفق الدم عند الشريان العضدي (أو الكعبري بكفة على الساعد). تجنب أي ذراع بها وصول وريدي، خاصة الناسور الشرياني الوريدي الداخلي أو وصول غسيل الكلى؛ وتجنب جهة استئصال الثدي لأن القياس فيها قد يعيق الدورة ويسهم في الوذمة اللمفية.", ref: "slide 65" },
    { q: "Describe blood pressure measurement in the leg and ankle.", a: "Thigh: use a larger appropriate cuff with the client flat and supine, cuff centered midthigh over the popliteal artery; auscultate or palpate at the popliteal fossa. Ankle: client flat and supine, standard arm cuff just above the malleolus; auscultate or palpate the posterior tibial or dorsalis pedis pulse as you deflate. A cuff that is too small gives false high readings.", qar: "صف قياس ضغط الدم في الفخذ والكاحل.", aar: "الفخذ: استخدم كفة أكبر مناسبة والمريض مستلقٍ على ظهره، مع توسيط الكفة منتصف الفخذ فوق الشريان المأبضي؛ واسمع أو اجس عند الحفرة المأبضية. الكاحل: المريض مستلقٍ، وكفة ذراع قياسية فوق الكعب مباشرة؛ واسمع أو اجس النبض الظنبوبي الخلفي أو نبض ظهر القدم أثناء التفريغ. الكفة الصغيرة جدًا تعطي قراءة أعلى من الحقيقة.", ref: "slide 66" },
    { q: "State the AHA rules for proper cuff size and the errors of wrong sizes.", a: "Base cuff size on limb circumference: bladder width at least 40% of the circumference of the midpoint of the limb (average adult arm needs 12 to 14 cm); bladder length 80% to 100% of limb circumference (about twice the width). Apply snugly with the bladder centered over the artery. A cuff that is too small or loosely applied gives spuriously high readings; too large gives spuriously low readings.", qar: "اذكر قواعد جمعية القلب الأمريكية لمقاس الكفة الصحيح وأخطاء المقاسات الخاطئة.", aar: "اعتمد مقاس الكفة على محيط الطرف: عرض البالون 40% على الأقل من محيط منتصف الطرف (ذراع البالغ المتوسطة تحتاج 12 إلى 14 سم)؛ وطوله من 80 إلى 100% من المحيط (نحو ضعف العرض). طبّقها بإحكام مع توسيط البالون فوق الشريان. الكفة الصغيرة جدًا أو الرخوة تعطي قراءة أعلى زورًا؛ والكبيرة جدًا تعطي قراءة أقل زورًا.", ref: "slide 67" },
    { q: "State the rules for proper positioning during blood pressure measurement.", a: "Measure with the arm at heart level: above heart level gives a falsely low reading, below heart level falsely high. When the client is flat, the arm is approximately at heart level; if sitting or standing, support the forearm horizontally at heart level (about the fourth intercostal space). Failure to support the arm makes the client contract the arm muscles, elevating the pressure.", qar: "اذكر قواعد الوضعية الصحيحة أثناء قياس ضغط الدم.", aar: "قِس والذراع عند مستوى القلب: فوق مستوى القلب يعطي قراءة أقل زورًا، وتحته أعلى زورًا. عند استلقاء المريض تكون الذراع تقريبًا عند مستوى القلب؛ وإذا كان جالسًا أو واقفًا فادعم الساعد أفقيًا عند مستوى القلب (نحو الفضاء بين الضلعي الرابع). وعدم دعم الذراع يجعل المريض يقبض عضلات ذراعه فيرتفع الضغط.", ref: "slide 68" },
    { q: "State the rules for cuff inflation and deflation.", a: "Inflate the cuff rapidly and deflate it completely after measurement; slow, prolonged or frequent inflation promotes venous congestion. Wait at least 2 minutes before sequential inflation on the same limb. Elevating the arm above the head between measurements speeds venous return to the heart.", qar: "اذكر قواعد نفخ الكفة وتفريغها.", aar: "انفخ الكفة بسرعة وفرّغها تمامًا بعد القياس؛ فالنفخ البطيء أو المطول أو المتكرر يعزز الاحتقان الوريدي. انتظر دقيقتين على الأقل قبل النفخ التالي على الطرف نفسه. ورفع الذراع فوق الرأس بين القياسات يسرّع العودة الوريدية إلى القلب.", ref: "slide 70" },
    { q: "Describe the five Korotkoff phases.", a: "Phase I: first appearance of faint but clear tapping sounds that gradually increase - the first tapping sound is the systolic pressure. Phase II: muffled or swishing sounds. Phase III: distinct, loud sounds as blood flows relatively freely. Phase IV: a distinct, abrupt muffling sound with a soft blowing quality - the first diastolic figure in adults. Phase V: the last sound heard before continuous silence - the second diastolic measurement.", qar: "صف مراحل كوروتكوف الخمس.", aar: "المرحلة الأولى: أول ظهور لأصوات نقر خافتة لكن واضحة تشتد تدريجيًا - أول صوت نقر هو الضغط الانقباضي. الثانية: أصوات مكتومة أو حفيفية. الثالثة: أصوات عالية مميزة مع تدفق الدم بحرية نسبية. الرابعة: اكتام مفاجئ مميز بجودة نفخ ناعمة - الرقم الانبساطي الأول لدى البالغين. الخامسة: آخر صوت يُسمع قبل الصمت المتواصل - القياس الانبساطي الثاني.", ref: "slides 71-78" },
    { q: "What is the auscultatory gap, why does it matter, and how is it detected?", a: "The absence of Korotkoff sounds between phases I and II (may cover as much as 40 mm Hg, especially in hypertensive people). Failing to recognize it may cause underestimating the systolic pressure or overestimating the diastolic. It can be detected by palpating the brachial or radial pulse while inflating the cuff.", qar: "ما الفجوة السمعية، ولماذا تهم، وكيف تُكتشف؟", aar: "غياب أصوات كوروتكوف بين المرحلتين الأولى والثانية (قد يغطي حتى 40 ملم زئبق، خاصة لدى مرضى الضغط المرتفع). وإغفالها قد يؤدي إلى تقليل تقدير الانقباضي أو زيادة تقدير الانبساطي. وتُكتشف بجس النبض العضدي أو الكعبري أثناء نفخ الكفة.", ref: "slides 74, 79-80" },
    { q: "Define prehypertension and hypertension.", a: "Hypertension is chronically elevated blood pressure - a dangerous disease associated with increased risk of morbidity and mortality. For adults of any age, blood pressure between 120/80 and 139/89 mm Hg is considered prehypertension.", qar: "عرّف ما قبل ارتفاع الضغط وارتفاع الضغط.", aar: "ارتفاع الضغط هو ارتفاع مزمن في ضغط الدم - مرض خطير يرتبط بزيادة مخاطر المراضة والوفاة. وللبالغين في أي عمر، يُعد الضغط بين 120/80 و139/89 ملم زئبق ما قبل ارتفاع الضغط.", ref: "slide 81" },
    { q: "Define hypotension and the role of the client's baseline.", a: "Blood pressure below 100/60 mm Hg. Low readings can be normal for some healthy young adults. A sudden drop significantly below a person's normal range causes hypotension - a hypertensive client usually at 180/94 would be considered hypotensive at 120/80. A significant change from baseline matters more than any single measurement.", qar: "عرّف انخفاض الضغط ودور خط أساس المريض.", aar: "ضغط الدم أقل من 100/60 ملم زئبق. والقراءات المنخفضة قد تكون طبيعية لبعض الشباب الأصحاء. والهبوط المفاجئ بشكل ملحوظ عن المعدل المعتاد للشخص يسبب انخفاض الضغط - فمريض الضغط المعتاد على 180/94 يُعد منخفض الضغط عند 120/80. والتغيّر المهم عن خط الأساس أهم من أي قياس منفرد.", ref: "slide 82" },
    { q: "Describe orthostatic hypotension.", a: "Moving from a flat to a vertical position pools blood in the lower extremities; healthy reflexes compensate by increasing myocardial contraction and vasoconstriction. Inadequate compensation results in orthostatic hypotension: a drop in systolic pressure of at least 25 mm Hg or a drop in diastolic of at least 10 mm Hg, with symptoms of decreased cerebral perfusion (dizziness, weakness, blurred vision, syncope). Decreased BP with increased heart rate signals hypovolemia or impaired vasoconstriction; decreased BP without marked heart rate increase indicates autonomic nervous system dysfunction.", qar: "صف انخفاض الضغط الانتصابي.", aar: "الانتقال من الرقود إلى الوقوف يجمع الدم في الأطراف السفلية؛ وتعوّض المنعكسات السليمة بزيادة انقباض عضلة القلب وتضيق الأوعية. والتعويض غير الكافي يسبب انخفاض الضغط الانتصابي: هبوط الانقباضي 25 ملم زئبق على الأقل أو الانبساطي 10 على الأقل، مع أعراض نقص التروية الدماغية (دوار وضعف وتشوش رؤية وإغماء). وهبوط الضغط مع زيادة النبض يشير إلى نقص حجم الدم أو ضعف تضيق الأوعية؛ وهبوطه دون زيادة ملحوظة في النبض يشير إلى خلل الجهاز العصبي الذاتي.", ref: "slides 83-84" },
    { q: "What is pulsus paradoxus and in which diseases does it occur?", a: "An exaggerated decrease in systolic blood pressure with inspiration (blood pressure is normally lower during inspiration than expiration). It occurs in cardiac tamponade, constrictive pericarditis, emphysema, hypovolemic shock and pulmonary embolus.", qar: "ما النبض المتناقض (pulsus paradoxus) وفي أي أمراض يحدث؟", aar: "هبوط مبالغ فيه في الضغط الانقباضي مع الشهيق (فالضغط طبيعيًا أقل أثناء الشهيق من الزفير). ويحدث في تضخم القلب (tamponade)، والتهاب التأمور المضيّق، والنفاخ الرئوي، وصدمة نقص حجم الدم، والانسداد الرئوي.", ref: "slide 69" }
  ]
});
LECTURES.push({
  id: "02-medications",
  en: "Administration of Medications",
  ar: "إعطاء الأدوية",
  cards: [
{q:"What is a medication (drug)?",a:"A substance administered for the diagnosis, cure, treatment, or relief of a symptom; or for the prevention of disease.",qar:"ما هو الدواء؟",aar:"مادة تُعطى لتشخيص مرض أو علاجه أو الشفاء منه أو تخفيف أعراضه؛ أو للوقاية منه.",ref:"p. 2"},
{q:"What is pharmacology?",a:"The study of the effect of drugs on living organisms (how drugs act on the body).",qar:"ما هو علم الأدوية؟",aar:"دراسة تأثير الأدوية على الكائنات الحية، أي كيفية عمل الأدوية في الجسم.",ref:"p. 2"},
{q:"What is a prescription?",a:"The written direction for the preparation and administration of a drug.",qar:"ما هي الروشتة (الوصفة الطبية)؟",aar:"التوجيه المكتوب لتحضير الدواء وإعطائه.",ref:"p. 3"},
{q:"For which three purposes can drugs be administered?",a:"Diagnostic purpose, prophylaxis, and therapeutic purpose.",qar:"ما الأغراض الثلاثة لإعطاء الأدوية؟",aar:"الغرض التشخيصي، والوقاية، والغرض العلاجي.",ref:"p. 4"},
{q:"Name the six uses of drugs.",a:"Prevention (prophylaxis), diagnosis, suppression, treatment (palliative), cure, and enhancement.",qar:"اذكر استخدامات الأدوية الستة.",aar:"الوقاية، التشخيص، التثبيط (قمع الأعراض)، العلاج الملطف، الشفاء، التحسين/الدعم.",ref:"pp. 5-6"},
{q:"Drug use: prevention. Definition and example.",a:"Used as prophylaxis to prevent disease or decrease its severity, for example vaccines and heparin.",qar:"استخدام الدواء للوقاية: التعريف ومثال.",aar:"تُستخدم كوقاية لمنع المرض أو تقليل شدته، مثل اللقاحات والهيبارين.",ref:"p. 5"},
{q:"Drug use: diagnosis. Definition and example.",a:"Drugs used by themselves or with radiopharmaceuticals, for example barium enema and cardiac catheterization.",qar:"استخدام الدواء في التشخيص: التعريف ومثال.",aar:"تُستخدم وحدها أو مع مواد مشعة، مثل حقنة الباريوم الشرجية وقسطرة القلب.",ref:"p. 5"},
{q:"Drug use: treatment (palliative). Definition and example.",a:"Alleviate the symptoms of a disease without curing it, for example anti-hypertensive drugs and analgesics.",qar:"استخدام الدواء في العلاج (الملطف): التعريف ومثال.",aar:"تخفيف أعراض المرض دون الشفاء منه، مثل أدوية الضغط والمسكنات.",ref:"p. 6"},
{q:"Drug use: cure. Definition and example.",a:"Remove the causative agent of a disease, for example antibiotics against infection.",qar:"استخدام الدواء في الشفاء: التعريف ومثال.",aar:"إزالة العامل المسبب للمرض، مثل المضادات الحيوية ضد العدوى.",ref:"p. 6"},
{q:"Drug use: enhancement. Definition and example.",a:"Strengthen a weakened organ, for example insulin and thyroxin.",qar:"استخدام الدواء في التحسين/الدعم: التعريف ومثال.",aar:"تقوية عضو ضعيف، مثل الأنسولين والثيروكسين.",ref:"p. 6"},
{q:"Which laws control medications with potential for abuse in Egypt?",a:"The Dangerous Drug Act (1930) and the Narcotic Drugs and Psychotropic Substances Act (1985), which control narcotics, anti-anxiety drugs, sedatives and stimulants.",qar:"ما القوانين التي تنظم الأدوية القابلة لسوء الاستخدام في مصر؟",aar:"قانون الأدوية الخطرة (1930) وقانون المخدرات والمؤثرات العقلية (1985)، وينظمان المخدرات ومضادات القلق والمهدئات والمنبهات.",ref:"p. 7"},
{q:"What are the nurse's responsibilities regarding controlled drugs?",a:"Keep controlled drugs under lock and key in a secure, locked storage place or container.",qar:"ما مسؤوليات الممرضة تجاه الأدوية المراقبة؟",aar:"حفظ الأدوية المراقبة تحت القفل والمفتاح في مكان تخزين أو حاوية آمنة ومغلقة.",ref:"p. 8"},
{q:"\"Every substance can be poisonous.\" What determines whether a drug acts as medicine or poison?",a:"The dose: when a drug is given in excess it becomes poisonous, so medication must be administered very carefully.",qar:"\"كل مادة يمكن أن تكون سامة.\" ما الذي يحدد كون الدواء علاجًا أم سمًا؟",aar:"الجرعة: إذا أُعطي الدواء بزيادة يصبح سامًا، لذلك يجب إعطاء الأدوية بحذر شديد.",ref:"p. 9"},
{q:"A drug can have up to how many different names? Name them.",a:"Four names: chemical name, generic name, official name, and trade (brand) name.",qar:"كم اسماً يمكن أن يحمل الدواء الواحد؟ اذكرها.",aar:"أربعة أسماء: الاسم الكيميائي، والاسم العام، والاسم الرسمي، والاسم التجاري.",ref:"p. 10"},
{q:"What is the generic name of a drug? What does the lecture say about prescribing it?",a:"The official (non-brand) name given by the pharmaceutical company that first develops the drug. The lecture states the generic name is preferred in all prescription writing because it is cheaper and uniform.",qar:"ما الاسم العام للدواء؟ وماذا تقول المحاضرة عن كتابته في الروشتة؟",aar:"الاسم الرسمي غير التجاري الذي تعطيه الشركة التي طورت الدواء أولاً. تذكر المحاضرة أن الاسم العام هو المفضل في كتابة الوصفات لأنه أرخص وموحد.",ref:"p. 11"},
{q:"What is the trade (brand) name? Example.",a:"The name given by the drug manufacturer; a drug can have many trade names. Example: paracetamol is sold as Panadol, Cetal, Paramol and others.",qar:"ما الاسم التجاري؟ مع مثال.",aar:"الاسم الذي تضعه الشركة المصنعة، وقد يكون للدواء أسماء تجارية كثيرة. مثال: الباراسيتامول يُباع بأسماء مثل بنادول وسيتال وبارامول.",ref:"pp. 10, 12"},
{q:"By which five criteria can medications be classified?",a:"Body system they act on, therapeutic usage, the diseases they treat, their action, and their overall chemical effect.",qar:"ما المعايير الخمسة لتصنيف الأدوية؟",aar:"حسب الجهاز الذي تعمل عليه، والاستخدام العلاجي، والأمراض التي تعالجها، وتأثيرها، وتأثيرها الكيميائي العام.",ref:"pp. 13-14"},
{q:"How are medications supplied and stored in the hospital?",a:"Supplied by the pharmacy in containers kept in a special cupboard, drug trolley, or wall cabinet at or near the nurses' station.",qar:"كيف تُورَّد الأدوية وتُخزَّن في المستشفى؟",aar:"تُورَّد من الصيدلية في عبوات تُحفظ في دولاب خاص أو عربة أدوية أو خزانة حائط داخل محطة التمريض أو بالقرب منها.",ref:"p. 15"},
{q:"General storage rules for medications.",a:"Store in a cool dry place away from direct sunlight; liquids like lotions and liniments must not be refrigerated; store at the recommended temperature.",qar:"القواعد العامة لتخزين الأدوية.",aar:"تُخزَّن في مكان بارد وجاف بعيدًا عن أشعة الشمس المباشرة؛ والسوائل مثل اللوسيون والمراهم لا تُبرَّد؛ وتُخزَّن في درجة الحرارة الموصى بها.",ref:"pp. 16-17"},
{q:"In some countries, three cupboards are used. What are Cupboards I and II?",a:"Cupboard I: internal use medicines (oral drugs). Cupboard II: external use medicines (lotions, ointments and liniments).",qar:"في بعض الدول تُستخدم ثلاثة دواليب. ما الدولابان الأول والثاني؟",aar:"الدولاب الأول: أدوية الاستخدام الداخلي (الفموية). الدولاب الثاني: أدوية الاستخدام الخارجي (اللوسيون والمراهم والدهانات).",ref:"pp. 17-18"},
{q:"What is Cupboard III? How must it be kept?",a:"Dangerous drugs and narcotics. It must be locked at all times; the keys are kept by the nurse in charge, and the drugs are checked and recorded at each change of shift.",qar:"ما الدولاب الثالث؟ وكيف يجب حفظه؟",aar:"الأدوية الخطرة والمخدرات. يجب أن يكون مغلقًا دائمًا، والمفاتيح مع الممرضة المسؤولة، وتُراجَع الأدوية وتُسجَّل مع كل تغيير شيفت.",ref:"pp. 17-18"},
{q:"What is the emergency cupboard?",a:"Located near the nurses' station for quick access; contains emergency medications and IV fluids, for example aminophylline, hydralazine, oxytocin and IV infusions.",qar:"ما دولاب الطوارئ؟",aar:"يقع قرب محطة التمريض للوصول السريع، ويحتوي أدوية الطوارئ والمحاليل الوريدية، مثل الأمينوفيللين والهيدرالازين والأوكسيتوسين والمحاليل الوريدية.",ref:"pp. 17-18"},
{q:"Principles of medication administration include which two sets of rules?",a:"The 3 checks and the 10 Rights.",qar:"تشمل مبادئ إعطاء الأدوية أي مجموعتين من القواعد؟",aar:"التحققات الثلاثة والحقوق العشرة.",ref:"p. 19"},
{q:"List the 3 checks of medication.",a:"1) Check when obtaining the container of medicine. 2) Check when removing the medicine from the container. 3) Check when replacing the container.",qar:"اذكر التحققات الثلاثة للدواء.",aar:"1) عند إحضار عبوة الدواء. 2) عند إخراج الدواء من العبوة. 3) عند إعادة العبوة.",ref:"p. 19"},
{q:"Right patient: what should the nurse do?",a:"Ask the patient to state his/her full name and compare it with the identification bracelet (ID band), the patient's folder/medical record, and the medication or treatment chart; never depend only on the room or bed number.",qar:"المريض الصحيح: ماذا تفعل الممرضة؟",aar:"تطلب من المريض ذكر اسمه الكامل وتقارنه بسوار التعريف وملف المريض/سجله الطبي وشيت العلاج؛ ولا تعتمد أبدًا على رقم الغرفة أو السرير فقط.",ref:"p. 20"},
{q:"Right patient: how many identifiers are used to confirm identity?",a:"General guidance (not from our slides): use two identifiers, for example full name plus date of birth or record number, per placement policy. The slide lists full name checked against ID band, folder and medication chart.",qar:"المريض الصحيح: كم معرِّفًا يُستخدم لتأكيد الهوية؟",aar:"إرشاد عام (ليس من سلايداتنا): استخدم معرِّفين اثنين، مثل الاسم الكامل مع تاريخ الميلاد أو رقم الملف، حسب سياسة مكان التدريب. السلايد يذكر الاسم الكامل مقارنًا بسوار التعريف والملف وشيت العلاج.",ref:"p. 20"},
{q:"Right medication: what should be compared before giving a drug?",a:"Compare the medication label with the medication order/chart, and the medication name with the patient's name tag/ID band; be careful with patients who have the same or similar names.",qar:"الدواء الصحيح: ما الذي يجب مقارنته قبل إعطاء الدواء؟",aar:"مقارنة لاصقة الدواء بأمر الدواء/الشيت، واسم الدواء باسم المريض/سوار التعريف؛ مع الحذر مع المرضى المتشابهين في الاسم.",ref:"p. 21"},
{q:"Right time: which medications require specific timing and why?",a:"Antibiotics and antimalarials (correct timing achieves cure and prevents drug resistance); antituberculosis drugs (given on an empty stomach); NSAIDs (given after meals to reduce stomach irritation).",qar:"الوقت الصحيح: أي الأدوية تحتاج توقيتًا محددًا ولماذا؟",aar:"المضادات الحيوية ومضادات الملاريا (التوقيت الصحيح يحقق الشفاء ويمنع المقاومة)؛ أدوية السل (تُعطى على معدة فارغة)؛ مضادات الالتهاب غير الستيرويدية (تُعطى بعد الأكل لتقليل تهيج المعدة).",ref:"p. 22"},
{q:"Why is the drug interval between doses important?",a:"Proper intervals maintain the correct drug concentration in the blood; doses too late reduce the effect, doses too close together raise levels and can cause toxicity.",qar:"لماذا تهم الفترة الزمنية بين الجرعات؟",aar:"الفترات الصحيحة تحافظ على تركيز الدواء المناسب في الدم؛ التأخير يقلل التأثير، والجرعات المتقاربة ترفع التركيز وقد تسبب تسممًا.",ref:"p. 22"},
{q:"Right dose: what does wrong calculation risk, and when must the nurse be extra careful?",a:"Overdose or underdose. Be careful when the available strength/volume differs from the prescribed dose or the unit differs from the doctor's order; calculate accurately and double-check, especially with high-risk medications.",qar:"الجرعة الصحيحة: ما خطر الحساب الخاطئ، ومتى تنتبه الممرضة أكثر؟",aar:"جرعة زائدة أو ناقصة. تنتبه عند اختلاف التركيز/الحجم المتاح عن الموصوف أو اختلاف وحدة القياس عن أمر الطبيب؛ وتحسب بدقة وتعيد المراجعة خاصة مع الأدوية عالية الخطورة.",ref:"p. 23"},
{q:"Right route: what if the route is unclear or missing from the order?",a:"Contact the prescriber (doctor) for clarification; never choose or assume the route alone. Examples of routes: oral (PO), intravenous (IV), intramuscular (IM), subcutaneous (SC).",qar:"طريقة الإعطاء الصحيحة: ماذا لو كانت الطريقة غير واضحة أو مفقودة من الأمر؟",aar:"تتواصل مع الطبيب للتوضيح؛ ولا تختار أو تفترض الطريقة بنفسها. أمثلة الطرق: فموي، وريدي، عضلي، تحت الجلد.",ref:"p. 24"},
{q:"Right to information: what should the nurse teach the patient about the medication?",a:"Name of the medication, purpose and benefits (desired effects), possible side and adverse effects, how and when to take it, and any important instructions.",qar:"الحق في المعلومات: ماذا تعلِّم الممرضة المريض عن دوائه؟",aar:"اسم الدواء، والغرض والفوائد، والآثار الجانبية والعكسية المحتملة، وكيفية ووقت تناوله، وأي تعليمات مهمة.",ref:"p. 25"},
{q:"Right to refuse: what should the nurse do if the patient refuses a medication?",a:"Respect the decision, explain the purpose and benefits of the medication and the possible consequences of refusing it, then document the refusal and inform the healthcare provider according to policy.",qar:"الحق في الرفض: ماذا تفعل الممرضة إذا رفض المريض الدواء؟",aar:"تحترم القرار، وتشرح غرض الدواء وفوائده وعواقب رفضه المحتملة، ثم توثق الرفض وتبلغ الفريق الطبي حسب السياسة.",ref:"pp. 26-27"},
{q:"Right assessment: give the digoxin example.",a:"Before digoxin, check the apical pulse; if it is below the recommended level, hold the medication and notify the healthcare provider according to policy.",qar:"التقييم الصحيح: اذكر مثال الديجوكسين.",aar:"قبل الديجوكسين تقيس النبض القمي؛ إذا كان أقل من المستوى الموصى به تحجب الدواء وتبلغ الفريق الطبي حسب السياسة.",ref:"p. 28"},
{q:"Right documentation: when and what is documented?",a:"Document only after the medication has been given, never before. Record: medication name, dose, route, date and time of administration, and the nurse's signature/initials.",qar:"التوثيق الصحيح: متى وماذا يُوثَّق؟",aar:"يُوثَّق بعد إعطاء الدواء فقط وليس قبله أبدًا. يُسجَّل: اسم الدواء، الجرعة، طريقة الإعطاء، التاريخ والوقت، وتوقيع/أحرف الممرضة.",ref:"p. 29"},
{q:"Right evaluation: what does the nurse assess after giving a medication?",a:"Desired (therapeutic) effects, side effects or adverse reactions, and any change in the patient's condition; document the response and report abnormal findings. Example: after an analgesic, evaluate whether pain decreased.",qar:"التقييم (المتابعة) الصحيح: ما الذي تقيِّمه الممرضة بعد إعطاء الدواء؟",aar:"التأثير العلاجي المطلوب، والآثار الجانبية أو العكسية، وأي تغير في حالة المريض؛ مع توثيق الاستجابة والإبلاغ عن أي نتائج غير طبيعية. مثال: بعد المسكن تقيِّم هل قل الألم.",ref:"p. 30"},
{q:"Name the four types of medication orders with an example each.",a:"Stat order (given immediately, once; e.g. morphine sulfate 10 mg IV stat). Single/one-time order (once at a specific time; e.g. Seconal 100 mg at bedtime). Standing order (given regularly until discontinued; e.g. amoxicillin 500 mg PO twice daily for 2 days). PRN order (as needed after assessment; e.g. Amphojel 15 mL PRN).",qar:"اذكر أنواع أوامر الدواء الأربعة مع مثال لكل نوع.",aar:"أمر فوري (يُعطى فورًا ولمرة واحدة؛ مثل مورفين 10 مجم وريدي فورًا). أمر لمرة واحدة (في وقت محدد؛ مثل سيكونال 100 مجم وقت النوم). أمر مستمر (يُعطى بانتظام حتى يُوقَف؛ مثل أموكسيسيلين 500 مجم مرتين يوميًا لمدة يومين). أمر عند الحاجة (بعد تقييم المريض؛ مثل أمفوجيل 15 مل عند الحاجة).",ref:"pp. 31-34"},
{q:"What are the 7 essential parts of a medication order?",a:"1) Patient's full name. 2) Date and time. 3) Drug name. 4) Dosage. 5) Route of administration. 6) Time and frequency of administration. 7) Signature of physician.",qar:"ما الأجزاء السبعة الأساسية لأمر الدواء؟",aar:"1) الاسم الكامل للمريض. 2) التاريخ والوقت. 3) اسم الدواء. 4) الجرعة. 5) طريقة الإعطاء. 6) وقت وتكرار الإعطاء. 7) توقيع الطبيب.",ref:"p. 35"},
{q:"Abbreviations: what do STAT, ASAP, PRN, and routine orders mean and how fast are they given?",a:"STAT (from Latin statim): immediately, once, within 5 minutes of the written order. ASAP: as soon as possible, within 30 minutes. PRN (pro re nata): as needed, by the nurse's judgment after assessment. Routine orders: usually carried out within 2 hours.",qar:"الاختصارات: ماذا تعني STAT وASAP وPRN والأوامر الروتينية وما سرعة تنفيذها؟",aar:"STAT (من اللاتينية statim): فورًا ولمرة واحدة خلال 5 دقائق من الأمر المكتوب. ASAP: في أقرب وقت ممكن خلال 30 دقيقة. PRN: عند الحاجة بحسب تقييم الممرضة. الأوامر الروتينية: تُنفَّذ عادة خلال ساعتين.",ref:"pp. 37-38"},
{q:"Common prescription abbreviations: ac, pc, bid, tid, qid, q2h, PO, IM, IV, gtt, Rx.",a:"ac: before meals. pc: after meals. bid: twice per day. tid: three times per day. qid: four times per day. q2h: every 2 hours. PO: by mouth. IM: intramuscular. IV: intravenous. gtt: drops. Rx: take (prescription).",qar:"اختصارات شائعة في الروشتة: ac وpc وbid وtid وqid وq2h وPO وIM وIV وgtt وRx.",aar:"ac: قبل الأكل. pc: بعد الأكل. bid: مرتين يوميًا. tid: ثلاث مرات يوميًا. qid: أربع مرات يوميًا. q2h: كل ساعتين. PO: بالفم. IM: عضلي. IV: وريدي. gtt: قطرات. Rx: وصفة دوائية (خذ).",ref:"pp. 38-40"},
{q:"Drug forms: what are the three types? Why does the form matter?",a:"Solid (tablet, capsule), liquid (syrup, eye drops), and semi-solid (ointment, lotion). The form of the medication determines its route of administration.",qar:"أشكال الدواء: ما الأنواع الثلاثة؟ ولماذا يهم الشكل؟",aar:"صلب (قرص، كبسولة)، وسائل (شراب، قطرة عين)، وشبه صلب (مرهم، لوسيون). شكل الدواء يحدد طريقة إعطائه.",ref:"pp. 41-42"},
{q:"Name the four main routes of drug administration.",a:"Oral (including sublingual under the tongue and buccal against the cheek), parenteral (injections), topical (skin and mucous membranes), and inhalation (through nasal/oral passages or endotracheal/tracheostomy tubes).",qar:"اذكر الطرق الأربع الرئيسية لإعطاء الدواء.",aar:"فموي (ويشمل تحت اللسان والشدقي)، وحقني (بارنترال)، وموضعي (الجلد والأغشية المخاطية)، واستنشاقي (عبر الأنف أو الفم أو أنابيب القصبة الهوائية).",ref:"pp. 48-49, 55-56"},
{q:"What are the four major parenteral (injection) sites?",a:"Intradermal (ID): into the dermis just under the epidermis. Subcutaneous (SC): into tissues just below the dermis. Intramuscular (IM): into a muscle. Intravenous (IV): into a vein.",qar:"ما مواضع الحقن الأربعة الرئيسية؟",aar:"داخل الجلد (في الأدمة تحت البشرة مباشرة)، وتحت الجلد (في الأنسجة أسفل الأدمة)، وعضلي (داخل العضلة)، ووريدي (داخل الوريد).",ref:"p. 50"},
{q:"Types of medication action: define therapeutic effect, side effect, and toxic effect.",a:"Therapeutic effect: the expected physiological response (e.g. paracetamol reduces pain and fever). Side effect: predictable, often unavoidable secondary effects at a usual dose (nausea, loss of appetite). Toxic effect: develops after prolonged intake or accumulation due to impaired metabolism/excretion (liver or kidney damage).",qar:"أنواع تأثير الدواء: عرِّف التأثير العلاجي والأثر الجانبي والتأثير السام.",aar:"التأثير العلاجي: الاستجابة الفسيولوجية المتوقعة (مثل خفض الباراسيتامول للألم والحرارة). الأثر الجانبي: تأثيرات ثانوية متوقعة وغالبًا لا يمكن تجنبها بالجرعة المعتادة (غثيان، فقدان شهية). التأثير السام: يحدث بعد تناول طويل أو تراكم الدواء بسبب ضعف الأيض أو الإخراج (تلف كبدي أو كلوي).",ref:"pp. 58-61"},
{q:"Define adverse effect, allergic reaction, and idiosyncratic reaction with examples.",a:"Adverse effects: undesirable, unpredictable severe responses (anaphylaxis, hepatotoxicity, nephrotoxicity, Stevens-Johnson syndrome, GI bleeding). Allergic reaction: unpredictable immunological response (rash or swelling from paracetamol). Idiosyncratic reaction: overreaction, underreaction, or an unusual response (a child on Benadryl becomes excited instead of drowsy).",qar:"عرِّف الأثر العكسي والتحسس الدوائي والاستجابة غير النمطية مع أمثلة.",aar:"الأثر العكسي: استجابات شديدة غير مرغوبة وغير متوقعة (صدمة الحساسية، سمية كبدية أو كلوية، متلازمة ستيفنز-جونسون، نزيف هضمي). التحسس: استجابة مناعية غير متوقعة (طفح أو تورم من الباراسيتامول). الاستجابة غير النمطية: فرط أو نقص استجابة أو استجابة مختلفة (طفل يأخذ بينادريل فيصبح متهيجًا بدل النعاس).",ref:"pp. 60-62"},
{q:"Drip rate calculation: give the formula and the drop factors.",a:"Drops per minute = (total volume to be given x drop factor) / (time in hours x 60). Drop factor: macro set = 15 gtt/mL, micro set = 60 gtt/mL. Example: 1000 mL over 8 hours with a macro set = (1000x15)/(8x60) = 31 gtt/min.",qar:"حساب معدل التنقيط: اذكر القانون ومعاملَي القطرات.",aar:"القطرات في الدقيقة = (إجمالي الحجم × معامل القطرات) ÷ (الزمن بالساعات × 60). المعامل: الطقم الكبير = 15 قطرة/مل، والصغير = 60 قطرة/مل. مثال: 1000 مل على 8 ساعات بطقم كبير = (1000×15)÷(8×60) = 31 قطرة/دقيقة.",ref:"pp. 79-81"},
{q:"How is a dose calculated according to body weight and body surface area?",a:"Body weight: total dose = prescribed dose x patient's weight (5 mg/kg x 60 kg = 300 mg). Body surface area: total dose = prescribed dose x BSA (50 mg/m2 x 1.8 m2 = 90 mg); BSA dosing is common with chemotherapy.",qar:"كيف تُحسب الجرعة حسب وزن الجسم ومساحة سطح الجسم؟",aar:"الوزن: الجرعة الكلية = الجرعة الموصوفة × وزن المريض (5 مجم/كجم × 60 كجم = 300 مجم). مساحة سطح الجسم: الجرعة الكلية = الجرعة الموصوفة × المساحة (50 مجم/م2 × 1.8 م2 = 90 مجم)؛ وتُستخدم كثيرًا مع العلاج الكيميائي.",ref:"pp. 82-83"},
{q:"Name ten factors affecting drug action.",a:"Body size, pregnancy, lactation, age (paediatric and geriatric), genetic factors, disease states (kidney and liver), route of administration, environmental factors, psychological factors, and tolerance and resistance. Diet also matters: vitamin K in green leafy vegetables counteracts warfarin.",qar:"اذكر عشرة عوامل تؤثر في تأثير الدواء.",aar:"حجم الجسم، الحمل، الرضاعة، السن (أطفال ومسنون)، العوامل الوراثية، الأمراض (الكلى والكبد)، طريقة الإعطاء، العوامل البيئية، العوامل النفسية، والتحمل والمقاومة. والغذاء مهم أيضًا: فيتامين K في الخضروات الورقية يعاكس تأثير الوارفارين.",ref:"pp. 84-89"},
{q:"Safety in administering medications: list key rules.",a:"Read the physician's order and consult if unclear; consider age and weight; know the drugs given; check colour, odour and consistency; follow the 10 rights and 3 checks; calculate dosage accurately; give drugs one by one; stay with the patient until the medicine is taken; never leave medicine with the patient; take a medication and allergy history; report errors per hospital policy.",qar:"الأمان في إعطاء الأدوية: اذكر القواعد الأساسية.",aar:"قراءة أمر الطبيب واستشارته إن لم يكن واضحًا؛ مراعاة السن والوزن؛ معرفة الأدوية المُعطاة؛ ملاحظة لون الدواء ورائحته وقوامه؛ اتباع الحقوق العشرة والتحققات الثلاثة؛ حساب الجرعة بدقة؛ إعطاء الأدوية واحدًا واحدًا؛ البقاء مع المريض حتى يأخذ الدواء كاملًا؛ عدم ترك الدواء مع المريض؛ أخذ تاريخ دوائي وتحسسي؛ والإبلاغ عن الأخطاء حسب سياسة المستشفى.",ref:"pp. 90-93"},
{q:"What is a medication error? What are its four main types, and where do most errors occur?",a:"Unintended mistakes in prescribing, dispensing and administration that could harm the patient. Four types: prescription errors (wrong drug or dose), transcription/interpretation errors (misread abbreviations), preparation errors (calculation error), and administration errors (wrong dose, wrong time, omission, or additional dose). Most medication errors occur during the administration stage.",qar:"ما الخطأ الدوائي؟ وما أنواعه الأربعة، وأين يقع معظمها؟",aar:"أخطاء غير مقصودة في الوصف أو الصرف أو الإعطاء قد تضر المريض. الأنواع الأربعة: أخطاء الوصف (دواء أو جرعة خاطئة)، وأخطاء النسخ/التفسير (سوء قراءة الاختصارات)، وأخطاء التحضير (خطأ حسابي)، وأخطاء الإعطاء (جرعة أو وقت خاطئ أو حذف أو جرعة إضافية). معظم الأخطاء الدوائية تقع في مرحلة الإعطاء.",ref:"pp. 94-95"}
  ]

LECTURES.push({
  id: "history",
  en: "Nursing History and Role",
  ar: "تاريخ التمريض وأدواره",
  cards: [
    { q: "In early civilizations, what did people believe caused health and sickness?", a: "Good spirits brought health; evil spirits brought sickness and death.", qar: "في الحضارات القديمة، بماذا اعتقد الناس أن الصحة والمرض يحدثان؟", aar: "الأرواح الطيبة تجلب الصحة، والأرواح الشريرة تجلب المرض والموت.", ref: "slide 2" },
    { q: "Why did temples become centers of medical care in early civilizations?", a: "Because illness was believed to be caused by sin and the gods' displeasure.", qar: "لماذا أصبحت المعابد مراكز للرعاية الطبية في الحضارات القديمة؟", aar: "لأن الناس اعتقدوا أن المرض سببه الخطيئة وغضب الآلهة.", ref: "slide 2" },
    { q: "Where did nurses care for sick people in early civilizations?", a: "In the home and the community; they also practiced as nurse-midwives.", qar: "أين كان الممرضون يعتنون بالمرضى في الحضارات القديمة؟", aar: "في المنزل والمجتمع، وكانوا يمارسون أيضًا كقابلات (ممرضات توليد).", ref: "slide 2" },
    { q: "What changed about nursing in the Early Christian period?", a: "Nursing began to have a formal and more clearly defined role; members of male religious orders gave nursing care and visited sick people.", qar: "ما الذي تغيّر في التمريض في العصر المسيحي المبكر؟", aar: "بدأ التمريض يأخذ دورًا رسميًا وأكثر وضوحًا، وكان أعضاء الرهبنات من الرجال يقدمون الرعاية التمريضية ويزورون المرضى.", ref: "slide 2" },
    { q: "What effect did World War II have on nursing?", a: "It emphasized the need for more nurses and caused a knowledge explosion in medicine and technology, which broadened the role of nurses.", qar: "ما تأثير الحرب العالمية الثانية على التمريض؟", aar: "أكّدت الحاجة إلى مزيد من الممرضين، وأحدثت انفجارًا معرفيًا في الطب والتكنولوجيا وسّع دور الممرضين.", ref: "slide 3" },
    { q: "How was nursing education upgraded after World War II?", a: "Nursing schools were based on educational objectives and increasingly developed in university and college settings, leading to nursing degrees for both men and women.", qar: "كيف تطوّر تعليم التمريض بعد الحرب العالمية الثانية؟", aar: "أصبحت مدارس التمريض مبنية على أهداف تعليمية وتطورت داخل الجامعات والكليات، مما أدى إلى درجات علمية في التمريض للرجال والنساء.", ref: "slide 3" },
    { q: "Give the modern (ICN) definition of nursing.", a: "Autonomous and collaborative care of individuals of all ages, families, groups and communities, sick or well, in all settings; it includes promotion of health, prevention of illness, and care of ill, disabled and dying people, plus advocacy, a safe environment, research, health policy, management and education.", qar: "اذكر التعريف الحديث (المجلس الدولي للتمريض) لمهنة التمريض.", aar: "رعاية مستقلة وتشاركية للأفراد من جميع الأعمار والأسر والجماعات والمجتمعات، أصحاء أو مرضى، وفي جميع الأماكن؛ وتشمل تعزيز الصحة والوقاية من المرض ورعاية المرضى وذوي الإعاقة والمحتضرين، إضافة إلى المناصرة والبيئة الآمنة والبحث وسياسات الصحة والإدارة والتعليم.", ref: "slide 4" },
    { q: "List the four aims of nursing.", a: "1) To promote health. 2) To prevent illness. 3) To restore health. 4) To facilitate coping with disability or death.", qar: "اذكر الأهداف الأربعة للتمريض.", aar: "1) تعزيز الصحة. 2) الوقاية من المرض. 3) استعادة الصحة. 4) تيسير التكيّف مع الإعاقة أو الموت.", ref: "slide 5" },
    { q: "How is health defined in the health-promotion aim?", a: "Health is a state of optimal functioning or well-being.", qar: "كيف تُعرَّف الصحة ضمن هدف تعزيز الصحة؟", aar: "الصحة هي حالة من الأداء الأمثل أو العافية.", ref: "slide 6" },
    { q: "What motivates health promotion?", a: "The desire to increase a person's well-being and health.", qar: "ما الدافع وراء تعزيز الصحة؟", aar: "الرغبة في زيادة عافية الشخص وصحته.", ref: "slide 6" },
    { q: "List the factors that affect a person's level of health.", a: "Genetic inheritance, cognitive abilities, educational level, age, gender, culture, developmental level, life style, environment, and socioeconomic status.", qar: "اذكر العوامل التي تؤثر في مستوى صحة الفرد.", aar: "الوراثة الجينية، والقدرات المعرفية، والمستوى التعليمي، والعمر، والنوع، والثقافة، ومستوى النمو، ونمط الحياة، والبيئة، والحالة الاجتماعية والاقتصادية.", ref: "slide 6" },
    { q: "What is the nurse's role in health promotion?", a: "Improve patient quality of life and life style modification; increase health awareness by teaching behaviors and factors that contribute to or diminish health; teach self-care activities; encourage health promotion by providing information and referral.", qar: "ما دور الممرض في تعزيز الصحة؟", aar: "تحسين جودة حياة المريض وتعديل نمط حياته؛ وزيادة الوعي الصحي بتعليم السلوكيات والعوامل التي تدعم الصحة أو تضعفها؛ وتعليم أنشطة العناية الذاتية؛ وتشجيع تعزيز الصحة بتقديم المعلومات والإحالة.", ref: "slide 7" },
    { q: "What is the nurse's role in preventing illness? Give examples.", a: "Educational programs (prenatal care for pregnant women, smoking-cessation, stress-reduction seminars); community programs and resources that encourage healthy life styles (physical fitness); using multimedia to improve health habits; health assessments in institutions, clinics and community settings that identify strengths and risks for illness.", qar: "ما دور الممرض في الوقاية من المرض؟ اذكر أمثلة.", aar: "برامج تعليمية (رعاية ما قبل الولادة للحوامل، الإقلاع عن التدخين، ندوات تقليل الضغط النفسي)؛ وبرامج مجتمعية تشجع أنماط الحياة الصحية (كاللياقة البدنية)؛ واستخدام الوسائط المتعددة لتحسين العادات الصحية؛ وإجراء تقييمات صحية في المؤسسات والعيادات والمجتمع لتحديد نقاط القوة ومخاطر المرض.", ref: "slide 8" },
    { q: "What is the nurse's role in restoring health?", a: "Performing diagnostic measurements and assessments (blood pressure, blood sugars); providing direct care (physical care, giving medications, procedures and treatments); collaborating with other health care providers; planning, teaching and carrying out rehabilitation (heart attacks, arthritis, strokes); working in mental health and chemical dependency programs.", qar: "ما دور الممرض في استعادة الصحة؟", aar: "إجراء القياسات والتقييمات التشخيصية (ضغط الدم، سكر الدم)؛ وتقديم الرعاية المباشرة (الرعاية الجسدية، إعطاء الأدوية، الإجراءات والعلاجات)؛ والتعاون مع مقدمي الرعاية الآخرين؛ والتخطيط والتعليم وتنفيذ إعادة التأهيل (النوبات القلبية، التهاب المفاصل، السكتات الدماغية)؛ والعمل في برامج الصحة النفسية والإدمان.", ref: "slide 9" },
    { q: "How do nurses facilitate coping with disability and death?", a: "They help the patient and family cope with altered function, life crisis and death, by maximizing the person's strengths, through teaching, and through referral to community support systems.", qar: "كيف يُيسّر الممرضون التكيّف مع الإعاقة والموت؟", aar: "يساعدون المريض وأسرته على التكيّف مع تغيّر الوظيفة والأزمات الحياتية والموت، من خلال تعظيم نقاط قوة الشخص، والتعليم، والإحالة إلى أنظمة الدعم المجتمعي.", ref: "slide 10" },
    { q: "List the six nursing responsibilities.", a: "Caregiver, decision maker, client advocate, manager and coordinator, communicator, educator.", qar: "اذكر المسؤوليات الست للممرض.", aar: "مقدم رعاية، وصانع قرار، ومناصر للعميل، ومدير ومنسق، ومتواصل، ومعلّم.", ref: "slide 11" },
    { q: "Describe the caregiver role of the nurse.", a: "It is the primary role of the nurse: providing care that combines the art and science of nursing to meet physical, emotional, intellectual, sociocultural and spiritual needs; the nurse integrates the roles of communicator, teacher, counselor, leader, researcher and advocate.", qar: "صف دور الممرض كمقدم رعاية.", aar: "هو الدور الأساسي للممرض: تقديم رعاية تجمع بين فن التمريض وعلمه لتلبية الاحتياجات الجسدية والعاطفية والفكرية والاجتماعية والثقافية والروحية؛ ويدمج الممرض فيه أدوار المتواصل والمعلم والمستشار والقائد والباحث والمناصر.", ref: "slide 13" },
    { q: "What does the communicator role involve?", a: "Using effective interpersonal and therapeutic communication skills to establish and maintain helping relationships with patients of all ages in a wide variety of healthcare settings.", qar: "ماذا يتضمن دور المتواصل؟", aar: "استخدام مهارات التواصل الفعّال والعلاجي لإقامة علاقات مساعدة والحفاظ عليها مع المرضى من جميع الأعمار في مختلف أماكن الرعاية الصحية.", ref: "slide 14" },
    { q: "What does the teacher/educator role involve?", a: "Using communication skills to assess, implement and evaluate individualized teaching plans to meet the learning needs of patients and their families.", qar: "ماذا يتضمن دور المعلّم/المثقف؟", aar: "استخدام مهارات التواصل لتقييم وتنفيذ وتقويم خطط تعليمية مُفصَّلة حسب احتياجات المرضى وأسرهم التعليمية.", ref: "slide 15" },
    { q: "What does the counselor role involve?", a: "Using therapeutic interpersonal communication skills to provide information, make appropriate referrals, and facilitate the patient's problem-solving and decision-making skills.", qar: "ماذا يتضمن دور المستشار؟", aar: "استخدام مهارات التواصل العلاجي لتقديم المعلومات، وعمل الإحالات المناسبة، وتيسير مهارات حل المشكلات واتخاذ القرار لدى المريض.", ref: "slide 16" },
    { q: "What does the leader role involve?", a: "The assertive, self-confident practice of nursing when providing care, effecting change, and functioning with groups.", qar: "ماذا يتضمن دور القائد؟", aar: "ممارسة التمريض بحزم وثقة بالنفس عند تقديم الرعاية وإحداث التغيير والعمل مع المجموعات.", ref: "slide 17" },
    { q: "What does the researcher role involve?", a: "Participation in or conduct of research to increase knowledge in nursing and improve patient care.", qar: "ماذا يتضمن دور الباحث؟", aar: "المشاركة في البحث أو إجراؤه لزيادة المعرفة التمريضية وتحسين رعاية المرضى.", ref: "slide 18" },
    { q: "What does the advocate role involve?", a: "Protecting human or legal rights and securing care for all patients, based on the belief that patients have the right to make informed decisions about their own health and lives.", qar: "ماذا يتضمن دور المناصر؟", aar: "حماية الحقوق الإنسانية والقانونية وضمان الرعاية لجميع المرضى، انطلاقًا من أن للمريض الحق في اتخاذ قرارات واعية بشأن صحته وحياته.", ref: "slide 19" },
    { q: "List the criteria that make nursing a profession.", a: "Well-defined body of specific and unique knowledge; strong service orientation; recognized authority by a professional group; code of ethics; a professional organization that sets standards; ongoing research; autonomy.", qar: "اذكر المعايير التي تجعل التمريض مهنة.", aar: "مجموعة معرفية محددة وفريدة؛ وتوجه قوي نحو الخدمة؛ وسلطة معترف بها من جماعة مهنية؛ وميثاق أخلاقيات؛ ومنظمة مهنية تضع المعايير؛ وبحث مستمر؛ واستقلالية.", ref: "slide 20" },
    { q: "What are the educational paths into nursing practice?", a: "A practical nursing program to become a licensed practical nurse (LPN), or a diploma, associate degree, or baccalaureate program to be licensed as a registered nurse (RN).", qar: "ما المسارات التعليمية لممارسة التمريض؟", aar: "برنامج التمريض العملي للحصول على رخصة ممرض عملي (LPN)، أو برنامج الدبلوم أو الدرجة المساعدة أو البكالوريوس للحصول على رخصة ممرض مسجل (RN).", ref: "slide 21" },
    { q: "Describe practical (vocational) nursing education.", a: "Programs that teach bedside nursing care; usually 1 year, divided into one-third classroom hours and two-thirds clinical laboratory hours; graduates take the NCLEX-PN exam for licensure as an LPN.", qar: "صف تعليم التمريض العملي (المهني).", aar: "برامج تُعلّم الرعاية التمريضية بجانب سرير المريض؛ مدتها سنة غالبًا، ثلثها ساعات نظرية وثلثاها ساعات معملية إكلينيكية؛ ويتقدم الخريجون لاختبار NCLEX-PN للحصول على رخصة ممرض عملي.", ref: "slide 22" },
    { q: "What are the three primary educational programs leading to RN licensure?", a: "Diploma, associate degree, and baccalaureate programs.", qar: "ما البرامج التعليمية الثلاثة الأساسية المؤهلة لرخصة الممرض المسجل (RN)؟", aar: "الدبلوم، والدرجة المساعدة، وبرامج البكالوريوس.", ref: "slide 23" },
    { q: "Describe the diploma program (location, length, course work).", a: "Hospital-based; 24 to 36 months; course work in biologic and physical sciences, nursing theory and nursing practice.", qar: "صف برنامج الدبلوم (المكان والمدة والمقررات).", aar: "مقره المستشفى؛ مدته 24 إلى 36 شهرًا؛ ويدرس العلوم البيولوجية والفيزيائية ونظريات التمريض وممارسته.", ref: "slide 24" },
    { q: "What are the two levels of graduate education in nursing and what do they prepare?", a: "Master's degree: prepares advanced practice nurses (educational settings, managerial roles, clinical specialists, nurse midwives, nurse practitioners). Doctoral degree: prepares nurses for academic advancement and research to advance nursing theory and practice.", qar: "ما مستويا الدراسات العليا في التمريض وما الذي يعدّان له؟", aar: "الماجستير: يُعد ممرضي الممارسة المتقدمة (التعليم، الإدارة، الأخصائيين الإكلينيكيين، ممرضي التوليد، ممارسي التمريض). والدكتوراه: تُعد للترقي الأكاديمي ولإجراء البحوث لتطوير نظرية التمريض وممارسته.", ref: "slide 27" },
    { q: "Define continuing education in nursing.", a: "Professional development experiences designed to enrich the nurse's contribution to health; offered by colleges, hospitals, voluntary agencies and private groups through courses, seminars and workshops.", qar: "عرّف التعليم المستمر في التمريض.", aar: "خبرات تطوير مهني تهدف إلى إثراء إسهام الممرض في الصحة؛ تقدمها الكليات والمستشفيات والوكالات التطوعية والجماعات الخاصة عبر مقررات وندوات وورش عمل.", ref: "slide 28" },
    { q: "Define in-service education.", a: "Education and training provided by hospitals and healthcare agencies for their own employees, designed to increase the knowledge and skills of the nursing staff, such as a specific nursing skill or how to use new equipment.", qar: "عرّف التعليم أثناء الخدمة.", aar: "تعليم وتدريب تقدمه المستشفيات ووكالات الرعاية الصحية لموظفيها لزيادة معرفة ومهارات الطاقم التمريضي، مثل تعلم مهارة تمريضية محددة أو استخدام جهاز جديد.", ref: "slide 29" },
    { q: "What is a clinical nurse specialist?", a: "A nurse with an advanced degree, education or experience who is an expert in a specialized area (oncology, quality assurance, nursing process, infection control); carries out direct patient care, consultation, teaching of patients, families and staff, and research.", qar: "من هو الأخصائي الإكلينيكي للتمريض؟", aar: "ممرض حاصل على درجة متقدمة أو تعليم أو خبرة، ويُعد خبيرًا في مجال متخصص (الأورام، ضمان الجودة، العملية التمريضية، مكافحة العدوى)؛ يقدم رعاية مباشرة واستشارات وتعليمًا للمرضى والأسر والطاقم ويجري البحوث.", ref: "slide 30" },
    { q: "What is a nurse practitioner?", a: "A nurse with an advanced degree, certified for a special area or age of patient care; works in a variety of healthcare settings or in independent practice to make health assessments and deliver primary care.", qar: "من هو ممارس التمريض؟", aar: "ممرض حاصل على درجة متقدمة ومعتمد في مجال أو فئة عمرية معينة؛ يعمل في أماكن رعاية صحية متنوعة أو في ممارسة مستقلة لإجراء التقييمات الصحية وتقديم الرعاية الأولية.", ref: "slide 31" },
    { q: "What is a nurse anesthetist?", a: "A nurse who completes a course of study in an anesthesia school; carries out preoperative visits and assessments, administers and monitors anesthesia during surgery, and evaluates the postoperative status of patients.", qar: "من هو ممرض التخدير؟", aar: "ممرض أتم دراسة في مدرسة تخدير؛ يجري الزيارات والتقييمات قبل العمليات، ويعطي التخدير ويراقبه أثناء الجراحة، ويقيّم حالة المرضى بعد العملية.", ref: "slide 32" },
    { q: "What is a nurse midwife?", a: "A nurse who completes a program in midwifery; provides prenatal and postnatal care and delivers babies for women with uncomplicated pregnancies.", qar: "من هي ممرضة التوليد (القابلة)؟", aar: "ممرضة أتمت برنامجًا في التوليد؛ تقدم رعاية ما قبل الولادة وبعدها، وتولّد النساء ذوات الحمل غير المعقد.", ref: "slide 33" },
    { q: "What is a nurse educator?", a: "A nurse with an advanced degree who teaches in educational or clinical settings, teaches theoretical knowledge and clinical skills, and conducts research.", qar: "من هو المعلّم التمريضي؟", aar: "ممرض حاصل على درجة متقدمة يدرّس في الأماكن التعليمية أو الإكلينيكية، ويُعلّم المعرفة النظرية والمهارات الإكلينيكية، ويجري البحوث.", ref: "slide 34" },
    { q: "What is a nurse administrator?", a: "A nurse who functions at various levels of management in healthcare settings; responsible for the management and administration of resources and personnel involved in giving patient care.", qar: "من هو المدير التمريضي؟", aar: "ممرض يعمل في مستويات إدارية مختلفة في أماكن الرعاية الصحية؛ مسؤول عن إدارة الموارد والعاملين المشاركين في تقديم رعاية المرضى.", ref: "slide 35" },
    { q: "What is a nurse researcher?", a: "A nurse with an advanced degree who conducts research relevant to the definition and improvement of nursing practice and education.", qar: "من هو الباحث التمريضي؟", aar: "ممرض حاصل على درجة متقدمة يجري بحوثًا تتعلق بتعريف وتحسين ممارسة التمريض وتعليمه.", ref: "slide 36" },
    { q: "What is a nurse entrepreneur?", a: "A nurse, usually with an advanced degree, who may manage a clinic or health-related business, conduct research, provide education, or serve as an adviser or consultant to institutions, political agencies or businesses.", qar: "من هو الممرض رائد الأعمال؟", aar: "ممرض غالبًا حاصل على درجة متقدمة، قد يدير عيادة أو مشروعًا صحيًا، أو يجري بحوثًا، أو يقدم التعليم، أو يعمل مستشارًا لمؤسسات أو هيئات أو شركات.", ref: "slide 37" },
    { q: "What are the benefits of belonging to a professional nursing organization?", a: "It sets standards for practice and education; benefits include networking with colleagues, having a voice in legislation affecting nursing, and keeping current with trends and issues in nursing.", qar: "ما فوائد الانتماء إلى منظمة تمريض مهنية؟", aar: "تضع معايير للممارسة والتعليم؛ ومن فوائدها التواصل مع الزملاء، والتأثير في التشريعات المتعلقة بالتمريض، والاطلاع الدائم على اتجاهات وقضايا المهنة.", ref: "slide 38" },
    { q: "Through what three mechanisms does nursing control and guarantee its practice?", a: "Standards of practice; nurse practice acts and licensure; and the use of the nursing process.", qar: "بأي آليات ثلاث يضبط التمريض ممارسته ويضمن جودتها؟", aar: "معايير الممارسة؛ وقوانين ممارسة التمريض والترخيص؛ واستخدام العملية التمريضية.", ref: "slide 39" },
    { q: "List the six Standards of Practice with a word on each.", a: "Assessment (collect comprehensive data), Diagnosis (analyze data to determine diagnoses/issues), Outcomes Identification (identify expected outcomes individualized to the patient), Planning (develop a plan of strategies and alternatives), Implementation (carry out the plan, coordinate care, promote health and a safe environment), Evaluation (evaluate progress toward outcomes).", qar: "اذكر معايير الممارسة الستة مع لمحة عن كل منها.", aar: "التقييم (جمع بيانات شاملة)، والتشخيص (تحليل البيانات لتحديد التشخيصات)، وتحديد النتائج (تحديد النتائج المتوقعة المُفصَّلة للمريض)، والتخطيط (وضع خطة باستراتيجيات وبدائل)، والتنفيذ (تنفيذ الخطة وتنسيق الرعاية وتعزيز الصحة والبيئة الآمنة)، والتقويم (تقييم التقدم نحو تحقيق النتائج).", ref: "slide 40" },
    { q: "List the nine Standards of Professional Performance.", a: "Quality of practice, practice evaluation, education, collegiality, collaboration, ethics, research, resource utilization, leadership.", qar: "اذكر معايير الأداء المهني التسعة.", aar: "جودة الممارسة، وتقييم الممارسة، والتعليم، والزمالة، والتعاون، والأخلاقيات، والبحث، واستغلال الموارد، والقيادة.", ref: "slide 41" },
    { q: "Why is the nursing process a major guideline for nursing practice?", a: "It is used to identify the patient's health care needs and strengths, establish and carry out a plan of care, and evaluate the plan's effectiveness; it lets nurses use critical thinking to give individualized, holistic care and define the areas of care within the domain of nursing.", qar: "لماذا تُعد العملية التمريضية إطارًا رئيسيًا لممارسة التمريض؟", aar: "لأنها تُستخدم لتحديد احتياجات المريض الصحية ونقاط قوته، ووضع خطة رعاية وتنفيذها، وتقييم فعاليتها؛ وهي تتيح للممرض استخدام التفكير الناقد لتقديم رعاية فردية شاملة وتحديد مجالات الرعاية الخاصة بالتمريض.", ref: "slide 42" },
    { q: "What causes the current nursing shortage?", a: "Increasing age and chronic illnesses and disabilities that require skilled nursing care.", qar: "ما سبب النقص الحالي في أعداد الممرضين؟", aar: "زيادة أعداد كبار السن والأمراض المزمنة والإعاقات التي تتطلب رعاية تمريضية ماهرة.", ref: "slide 43" },
    { q: "What is independent nursing practice?", a: "Advanced practice nurses, such as nurse practitioners and nurse-midwives, increasingly establish independent practices in which they diagnose and treat illnesses, promote health, provide well-women care and deliver babies.", qar: "ما المقصود بالممارسة التمريضية المستقلة؟", aar: "يمارسها ممرضو الممارسة المتقدمة مثل ممارسي التمريض وممرضي التوليد، حيث ينشئون عيادات مستقلة يشخّصون فيها الأمراض ويعالجونها ويعززون الصحة ويقدمون رعاية صحة المرأة ويولّدون الأطفال.", ref: "slide 44" }
  ]
