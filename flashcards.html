LECTURES.push({
  id: "hygiene",
  en: "Hygiene and Self-Care",
  ar: "النظافة والعناية الذاتية",
  cards: [
    { q: "Define self-care.", a: "A person's ability to perform primary care functions in four areas: bathing, feeding, toileting, and dressing, without the help of others.", qar: "عرّف العناية الذاتية.", aar: "قدرة الشخص على أداء وظائف الرعاية الأساسية في أربعة مجالات: الاستحمام، والأكل، وقضاء الحاجة، وارتداء الملابس، دون مساعدة الآخرين.", ref: "slide 3" },
    { q: "Define hygiene.", a: "The observance of health rules relating to self-care activities.", qar: "عرّف النظافة.", aar: "الالتزام بالقواعد الصحية المتعلقة بأنشطة العناية الذاتية.", ref: "slide 3" },
    { q: "Why does the ability to perform self-care and hygiene independently matter?", a: "It enhances a person's health status and emotional well-being.", qar: "لماذا تهم القدرة على أداء العناية الذاتية والنظافة باستقلالية؟", aar: "لأنها تحسّن الحالة الصحية للشخص وعافيته النفسية.", ref: "slide 3" },
    { q: "Describe the epidermis.", a: "The thin, avascular outer layer of the skin; receives nutrients from the underlying dermis; continuously renews itself; contains keratinocytes for skin strength and melanocytes for color and UV protection; acts as a protective barrier from infection.", qar: "صف البشرة (epidermis).", aar: "الطبقة الخارجية الرقيقة غير المُوعّاة (بلا أوعية دموية) من الجلد؛ تتلقى غذاءها من الأدمة تحتها؛ وتتجدد باستمرار؛ وتحتوي على الخلايا الكيراتينية لقوة الجلد والخلايا الميلانية للون والحماية من الأشعة فوق البنفسجية؛ وتعمل كحاجز واقٍ من العدوى.", ref: "slide 5" },
    { q: "Describe the dermis.", a: "Thicker than the epidermis; contains connective tissue, collagen and elastic fibers providing strength and elasticity; houses blood vessels, nerves, hair follicles, sweat glands and sebaceous glands; responsible for sensation (touch, pain, temperature, pressure); plays a role in thermoregulation through blood vessel dilation and constriction.", qar: "صف الأدمة (dermis).", aar: "أثخن من البشرة؛ تحتوي على نسيج ضام وكولاجين وألياف مرنة تمنح القوة والمرونة؛ وتضم الأوعية الدموية والأعصاب وبصيلات الشعر والغدد العرقية والغدد الدهنية؛ ومسؤولة عن الإحساس (اللمس والألم والحرارة والضغط)؛ وتلعب دورًا في تنظيم الحرارة عبر توسع الأوعية الدموية وانقباضها.", ref: "slide 6" },
    { q: "Describe the subcutaneous tissue (hypodermis).", a: "The deepest layer, made of fat and connective tissue; provides insulation and cushioning and anchors the skin to underlying muscles and bones; acts as an energy reserve and protects internal organs from mechanical injury.", qar: "صف النسيج تحت الجلد (hypodermis).", aar: "أعمق طبقة، مكونة من الدهون والنسيج الضام؛ توفر العزل والتوسيد وتثبت الجلد على العضلات والعظام تحته؛ وتعمل كمخزن للطاقة وتحمي الأعضاء الداخلية من الإصابة الميكانيكية.", ref: "slide 8" },
    { q: "Explain the protection function of the skin.", a: "It acts as a barrier against pathogens, chemicals and physical injury, and prevents water loss and dehydration.", qar: "اشرح وظيفة الحماية للجلد.", aar: "يعمل كحاجز ضد الممراض والمواد الكيميائية والإصابة الجسدية، ويمنع فقدان الماء والجفاف.", ref: "slide 10" },
    { q: "Explain the temperature regulation function of the skin.", a: "Sweat glands help cool the body through evaporation; dermal blood vessels adjust heat loss by dilating or constricting.", qar: "اشرح وظيفة تنظيم درجة الحرارة للجلد.", aar: "تساعد الغدد العرقية على تبريد الجسم بالتبخر؛ وتضبط الأوعية الدموية في الأدمة فقدان الحرارة بالتوسع أو الانقباض.", ref: "slide 10" },
    { q: "Explain the sensation function of the skin.", a: "Nerve endings detect touch, pressure, pain, heat and cold, helping the body respond to environmental changes.", qar: "اشرح وظيفة الإحساس للجلد.", aar: "تلتقط النهايات العصبية اللمس والضغط والألم والحرارة والبرودة، مما يساعد الجسم على الاستجابة للتغيرات البيئية.", ref: "slide 11" },
    { q: "Explain the secretion and excretion function of the skin.", a: "Sweat glands remove water and waste products; sebaceous glands produce oil (sebum) to lubricate and protect the skin and hair.", qar: "اشرح وظيفة الإفراز والإخراج للجلد.", aar: "تُخرج الغدد العرقية الماء والفضلات؛ وتنتج الغدد الدهنية الزهم (الدهن) لترطيب وحماية الجلد والشعر.", ref: "slide 11" },
    { q: "Explain the metabolic function of the skin.", a: "The skin contributes to vitamin D synthesis when exposed to sunlight.", qar: "اشرح الوظيفة الأيضية للجلد.", aar: "يساهم الجلد في تصنيع فيتامين د عند التعرض لأشعة الشمس.", ref: "slide 11" },
    { q: "Define personal hygiene.", a: "Practices that keep the body clean and healthy and prevent the spread of disease; the routines and activities a person performs to maintain cleanliness of the body, hair, nails, teeth and overall appearance, which are essential for physical health, comfort and social acceptance.", qar: "عرّف النظافة الشخصية.", aar: "ممارسات تحافظ على نظافة الجسم وصحته وتمنع انتشار المرض؛ وهي الأنظمة والأنشطة التي يؤديها الشخص للحفاظ على نظافة الجسم والشعر والأظافر والأسنان والمظهر العام، وهي ضرورية للصحة الجسدية والراحة والقبول الاجتماعي.", ref: "slide 12" },
    { q: "Why is bathing important in self-care?", a: "The skin is the first line of defense against microorganisms entering the body; perspiration interacts with bacteria on the skin to cause body odor, which decreases patient comfort, promotes bacterial growth and increases skin breakdown. Bathing increases circulation, helps maintain muscle tone and joint mobility, and promotes relaxation and comfort.", qar: "لماذا يُعد الاستحمام مهمًا في العناية الذاتية؟", aar: "الجلد هو خط الدفاع الأول ضد دخول الكائنات الدقيقة للجسم؛ ويتفاعل العرق مع بكتيريا الجلد مسببًا رائحة الجسم التي تقلل راحة المريض وتعزز نمو البكتيريا وتزيد تكسر الجلد. والاستحمام يزيد الدورة الدموية ويساعد على الحفاظ على قوة العضلات وحركة المفاصل ويعزز الاسترخاء والراحة.", ref: "slide 13" },
    { q: "Summarize feet and nail care.", a: "Healthy feet help people stand and walk; most people wash the feet with the body when showering; nails are trimmed as needed; the foot has many bones, ligaments and muscles, and comfortable shoes are essential to healthy feet.", qar: "لخص العناية بالقدمين والأظافر.", aar: "القدمان السليمتان تساعدان على الوقوف والمشي؛ ومعظم الناس يغسلون أقدامهم مع الجسم أثناء الاستحمام؛ وتُقلَّم الأظافر عند الحاجة؛ والقدم بها عظام وأربطة وعضلات كثيرة، والحذاء المريح ضروري لصحة القدمين.", ref: "slide 14" },
    { q: "Summarize hair care.", a: "Shampooing removes dirt and oil from hair and scalp and increases scalp circulation, and for most people it is relaxing. Clean hair makes patients feel good about their appearance and enhances self-worth; daily brushing and combing maintain healthy hair by massaging the scalp.", qar: "لخص العناية بالشعر.", aar: "غسل الشعر بالشامبو يزيل الأوساخ والزيوت من الشعر وفروة الرأس ويزيد دورتها الدموية، وهو مريح لمعظم الناس. والشعر النظيف يجعل المرضى يشعرون بتحسن تجاه مظهرهم ويعزز تقدير الذات؛ والتمشيط اليومي يحافظ على صحة الشعر بتدليك فروة الرأس.", ref: "slide 15" },
    { q: "Summarize oral care and the cause of cavities.", a: "Proper care of teeth and gums helps prevent gum deterioration and tooth loss. Cavities in enamel are caused by deposits of plaque, a substance primarily composed of bacteria and saliva that forms on teeth; bacterial enzymes combine with carbohydrates from food and break down enamel.", qar: "لخص العناية بالفم وسبب التسوس.", aar: "العناية الصحيحة بالأسنان واللثة تساعد على منع تدهور اللثة وفقدان الأسنان. وينتج التسوس عن ترسبات البلاك (الجير)، وهي مادة تتكون أساسًا من البكتيريا واللعاب على الأسنان؛ وتتحد إنزيمات البكتيريا مع الكربوهيدرات من الطعام وتحلل المينا.", ref: "slide 16" },
    { q: "Summarize eye care.", a: "Special care may be needed for patients who wear glasses or contact lenses, those who have other visual problems, or those who use eye medications.", qar: "لخص العناية بالعينين.", aar: "قد يحتاج عناية خاصة المرضى الذين يرتدون النظارات أو العدسات اللاصقة، أو من لديهم مشكلات بصرية أخرى، أو من يستخدمون أدوية للعين.", ref: "slide 17" },
    { q: "Summarize ear care.", a: "Ears need little attention; patients wearing hearing aids may need special care; excess accumulation of earwax requires careful removal; cotton applicators should NOT be used.", qar: "لخص العناية بالأذنين.", aar: "الأذنان تحتاجان عناية قليلة؛ وقد يحتاج مستخدمو السماعات الطبية عناية خاصة؛ والتراكم الزائد لشمع الأذن يتطلب إزالة حذرة؛ ولا يجب استخدام أعواد القطن.", ref: "slide 17" },
    { q: "How are the nostrils cleaned?", a: "By gentle blowing with both nostrils open.", qar: "كيف تُنظَّف فتحات الأنف؟", aar: "بالنفخ بلطف مع فتح فتحتي الأنف معًا.", ref: "slide 17" },
    { q: "What do dressing and grooming include?", a: "Dressing includes being able to get clothes from drawers, put them on, manage fasteners such as buttons, and put on socks and shoes. Routine grooming includes the daily brushing and combing of hair.", qar: "ماذا يشمل ارتداء الملابس والهندام؟", aar: "يشمل ارتداء الملابس القدرة على إخراج الملابس من الأدراج ولبسها والتعامل مع المثبتات كالأزرار وارتداء الجوارب والأحذية. ويشمل الهندام الروتيني تمشيط الشعر يوميًا.", ref: "slide 18" },
    { q: "How does environment affect self-care?", a: "Lack of access to facilities or proper resources for self-care (poverty or poor living conditions) may affect a person's ability for adequate self-care; homeless people, migrant workers and the rural poor may not have access to adequate bathroom facilities or running water, affecting their ability to bathe and wash clothes.", qar: "كيف تؤثر البيئة في العناية الذاتية؟", aar: "نقص الوصول إلى المرافق أو الموارد المناسبة للعناية الذاتية (الفقر أو ظروف المعيشة السيئة) قد يؤثر في قدرة الشخص على العناية الذاتية الكافية؛ فالمشردون والعمال المهاجرون وفقراء الريف قد لا تتوفر لهم حمامات مناسبة أو ماء جارٍ، مما يؤثر في قدرتهم على الاستحمام وغسل الملابس.", ref: "slide 19" },
    { q: "How does motivation affect self-care?", a: "Motivation can be a powerful factor in achieving independence in self-care; even a physically capable person must be motivated and must believe that self-care is important. People with a positive self-image, who perceive themselves as worthy of attention and care, have greater motivation to attend to self-care.", qar: "كيف تؤثر الدافعية في العناية الذاتية؟", aar: "الدافعية عامل قوي لتحقيق الاستقلالية في العناية الذاتية؛ فحتى الشخص القادر جسديًا يجب أن يكون لديه الدافع وأن يؤمن بأهمية العناية الذاتية. والأشخاص ذوو الصورة الذاتية الإيجابية الذين يرون أنفسهم مستحقين للاهتمام والرعاية لديهم دافعية أكبر.", ref: "slide 20" },
    { q: "How does mental health affect self-care?", a: "Mental health issues can result in self-care deficits. The inability to perceive reality because of psychosis or schizophrenia may cause inattentiveness to personal care, and it can be challenging for these patients to concentrate on basic needs such as eating, grooming and toileting.", qar: "كيف تؤثر الصحة النفسية في العناية الذاتية؟", aar: "قد تؤدي مشكلات الصحة النفسية إلى عجز في العناية الذاتية. فعدم القدرة على إدراك الواقع بسبب الذهان أو الفصام قد يسبب إهمال العناية الشخصية، ويصعب على هؤلاء المرضى التركيز في الاحتياجات الأساسية كالأكل والهندام وقضاء الحاجة.", ref: "slide 21" },
    { q: "How do cognitive abilities affect self-care?", a: "People with unimpaired cognitive and perceptive abilities are usually motivated to perform self-care; those with altered cognitive abilities may be unaware of self-care and unable to assess what they can perform safely and independently.", qar: "كيف تؤثر القدرات المعرفية في العناية الذاتية؟", aar: "الأشخاص ذوو القدرات المعرفية والإدراكية السليمة يكونون عادة متحفزين لأداء العناية الذاتية؛ أما من لديهم قدرات معرفية متغيرة فقد لا يدركون العناية الذاتية ولا يستطيعون تقييم ما يمكنهم أداؤه بأمان واستقلالية.", ref: "slide 22" },
    { q: "How does energy affect self-care?", a: "Energy must be available at the cellular level for muscle movement. Compromised respiratory or cardiac function reduces the body's ability to provide sufficient oxygen to cells, limiting the patient's ability to participate in self-care without fatigue. Decreased energy and weakness can also result from disrupted diet, infection, fluid and electrolyte imbalance, or a response to a medication.", qar: "كيف تؤثر الطاقة في العناية الذاتية؟", aar: "يجب أن تتوفر الطاقة على مستوى الخلية لحركة العضلات. فالوظيفة التنفسية أو القلبية المتأثرة تقلل قدرة الجسم على توصيل الأكسجين الكافي للخلايا، مما يحد من قدرة المريض على المشاركة في العناية الذاتية دون إجهاد. وقد ينتج نقص الطاقة والضعف أيضًا عن اضطراب الغذاء أو العدوى أو اختلال السوائل والأملاح أو استجابة لدواء.", ref: "slide 23" },
    { q: "How do acute illness and surgery affect self-care?", a: "People who have been acutely ill or have undergone surgery often need assistance with self-care; the amount of help needed varies depending on the course of the illness or surgery and the patient's general health.", qar: "كيف تؤثر الأمراض الحادة والجراحة في العناية الذاتية؟", aar: "من أصيبوا بمرض حاد أو أجروا جراحة يحتاجون غالبًا إلى مساعدة في العناية الذاتية؛ وتختلف كمية المساعدة حسب مسار المرض أو الجراحة وصحة المريض العامة.", ref: "slide 24" },
    { q: "How does pain affect self-care, and what is the trade-off of giving analgesics before self-care?", a: "Pain may significantly curtail the ability or willingness to move. Reducing pain with analgesics before self-care may increase patient participation, but these medications also cause drowsiness and lightheadedness, placing the patient at risk for falls.", qar: "كيف يؤثر الألم في العناية الذاتية، وما مفاضلة إعطاء المسكنات قبلها؟", aar: "قد يحد الألم كثيرًا من قدرة المريض أو رغبته في الحركة. وتقليل الألم بالمسكنات قبل العناية الذاتية قد يزيد مشاركة المريض، لكن هذه الأدوية تسبب أيضًا النعاس والدوار مما يعرض المريض لخطر السقوط.", ref: "slide 25" },
    { q: "How does developmental level affect self-care?", a: "Parents and caregivers perform hygiene care for infants and young children; older children learn practices that become habits, such as brushing teeth; as they begin to perform their own hygiene independently, they are influenced by media and social norms.", qar: "كيف يؤثر مستوى النمو في العناية الذاتية؟", aar: "يؤدي الوالدان ومقدمو الرعاية النظافة للرضع وصغار الأطفال؛ ويتعلم الأطفال الأكبر ممارسات تصبح عادات كغسل الأسنان؛ وعندما يبدأون أداء نظافتهم باستقلالية يتأثرون بالإعلام والأعراف الاجتماعية.", ref: "slide 26" },
    { q: "How does neuromuscular function affect self-care?", a: "Self-care activities such as eating, getting to the toilet and dressing require a well-functioning neuromuscular system; the central nervous system sends messages to the peripheral nervous system and muscle fibers to coordinate the necessary fine and gross motor activities.", qar: "كيف تؤثر الوظيفة العصبية العضلية في العناية الذاتية؟", aar: "أنشطة العناية الذاتية كالأكل والذهاب للحمام وارتداء الملابس تتطلب جهازًا عصبيًا عضليًا سليمًا؛ حيث يرسل الجهاز العصبي المركزي رسائل إلى الجهاز العصبي الطرفي وألياف العضلات لتنسيق الحركات الدقيقة والكبيرة اللازمة.", ref: "slide 27" },
    { q: "List the manifestations of poor hygiene and grooming (altered self-care).", a: "Skin may be soiled, dry or flaky, or have rashes and excoriated areas; hair may be oily, unwashed and uncombed; nails may be dirty and broken; clothes may be soiled, torn or inappropriate for the weather or setting; there may be offensive body odor; the smell of urine or feces on soiled clothing may indicate difficulty in toileting.", qar: "اذكر مظاهر سوء النظافة والهندام (العناية الذاتية المتغيرة).", aar: "قد يكون الجلد متسخًا أو جافًا أو متقشرًا أو به طفح ومناطق مسحوبة الجلد؛ وقد يكون الشعر دهنيًا غير مغسول وغير ممشط؛ والأظافر متسخة ومكسورة؛ والملابس متسخة أو ممزقة أو غير مناسبة للطقس أو المكان؛ وقد توجد رائحة جسم كريهة؛ ورائحة البول أو البراز على الملابس قد تشير إلى صعوبة في قضاء الحاجة.", ref: "slide 28" },
    { q: "What does the inability to demonstrate self-care activities indicate?", a: "Inability to demonstrate the gross motor coordination needed for self-care activities indicates an impaired ability to perform these functions independently; the ability to get to the bathroom, bathe, dress and eat is evidence of gross motor skills.", qar: "على ماذا يدل عدم القدرة على إظهار أنشطة العناية الذاتية؟", aar: "عدم القدرة على إظهار التنسيق الحركي الكبير اللازم لأنشطة العناية الذاتية يدل على قدرة متضررة على أداء هذه الوظائف باستقلالية؛ والقدرة على الذهاب للحمام والاستحمام وارتداء الملابس والأكل دليل على المهارات الحركية الكبيرة.", ref: "slide 29" },
    { q: "Why is verbalization of reluctance to perform self-care an important clue?", a: "If the patient expresses reluctance or fear to perform self-care activities, a deficit is usually present; some patients may be reluctant due to depression and altered cognition.", qar: "لماذا يُعد التعبير اللفظي عن التردد في أداء العناية الذاتية دلالة مهمة؟", aar: "إذا عبّر المريض عن تردد أو خوف من أداء أنشطة العناية الذاتية، فغالبًا يوجد عجز؛ وقد يكون التردد بسبب الاكتئاب وتغير الإدراك.", ref: "slide 30" },
    { q: "How does the nurse assess self-care?", a: "By asking questions, the nurse learns what the patient considers normal self-care activity and determines which areas may be problematic; the questions elicit the patient's feelings about the problem, what he or she sees as the solution, and the level of motivation to alter self-care ability. Family members, if present, may give their perceptions of the patient's self-care abilities.", qar: "كيف يقيّم الممرض العناية الذاتية؟", aar: "بطرح الأسئلة يعرف الممرض ما يعتبره المريض نشاطًا طبيعيًا للعناية الذاتية ويحدد المجالات المشكلة؛ والأسئلة تستكشف مشاعر المريض تجاه المشكلة وما يراه حلًا ومستوى دافعيته لتغيير قدرته. وقد يعطي أفراد الأسرة، إن وُجدوا، انطباعاتهم عن قدرات المريض.", ref: "slide 31" },
    { q: "List the risk factors the nurse identifies when gathering self-care information.", a: "Pain; immobility or limited use of an extremity; neuromuscular impairment; decreased visual acuity or other sensory deficits; inability to control bowel or bladder function; decreased energy levels or fatigue.", qar: "اذكر عوامل الخطر التي يحددها الممرض أثناء جمع معلومات العناية الذاتية.", aar: "الألم؛ وعدم الحركة أو محدودية استخدام أحد الأطراف؛ والضعف العصبي العضلي؛ ونقص حدة البصر أو غيره من العجز الحسي؛ وعدم القدرة على التحكم في وظيفة الأمعاء أو المثانة؛ وانخفاض مستويات الطاقة أو الإرهاق.", ref: "slide 32" },
    { q: "What does the nurse look for in the physical assessment of self-care?", a: "Objectively observe the patient engaged in self-care functions to validate the interview: evidence of an inability to manage self-care (poor grooming, body odor, skin lesions, poor nutrition) and the ability to process sensory input by hearing, sight, smell and touch.", qar: "على ماذا يبحث الممرض في التقييم الجسدي للعناية الذاتية؟", aar: "يلاحظ المريض بموضوعية أثناء أداء أنشطة العناية الذاتية للتحقق من المقابلة: دلائل عدم القدرة على إدارة العناية الذاتية (سوء الهندام، رائحة الجسم، آفات جلدية، سوء التغذية) والقدرة على معالجة المدخلات الحسية بالسمع والبصر والشم واللمس.", ref: "slide 33" },
    { q: "How does frequent repositioning prevent skin breakdown?", a: "Purpose: reduces prolonged pressure on bony prominences. Practice: reposition bed-bound patients every 2 hours; example: turn the patient from back to side to back.", qar: "كيف يمنع تغيير الوضعية المتكرر تكسر الجلد؟", aar: "الهدف: تقليل الضغط المطول على النتوءات العظمية. التطبيق: غيّر وضعية المريض الملازم للسرير كل ساعتين؛ مثال: من الظهر إلى الجنب إلى الظهر.", ref: "slide 34" },
    { q: "How do pressure-relieving devices prevent skin breakdown?", a: "Purpose: distribute pressure and reduce the risk of ulcers. Devices: special mattresses, heel protectors, foam pads; example: an air or gel mattress for a bedridden patient.", qar: "كيف تمنع أجهزة تخفيف الضغط تكسر الجلد؟", aar: "الهدف: توزيع الضغط وتقليل خطر القرح. الأجهزة: مراتب خاصة، وواقيات الكعب، ووسائد إسفنجية؛ مثال: مرتبة هوائية أو جل للمريض الملازم للسرير.", ref: "slide 35" },
    { q: "How do skin care and hygiene prevent skin breakdown?", a: "Purpose: maintain skin integrity, prevent infection and reduce moisture. Practice: keep the skin clean and dry; use mild cleansers and avoid harsh soaps; apply moisturizers to prevent dryness; manage incontinence promptly.", qar: "كيف تمنع العناية بالجلد ونظافته تكسر الجلد؟", aar: "الهدف: الحفاظ على سلامة الجلد ومنع العدوى وتقليل الرطوبة. التطبيق: حافظ على الجلد نظيفًا وجافًا؛ واستخدم منظفات لطيفة وتجنب الصابون القاسي؛ وضع المرطبات لمنع الجفاف؛ وعالج سلس الإخراج فورًا.", ref: "slide 36" },
    { q: "How do mobility and exercise prevent skin breakdown?", a: "Purpose: promote circulation and prevent tissue ischemia. Practice: encourage ambulation if possible; perform passive or active range-of-motion exercises; example: leg and arm exercises for bedridden patients.", qar: "كيف تمنع الحركة والتمارين تكسر الجلد؟", aar: "الهدف: تعزيز الدورة الدموية ومنع نقص تروية الأنسجة. التطبيق: شجع المشي إن أمكن؛ وأجرِ تمارين نطاق الحركة السلبية أو النشطة؛ مثال: تمارين الساقين والذراعين للمرضى الملازمين للسرير.", ref: "slide 37" },
    { q: "How do nutrition and hydration prevent skin breakdown?", a: "Purpose: support skin repair and strength. Practice: ensure adequate protein, vitamins (A, C, E) and minerals; maintain proper fluid intake; example: include high-protein meals, supplements if necessary.", qar: "كيف تمنع التغذية والترطيب تكسر الجلد؟", aar: "الهدف: دعم إصلاح الجلد وقوته. التطبيق: تأكد من كفاية البروتين والفيتامينات (أ، ج، هـ) والمعادن؛ وحافظ على تناول السوائل بشكل صحيح؛ مثال: وجبات غنية بالبروتين ومكملات عند الحاجة.", ref: "slide 38" },
    { q: "How does regular skin assessment prevent skin breakdown?", a: "Purpose: early detection of redness, breakdown or pressure injury. Practice: inspect the skin daily, especially over bony prominences; document findings and report changes; example: note redness over the sacrum or heels in the patient chart.", qar: "كيف يمنع التقييم المنتظم للجلد تكسره؟", aar: "الهدف: الكشف المبكر عن الاحمرار أو التكسر أو إصابة الضغط. التطبيق: افحص الجلد يوميًا خاصة فوق النتوءات العظمية؛ ووثّق الملاحظات وأبلغ عن التغيرات؛ مثال: سجّل الاحمرار فوق العجز أو الكعبين في ملف المريض.", ref: "slide 39" },
    { q: "What is the role of education in preventing skin breakdown?", a: "Purpose: empower patients and caregivers to participate in skin care. Practice: teach repositioning techniques, proper hygiene and nutrition; inform them about the early signs of pressure injuries.", qar: "ما دور التثقيف في منع تكسر الجلد؟", aar: "الهدف: تمكين المرضى ومقدمي الرعاية من المشاركة في العناية بالجلد. التطبيق: علّم تقنيات تغيير الوضعية والنظافة الصحيحة والتغذية؛ وأعلمهم بالعلامات المبكرة لإصابات الضغط.", ref: "slide 40" },
    { q: "List the related nursing diagnoses for altered self-care.", a: "Impaired skin integrity related to inability to provide hygiene and clean oneself after toileting; imbalanced nutrition: less than body requirements, and deficient fluid volume related to inability to feed oneself; impaired oral mucous membrane related to inability to manage mouth care and feed oneself.", qar: "اذكر التشخيصات التمريضية المرتبطة بالعناية الذاتية المتغيرة.", aar: "ضعف سلامة الجلد المرتبط بعدم القدرة على النظافة والتنظيف بعد قضاء الحاجة؛ وسوء التغذية: أقل من احتياجات الجسم، ونقص حجم السوائل المرتبط بعدم القدرة على إطعام النفس؛ وضعف الغشاء المخاطي للفم المرتبط بعدم القدرة على العناية بالفم وإطعام النفس.", ref: "slide 41" }
  ]

LECTURES.push({
  id: "nursing-process",
  en: "Nursing Process",
  ar: "العملية التمريضية",
  cards: [
    { q: "Define the nursing process.", a: "An organized, systematic method that directs the nurse and client as they together (1) determine the need for nursing care, (2) plan and implement the care, and (3) evaluate the results.", qar: "عرّف العملية التمريضية.", aar: "طريقة منظمة ومنهجية توجه الممرض والمريض معًا لكي: 1) يحددا الحاجة إلى الرعاية التمريضية، 2) يخططا للرعاية وينفذاها، 3) يقيّما النتائج.", ref: "p. 2" },
    { q: "List the benefits of using the nursing process.", a: "1) Provides an organized method of giving nursing care. 2) Prevents omissions and unnecessary repetitions. 3) Helps nurses intervene for the individual, not the disease. 4) Helps patients and families realize that their input is important and their strong points are assets. 5) Provides better communication. 6) Gives nurses the satisfaction of getting results.", qar: "اذكر فوائد استخدام العملية التمريضية.", aar: "1) توفر طريقة منظمة لتقديم الرعاية التمريضية. 2) تمنع السهو والتكرار غير الضروري. 3) تساعد الممرض على التدخل للفرد لا للمرض. 4) تساعد المرضى وأسرهم على إدراك أهمية مشاركتهم وأن نقاط قوتهم عون لهم. 5) توفر تواصلًا أفضل. 6) تمنح الممرضين الرضا عن تحقيق النتائج.", ref: "p. 3" },
    { q: "List the five steps of the nursing process.", a: "Assessment, diagnosis (nursing) or analysis, planning, implementation, evaluation.", qar: "اذكر خطوات العملية التمريضية الخمس.", aar: "التقييم، والتشخيص (التمريضي) أو التحليل، والتخطيط، والتنفيذ، والتقويم.", ref: "p. 4" },
    { q: "What is assessment in the nursing process?", a: "The first step of the nursing process, when client information is gathered and examined in preparation for the second step, diagnosis.", qar: "ما التقييم في العملية التمريضية؟", aar: "الخطوة الأولى من العملية التمريضية، حيث تُجمع معلومات المريض وتُفحص تمهيدًا للخطوة الثانية وهي التشخيص.", ref: "p. 6" },
    { q: "List the four physical examination techniques with their meanings.", a: "Inspection: examination by careful and critical observation. Auscultation: examination by listening with a stethoscope. Palpation: examination by touching and feeling. Percussion: examination by touching, tapping and listening.", qar: "اذكر تقنيات الفحص الجسدي الأربع مع معانيها.", aar: "الفحص بالنظر (inspection): الفحص بالملاحظة الدقيقة الناقدة. الاستماع (auscultation): الفحص بالسماع بالسماعة الطبية. الجسّ (palpation): الفحص باللمس والتحسس. القرع (percussion): الفحص باللمس والطرق والاستماع.", ref: "p. 7" },
    { q: "Define subjective data with examples.", a: "Information perceived only by the affected person; these data cannot be perceived or verified by another person. Examples: feeling nervous, nauseated or chilly, and experiencing pain.", qar: "عرّف البيانات الذاتية مع أمثلة.", aar: "معلومات يدركها الشخص المصاب فقط؛ لا يمكن لشخص آخر إدراكها أو التحقق منها. أمثلة: الشعور بالتوتر أو الغثيان أو القشعريرة أو الألم.", ref: "p. 8" },
    { q: "Define objective data.", a: "Observable and measurable data that can be seen (and verified by others).", qar: "عرّف البيانات الموضوعية.", aar: "بيانات يمكن ملاحظتها وقياسها ورؤيتها (والتحقق منها بواسطة الآخرين).", ref: "p. 8" },
    { q: "Define a nursing diagnosis.", a: "An actual or potential health problem that focuses on the human response of an individual or group, and that nurses are responsible and accountable for identifying and treating independently.", qar: "عرّف التشخيص التمريضي.", aar: "مشكلة صحية فعلية أو محتملة تركز على استجابة الإنسان أو الجماعة، ويكون الممرضون مسؤولين عن تحديدها وعلاجها باستقلالية.", ref: "p. 9" },
    { q: "Compare nursing and medical diagnosis: focus of assessment activities.", a: "Nursing diagnosis: main focus is on monitoring human responses to actual and potential health problems. Medical diagnosis: main focus is on monitoring the pathophysiologic response of body organs or systems.", qar: "قارن بين التشخيص التمريضي والطبي: تركيز أنشطة التقييم.", aar: "التشخيص التمريضي: التركيز الأساسي على مراقبة استجابات الإنسان للمشكلات الصحية الفعلية والمحتملة. التشخيص الطبي: التركيز الأساسي على مراقبة الاستجابة الفيزيولوجية المرضية لأعضاء الجسم أو أجهزته.", ref: "p. 10" },
    { q: "Compare nursing and medical diagnosis: problem identification.", a: "Nursing: the nurse identifies and validates that the problem exists independently. Medical side: the nurse may not be qualified to diagnose the exact nature of the problem, but refers abnormal data to the physician.", qar: "قارن بين التشخيص التمريضي والطبي: تحديد المشكلة.", aar: "تمريضيًا: يحدد الممرض وجود المشكلة ويتحقق منها باستقلالية. طبيًا: قد لا يكون الممرض مؤهلًا لتشخيص الطبيعة الدقيقة للمشكلة، لكنه يحيل البيانات غير الطبيعية إلى الطبيب.", ref: "p. 11" },
    { q: "Compare nursing and medical diagnosis: treatment.", a: "The nurse initiates interventions for treatment independently; the nurse may also have standing orders from the physician or institution (delegated authority) to initiate diagnostic studies or treatment interventions for the problem without physician orders.", qar: "قارن بين التشخيص التمريضي والطبي: العلاج.", aar: "يبدأ الممرض التدخلات العلاجية باستقلالية؛ وقد تكون لديه أيضًا أوامر دائمة من الطبيب أو المؤسسة (تفويض سلطة) لبدء دراسات تشخيصية أو تدخلات علاجية للمشكلة دون أوامر الطبيب.", ref: "p. 11" },
    { q: "What is the PES system for writing actual nursing diagnoses?", a: "P: the problem; E: its cause or etiology; S: the signs and symptoms (defining characteristics) that are evident in the patient.", qar: "ما نظام PES لكتابة التشخيصات التمريضية الفعلية؟", aar: "P: المشكلة؛ E: سببها أو العلّة؛ S: العلامات والأعراض (الخصائص المميزة) الظاهرة في المريض.", ref: "pp. 12-13" },
    { q: "State the rule for writing a diagnostic statement for an actual nursing diagnosis.", a: "Link the problem and its etiology using 'related to', then add 'as manifested by' or 'as evidenced by' for the signs and symptoms.", qar: "اذكر قاعدة كتابة عبارة التشخيص للتشخيص التمريضي الفعلي.", aar: "اربط المشكلة بعلّتها باستخدام 'مرتبطة بـ'، ثم أضف 'كما يتجلى بـ' أو 'كما يتضح بـ' للعلامات والأعراض.", ref: "p. 14" },
    { q: "Give the lecture's PES example and break it into its parts.", a: "Ineffective Airway Clearance related to weak cough and incisional pain, as manifested by poor or no cough effort and statements that the incision hurts too much when he coughs. Problem: Ineffective Airway Clearance. Etiology: weak cough and incisional pain. Signs and symptoms: poor or no cough effort and the patient's statements about pain on coughing.", qar: "اذكر مثال المحاضرة على PES وقسّمه إلى أجزائه.", aar: "ضعف خلوص مجرى الهواء مرتبط بضعف السعال وألم الشق الجراحي، كما يتجلى بسعال ضعيف أو معدوم وقول المريض إن الشق يؤلمه كثيرًا عند السعال. المشكلة: ضعف خلوص مجرى الهواء. العلة: ضعف السعال وألم الشق. العلامات والأعراض: ضعف أو غياب السعال وشكوى المريض من الألم عند السعال.", ref: "pp. 15-16" },
    { q: "How is a potential or possible nursing diagnosis statement written?", a: "As a two-part statement: problem + etiology only. Example: Potential Ineffective Airway Clearance related to smoking.", qar: "كيف تُكتب عبارة التشخيص التمريضي المحتمل أو المُحتمَل الوجود؟", aar: "كعبارة من جزأين: المشكلة + العلة فقط. مثال: ضعف خلوص مجرى الهواء المحتمل مرتبط بالتدخين.", ref: "p. 17" },
    { q: "Define actual diagnosis with the lecture's example.", a: "A problem that already exists. Example: Feeding Self-Care Deficit related to right hemiparesis as manifested by inability to grasp utensils.", qar: "عرّف التشخيص الفعلي مع مثال المحاضرة.", aar: "مشكلة موجودة بالفعل. مثال: عجز العناية الذاتية بالأكل مرتبط بشلل نصفي أيمن كما يتجلى بعدم القدرة على الإمساك بأدوات الطعام.", ref: "p. 18" },
    { q: "Define risk diagnosis with the lecture's example.", a: "A problem that the client is at high risk for developing. Example: Risk for Disturbed Sleep Pattern related to changed environment (intensive care unit).", qar: "عرّف تشخيص الخطر مع مثال المحاضرة.", aar: "مشكلة يكون المريض معرضًا بشدة لتطويرها. مثال: خطر اضطراب نمط النوم مرتبط بتغير البيئة (وحدة العناية المركزة).", ref: "p. 19" },
    { q: "Define possible diagnosis with the lecture's example.", a: "A problem that is suspected but more data are needed before making a decision. Example: Possible Parental Role Conflict related to impending divorce.", qar: "عرّف التشخيص المحتمَل الوجود مع مثال المحاضرة.", aar: "مشكلة يُشتبه بها لكن يلزم مزيد من البيانات قبل اتخاذ القرار. مثال: تعارض الدور الوالدي المحتمَل مرتبط بطلاق وشيك.", ref: "p. 20" },
    { q: "Define collaborative problem with the lecture's example.", a: "A problem that is monitored and managed by the nurse using physician-prescribed and nursing-prescribed interventions. Example: Potential Complication (PC): phlebitis.", qar: "عرّف المشكلة التشاركية مع مثال المحاضرة.", aar: "مشكلة يراقبها الممرض ويديرها باستخدام تدخلات موصوفة من الطبيب وأخرى موصوفة من التمريض. مثال: مضاعفة محتملة (PC): التهاب الوريد.", ref: "p. 21" },
    { q: "Define wellness diagnosis with the lecture's example.", a: "No problem exists; the client desires a higher level of wellness. Example: Potential for Enhanced Physical Fitness.", qar: "عرّف تشخيص العافية مع مثال المحاضرة.", aar: "لا توجد مشكلة؛ لكن المريض يرغب في مستوى أعلى من العافية. مثال: قابلية تعزيز اللياقة البدنية.", ref: "p. 22" },
    { q: "What is the medical-terminology error when writing diagnostic statements?", a: "Do not state the nursing diagnosis in medical terminology. Incorrect: 'Mastectomy related to cancer'. Correct: 'Potential Altered Self-concept related to mastectomy'.", qar: "ما خطأ استخدام المصطلحات الطبية عند كتابة عبارات التشخيص؟", aar: "لا تكتب التشخيص التمريضي بمصطلح طبي. خطأ: 'استئصال الثدي مرتبط بالسرطان'. صحيح: 'تغير مفهوم الذات المحتمل مرتبط باستئصال الثدي'.", ref: "p. 23" },
    { q: "What is the two-problems error when writing diagnostic statements?", a: "Do not state two problems at the same time. Incorrect: 'Pain and Fear related to diagnostic procedures'. Correct: two separate statements: 'Pain related to diagnostic procedures' and 'Fear related to unfamiliarity with diagnostic procedures'.", qar: "ما خطأ ذكر مشكلتين معًا في عبارة التشخيص؟", aar: "لا تذكر مشكلتين في العبارة نفسها. خطأ: 'ألم وخوف مرتبطان بالإجراءات التشخيصية'. صحيح: عبارتان منفصلتان: 'ألم مرتبط بالإجراءات التشخيصية' و'خوف مرتبط بعدم الإلمام بالإجراءات التشخيصية'.", ref: "p. 23" },
    { q: "What does the planning step involve?", a: "Setting priorities, defining expected (desired) outcomes (goals), determining specific nursing interventions, and recording the plan of care.", qar: "ماذا تتضمن خطوة التخطيط؟", aar: "ترتيب الأولويات، وتحديد النتائج (الأهداف) المتوقعة، وتحديد التدخلات التمريضية المحددة، وتسجيل خطة الرعاية.", ref: "p. 24" },
    { q: "How does the nurse establish priorities among a client's problems?", a: "By ranking first the diagnoses related to the client's most important, serious or immediate needs, followed by the remainder in descending order of importance.", qar: "كيف يرتب الممرض أولويات مشكلات المريض؟", aar: "بوضع التشخيصات المرتبطة بأهم احتياجات المريض وأخطرها وأكثرها إلحاحًا في المقدمة، ثم تتبعها البقية تنازليًا حسب الأهمية.", ref: "p. 24" },
    { q: "List Maslow's five levels of needs in priority order.", a: "Physiologic needs (first level), safety and security needs (second), love and belonging needs (third), esteem and self-esteem needs (fourth), self-actualization needs (fifth).", qar: "اذكر مستويات ماسلو الخمسة للاحتياجات بترتيب الأولوية.", aar: "الاحتياجات الفسيولوجية (المستوى الأول)، ثم احتياجات الأمن والسلامة (الثاني)، ثم الحب والانتماء (الثالث)، ثم التقدير وتقدير الذات (الرابع)، ثم تحقيق الذات (الخامس).", ref: "p. 25" },
    { q: "List the characteristics of expected outcomes.", a: "Derived from nursing diagnoses; documented as measurable goals; developed with the client, family and other healthcare providers when possible; realistic in relation to the client's present and potential capabilities; achievable in relation to the client's available resources; written to include a time estimate for achievement and direction for continuity of care.", qar: "اذكر خصائص النتائج المتوقعة.", aar: "مستمدة من التشخيصات التمريضية؛ وموثقة كأهداف قابلة للقياس؛ ومطورة مع المريض والأسرة ومقدمي الرعاية الآخرين متى أمكن؛ وواقعية بالنسبة لقدرات المريض الحالية والمحتملة؛ وقابلة للتحقيق بالنسبة لموارده المتاحة؛ ومكتوبة لتشمل تقديرًا زمنيًا للتحقيق وتوجيهًا لاستمرارية الرعاية.", ref: "p. 27" },
    { q: "List the five components of an expected outcome (goal) statement.", a: "Subject (who is expected to achieve the goal); verb (what action the person must do); condition (under what circumstances); criteria (how well the action is performed); specific time (when it is expected).", qar: "اذكر مكونات عبارة النتيجة المتوقعة (الهدف) الخمسة.", aar: "الفاعل (من المتوقع أن يحقق الهدف)؛ والفعل (ما التصرف المطلوب)؛ والشرط (في أي ظروف)؛ والمعيار (بأي جودة يؤدي التصرف)؛ والوقت المحدد (متى يتوقع تحقيقه).", ref: "p. 28" },
    { q: "Break the lecture's outcome example into its components: 'Mr. Mohammed will walk with a cane at least to the hall and back this afternoon.'", a: "Subject: Mr. Mohammed. Verb: will walk. Condition: with a cane. Criteria: at least to the end of the hall and back. Time: this afternoon.", qar: "قسّم مثال المحاضرة للنتيجة المتوقعة إلى مكوناته: 'سيتمكن السيد محمد من المشي بالعصا حتى نهاية الردهة والعودة بعد ظهر اليوم.'", aar: "الفاعل: السيد محمد. الفعل: سيمشي. الشرط: بالعصا. المعيار: حتى نهاية الردهة والعودة على الأقل. الوقت: بعد ظهر اليوم.", ref: "pp. 28-29" },
    { q: "Give examples of measurable verbs for outcomes.", a: "Identify, describe, communicate, perform, cough, relate, state, list, verbalize, exercise, hold, demonstrate, share, walk, sit, stand, discuss, express; also 'has an increase in', 'has a decrease in', 'has an absence of'.", qar: "اذكر أمثلة على الأفعال القابلة للقياس في النتائج المتوقعة.", aar: "يحدد، ويصف، ويتواصل، ويؤدي، ويسعل، ويربط، ويذكر، ويعدّد، ويعبّر لفظيًا، ويتمرن، ويمسك، ويوضح عمليًا، ويشارك، ويمشي، ويجلس، ويقف، ويناقش، ويعبّر؛ وكذلك 'لديه زيادة في' و'لديه نقص في' و'لديه غياب لـ'.", ref: "p. 30" },
    { q: "Give examples of nonmeasurable verbs to avoid in outcomes.", a: "Know, understand, appreciate, think, accept, feel.", qar: "اذكر أمثلة على أفعال غير قابلة للقياس يجب تجنبها في النتائج المتوقعة.", aar: "يعرف، ويفهم، ويقدّر، ويفكر، ويقبل، ويشعر.", ref: "p. 31" },
    { q: "What is implementation in the nursing process?", a: "The action phase of the nursing process in which nursing care is provided: the actual initiation of the plan and recording of nursing actions. Its purpose is to provide the technical and therapeutic nursing care required to help the client achieve an optimal level of health.", qar: "ما التنفيذ في العملية التمريضية؟", aar: "مرحلة العمل في العملية التمريضية التي تُقدَّم فيها الرعاية التمريضية: البدء الفعلي للخطة وتسجيل الأفعال التمريضية. وهدفها تقديم الرعاية التمريضية الفنية والعلاجية اللازمة لمساعدة المريض على بلوغ المستوى الأمثل من الصحة.", ref: "p. 32" },
    { q: "What is evaluation in the nursing process?", a: "The phase that follows implementation of the plan of care; defined as the judgment of the effectiveness of nursing care in meeting client goals based on the client's behavioral responses. It involves a thorough, systematic review of the effectiveness of nursing interventions and a determination of client goal achievement.", qar: "ما التقويم في العملية التمريضية؟", aar: "المرحلة التي تلي تنفيذ خطة الرعاية؛ وتُعرَّف بالحكم على فعالية الرعاية التمريضية في تحقيق أهداف المريض بناءً على استجاباته السلوكية. وتتضمن مراجعة شاملة ومنهجية لفعالية التدخلات التمريضية وتحديد مدى تحقيق أهداف المريض.", ref: "p. 33" },
    { q: "Case: Aseel reports she is depressed and has no control over activities; she is quadriplegic with a rigorous schedule of daily physical therapy. Sort the data.", a: "Subjective data: her report of being depressed and having no control over activities. Objective data: quadriplegia and the rigorous schedule of daily physical therapy.", qar: "حالة: أصيل تقول إنها مكتئبة ولا تسيطر على أنشطتها؛ وهي مصابة بشلل رباعي ولديها جدول مكثف من العلاج الطبيعي اليومي. صنّف البيانات.", aar: "بيانات ذاتية: قولها إنها مكتئبة ولا تسيطر على أنشطتها. بيانات موضوعية: الشلل الرباعي وجدول العلاج الطبيعي اليومي المكثف.", ref: "p. 36" },
    { q: "Case: Mr. Saif is confined to bed with casts on both legs; he seems angry and states he does not want to talk to anyone; you are aware he had a fight with his girlfriend. Sort the data.", a: "Subjective data: his statement that he does not want to talk to anyone and his expressed anger. Objective data: confined to bed with casts on both legs; observable anger; the known fight with his girlfriend (background fact relevant to etiology).", qar: "حالة: السيد سيف ملازم للسرير وجبيرة على ساقيه؛ يبدو غاضبًا وقال إنه لا يريد التحدث مع أحد؛ وتعلم أنه تشاجر مع صديقته. صنّف البيانات.", aar: "بيانات ذاتية: قوله إنه لا يريد التحدث مع أحد وشعوره بالغضب. بيانات موضوعية: ملازمة السرير مع جبيرة على الساقين؛ والغضب الملاحظ؛ وعلمك بشجاره مع صديقته (خلفية مهمة للعلة).", ref: "p. 37" },
    { q: "Case: Mrs. Hiba has a temperature of 38.4°C, sleeps a lot, has a poor appetite, and drinks about 2000 mL/day if you offer frequent fluids and encourage her. Sort the data.", a: "Objective data: temperature 38.4°C, sleeping a lot, intake of about 2000 mL/day when encouraged. Subjective data: poor appetite as reported by the patient.", qar: "حالة: السيدة هبة حرارتها 38.4 درجة، وتنام كثيرًا، وشهيتها ضعيفة، وتشرب نحو 2000 مل يوميًا إذا عرضت عليها السوائل بكثرة وشجعتها. صنّف البيانات.", aar: "بيانات موضوعية: درجة الحرارة 38.4، والنوم الكثير، وتناول نحو 2000 مل يوميًا عند التشجيع. بيانات ذاتية: ضعف الشهية كما يذكره المريض.", ref: "p. 38" },
    { q: "Case: Mr. Eslam had his gallbladder removed today under general anesthesia; he has smoked a pack a day for 20 years and has a productive cough. Which type of diagnosis fits?", a: "A risk diagnosis, e.g. Risk for ineffective airway clearance related to smoking and thoracic/abdominal incision pain after surgery.", qar: "حالة: السيد إسلام أُزيلت مرارته اليوم تحت تخدير عام؛ ويدخن علبة يوميًا منذ 20 سنة ولديه سعال مصحوب ببلغم. أي نوع من التشخيص يناسب؟", aar: "تشخيص خطر، مثل: خطر ضعف خلوص مجرى الهواء مرتبط بالتدخين وألم الشق الجراحي بعد العملية.", ref: "pp. 39, 42" },
    { q: "Practice: which of these diagnostic statements start correctly? 1) Risk for constipation related to confinement to bed. 2) Risk for injury related lack of side rails. 3) Pain and anxiety related to surgery. 4) Mastectomy related to cancer.", a: "Only statement 1 is correct. Statement 2 is missing 'to' (related to). Statement 3 names two problems in one statement. Statement 4 uses medical terminology instead of a human-response problem.", qar: "تدريب: أي عبارات التشخيص التالية بدايتها صحيحة؟ 1) خطر الإمساك مرتبط بملازمة السرير. 2) خطر الإصابة مرتبط بغياب جوانب السرير. 3) ألم وقلق مرتبطان بالجراحة. 4) استئصال الثدي مرتبط بالسرطان.", aar: "العبارة 1 فقط صحيحة. العبارة 2 تفتقد حرف الربط الصحيح (related to). العبارة 3 تذكر مشكلتين في عبارة واحدة. العبارة 4 تستخدم مصطلحًا طبيًا بدل مشكلة استجابة إنسانية.", ref: "p. 40" },
    { q: "Give the lecture's three correctly written diagnostic statement examples (case answers).", a: "1) Risk for impaired skin integrity related to prescribed bed rest and loss of sensation in lower extremities. 2) Risk for ineffective airway clearance related to thoracic incision pain. 3) Constipation related to insufficient exercise and inadequate fluid and fiber intake as evidenced by no bowel movement in 4 days.", qar: "اذكر أمثلة المحاضرة الثلاثة لعبارات تشخيص مكتوبة بشكل صحيح (إجابات الحالات).", aar: "1) خطر ضعف سلامة الجلد مرتبط بالراحة في السرير الموصوفة وفقدان الإحساس في الأطراف السفلية. 2) خطر ضعف خلوص مجرى الهواء مرتبط بألم شق الصدر. 3) إمساك مرتبط بنقص التمرين ونقص تناول السوائل والألياف كما يتضح بعدم وجود إخراج منذ 4 أيام.", ref: "pp. 41-43" }
  ]
});
</script>
<script>
var cur=0,idx=0,flipped=false,lang="en";
var T={
en:{title:"Nursing Fundamentals - Flashcards",sub:"Fundamentals of Nursing, 1st year - 8 lectures, 361 cards",q:"Question",a:"Answer",hint:"Tap the card to flip",prev:"Prev",next:"Next",of:"of",btn:"عربي",foot:"Made for Youssef's nursing study site. Content summarized from the course lectures.",ref:"Ref:"},
ar:{title:"أساسيات التمريض - بطاقات المراجعة",sub:"أساسيات التمريض، سنة أولى - 8 محاضرات، 361 بطاقة",q:"السؤال",a:"الإجابة",hint:"اضغط على البطاقة لقلبها",prev:"السابق",next:"التالي",of:"من",btn:"English",foot:"أُعدت لموقع يوسف لمراجعة التمريض. المحتوى ملخص من محاضرات الكورس.",ref:"المصدر:"}
};
function toggleLang(){setLang(lang==="en"?"ar":"en");}
function setLang(l){
lang=l;var t=T[l];
document.documentElement.lang=l;
document.documentElement.dir=(l==="ar"?"rtl":"ltr");
document.getElementById("hTitle").textContent=t.title;
document.getElementById("hSub").textContent=t.sub;
document.getElementById("qLabel").textContent=t.q;
document.getElementById("aLabel").textContent=t.a;
document.getElementById("hint").textContent=t.hint;
document.getElementById("prevLbl").textContent=t.prev;
document.getElementById("nextLbl").textContent=t.next;
document.getElementById("langBtn").textContent=t.btn;
document.getElementById("foot").textContent=t.foot;
buildPicker();render();
}
function buildPicker(){
var p=document.getElementById("picker");p.innerHTML="";
LECTURES.forEach(function(L,i){
var b=document.createElement("button");
b.className="pill"+(i===cur?" active":"");
var name=(lang==="ar"?L.ar:L.en);
b.innerHTML=name+' <span class="cnt">'+L.cards.length+'</span>';
b.onclick=function(){pickLecture(i);};
p.appendChild(b);
});
}
function pickLecture(i){cur=i;idx=0;flipped=false;buildPicker();render();window.scrollTo({top:0,behavior:"smooth"});}
function flip(){flipped=!flipped;render();}
function move(d){idx=Math.min(Math.max(idx+d,0),LECTURES[cur].cards.length-1);flipped=false;render();}
function render(){
var L=LECTURES[cur],c=L.cards[idx],t=T[lang];
document.getElementById("lecTitle").textContent=(lang==="ar"?L.ar:L.en);
document.getElementById("counter").textContent=(idx+1)+" "+t.of+" "+L.cards.length;
document.getElementById("qTxt").textContent=(lang==="ar"?c.qar:c.q);
document.getElementById("aTxt").textContent=(lang==="ar"?c.aar:c.a);
document.getElementById("refTxt").textContent=t.ref+" "+c.ref;
document.getElementById("card").className="card"+(flipped?" flipped":"");
document.getElementById("prevBtn").disabled=(idx===0);
document.getElementById("nextBtn").disabled=(idx===L.cards.length-1);
}
document.addEventListener("keydown",function(e){
if(e.key==="ArrowRight"){lang==="ar"?move(-1):move(1);}
else if(e.key==="ArrowLeft"){lang==="ar"?move(1):move(-1);}
else if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();}
});
setLang("en");
</script>
</body>
